name: 19. Find the tree crowns

# Every tree on every approved lawn, as its own shape, drawn over the map
# somebody traced by hand.
#
# WHAT IT IS FOR. The plan is to hand a tracer each crown as a toggle -- one
# tap, on for grass underneath and off to ignore -- which turns the slowest part
# of tracing a wooded lawn into a row of switches. Nothing here builds that
# interface. This answers the question that decides whether it is worth
# building: are the crowns clean enough to BE toggles.
#
# WHY IT RUNS HERE RATHER THAN IN THE WORKER. A V8 isolate cannot host a
# PyTorch model, and workflow 18 established that nothing on Replicate does
# per-crown segmentation, so calling one per address would mean publishing a
# cog and paying per prediction for ever. The tracing queue is known in advance
# -- lawns sit at 'approved' before anybody opens them -- so the work can be
# done here, where the time is free, and the answer stored.
#
# FREE. Python and the weights are downloads. No predictions are bought.
#
# THE ANSWER IS THE PICTURES, at /predictions.html?set=crowns. The numbers at
# the end of the log say how many crowns and how big, and one number says how
# much of the crown area landed on ground somebody traced as lawn -- which is
# the closest thing here to "would the toggles start in the right position".
on:
  workflow_dispatch:
    inputs:
      model:
        # b0 is the quick one and b5 the good one. This is a one-off judgement
        # over thirty-one lawns and CPU time in CI costs nothing, so the
        # default is the one that gives the idea its fairest hearing: a weak
        # model producing ragged crowns would read as the idea failing.
        description: 'Which tree model'
        type: choice
        default: restor/tcd-segformer-mit-b5
        options:
          - restor/tcd-segformer-mit-b5
          - restor/tcd-segformer-mit-b2
          - restor/tcd-segformer-mit-b0
      gap:
        description: 'Metres between two crowns before they count as two'
        required: false
        default: '3'
      min_crown:
        description: 'Smallest crown to keep, in square metres'
        required: false
        default: '4'

jobs:
  crowns:
    name: Segment the trees, then draw them
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-trees.txt

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Install the model loader
        run: pip install -r tools/requirements-trees.txt

      # The same frames the detector is trained on, written by the same code,
      # so a crown drawn here lands on exactly the pixels a feature would.
      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: '1024'
          NO_BACKBONE: 'true'
        run: node tools/train-detector.js

      - name: Find the crowns
        env:
          IMAGES: frames
          OUT: crowns
          MODEL: ${{ inputs.model }}
          CROWN_GAP_M: ${{ inputs.gap }}
          MIN_CROWN_M2: ${{ inputs.min_crown }}
        run: python3 tools/tree-crowns.py

      # KEPT EVEN IF THE DRAWING FAILS, because the segmentation is seventeen
      # minutes and the drawing is eight seconds. The first time the second
      # step broke it threw away the first step's work, which is a bad trade to
      # make twice.
      #
      # AS ONE TARBALL, because a lawn's id is its coordinates and its method --
      # "-77.6,38.7:sam3:find" -- and upload-artifact rejects a colon in a file
      # name outright. Uploading the directory took the whole run down with it
      # on the attempt after the one it was written to protect. A tar keeps the
      # names it was given.
      - name: Pack the crowns up
        if: always()
        continue-on-error: true
        run: tar -czf crowns.tar.gz crowns/ || true

      - name: Keep the crowns whatever happens next
        if: always()
        # AND NEVER FAIL THE RUN FOR IT. This step exists to save somebody
        # else's work; it has no business ending the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: crowns
          path: crowns.tar.gz
          if-no-files-found: warn

      - name: Draw them over the traced lawns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          CROWNS: crowns
          MODEL: ${{ inputs.model }}
        run: node tools/tree-crowns.js

      - name: If that failed
        if: failure()
        run: |
          echo "Nothing was spent finding this out."
          echo
          echo "The usual reasons, in order:"
          echo "  * the runner could not reach the weights (huggingface.co)"
          echo "  * scale.json missing from the frames, which means the dump"
          echo "    step failed first -- the crowns refuse to be found at an"
          echo "    unknown ground size rather than be found at the wrong one"
          echo "  * mit-b5 ran out of memory; try b2 or b0 before concluding"
          echo "    anything about the idea"
