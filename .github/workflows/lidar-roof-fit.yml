name: 40. Do the lidar's roofs sit on the photo's

# The lidar's ROOF edges slid onto each locked lot's photo (tools/lidar-roof-fit.js,
# public/lib/photo-fit.js edgeFit): one shift per frame, the share of the traced
# lawn under the lidar's roof before and after, and the shifts grouped by lidar
# project (owner, 2026-10-20: "some lidar roof shapes are not centered on the
# foundation and overlap with actual lawn. So yes, there's an alignment issue
# that needs to be addressed"). Pictures: yellow = the roof as the decoder reads
# it today, cyan = moved, green = the traced lawn. Nothing is trained and
# nothing changes on the site.
#
# FREE: GitHub's own CPU runner. Public EPT clouds only, read in Node.
on:
  workflow_dispatch:
    inputs:
      lawns:
        description: 'Which lawns'
        required: false
        default: 'locked'
        type: choice
        options: [locked, all]

jobs:
  check:
    name: The lidar's roofs against each photo
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write   # the pictures go to a branch a phone can open
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/train-detector.js

      - name: Match the frames to the 3DEP projects
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js

      - name: Plan the newest flight over each frame
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          MODE: newest
        run: node tools/lidar-newest.js

      - name: Slide the lidar's roofs onto each photo
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          OUT: lidar-roof-fit
          PICTURES: '200'
        run: |
          node tools/lidar-roof-fit.test.js
          node tools/lidar-roof-fit.js

      # An artifact is a zip nobody opens on a phone; a branch of PNGs opens in
      # the GitHub app. Force-pushed, one branch per run, so history never grows.
      - name: Publish the pictures where a phone can see them
        if: always()
        run: |
          set -e
          b="pictures/lidar-roof-fit-${{ github.run_number }}"
          d=$(mktemp -d)
          cp -r lidar-roof-fit/pictures "$d/" 2>/dev/null || { echo "no pictures"; exit 0; }
          cp lidar-roof-fit/*.json "$d/" 2>/dev/null || true
          git -C "$d" init -q -b "$b"
          git -C "$d" -c user.name=actions -c user.email=actions@users.noreply.github.com add -A
          git -C "$d" -c user.name=actions -c user.email=actions@users.noreply.github.com commit -qm "Pictures from run ${{ github.run_id }}"
          git -C "$d" push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:refs/heads/$b"
          echo "PICTURES: https://github.com/${{ github.repository }}/tree/$b/pictures"

      - name: Keep the measurements and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidar-roof-fit
          path: lidar-roof-fit/*
          if-no-files-found: ignore
