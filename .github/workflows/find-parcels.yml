name: 27. Find parcel lines people asked for

# The console's "Counties people asked for and did not get", worked through
# (owner, 2026-10-03). For each county with no property-line service and at
# least `min_people` people behind it, tools/find-parcels.js searches ArcGIS
# Online by the county's name for its parcel layer; tools/verify-counties.js
# then proves what was found exactly as it proves every other county (real
# parcels, a point inside one queried back, a parcel-sized polygon). What
# passes is committed and deployed; what fails is listed with the reason.
on:
  workflow_dispatch:
    inputs:
      min_people:
        description: 'Counties asked for by at least this many people'
        required: false
        default: '2'
      deploy:
        description: 'Deploy when counties were added'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  find:
    name: Search, verify, commit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: Search ArcGIS Online for the asked-for counties
        id: find
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MIN_PEOPLE: ${{ inputs.min_people }}
        run: node tools/find-parcels.js

      - name: Prove what was found
        if: steps.find.outputs.found != '0'
        env:
          FIRST_FIPS: ${{ steps.find.outputs.fips }}
          # Every statewide entry is re-checked on each run as well (see the
          # verifier); this leaves room for them and for every find.
          LIMIT: '80'
        run: node tools/verify-counties.js

      - name: Commit the result
        id: commit
        if: steps.find.outputs.found != '0'
        run: |
          FILES="worker/src/counties-verified.js tools/verify-log.json tools/found-candidates.json"
          if git diff --quiet -- $FILES; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out"
          for f in $FILES; do cp "$f" "$RUNNER_TEMP/out/$(basename "$f")"; done
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME" || { sleep 5; continue; }
            git reset --hard FETCH_HEAD
            for f in $FILES; do cp "$RUNNER_TEMP/out/$(basename "$f")" "$f"; done
            if git diff --quiet -- $FILES; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            git add $FILES
            git commit -m "Parcel lines found for counties people asked for

          Found by tools/find-parcels.js from parcel_gaps and proved by
          tools/verify-counties.js."
            if git push; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Push $attempt failed; the branch moved. Retrying."
            sleep 5
          done
          echo "::error::Could not push after three tries."
          exit 1

      - name: Deploy
        if: steps.commit.outputs.changed == 'true' && inputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "$GITHUB_REF_NAME" -f confirm=deploy

      - name: Keep the files whatever happens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: found-parcels
          path: |
            tools/found-candidates.json
            tools/verify-log.json
          if-no-files-found: ignore
