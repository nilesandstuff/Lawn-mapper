name: W. Water tool

# The lawn water tool (water session): its own folder (water/), its own
# tests, and later its own Worker at water.<home domain>. Nothing here
# touches Lawn Mapper, the shade map or the home page.
#
# FREE. The GitHub runner and public data only (USGS lidar on AWS).
#
#   tests     the water tests (made-up ground with known answers)
#   limits    what the low-spot map can find, on made-up ground: the table in
#             water/FINDINGS.md H8, about 2 minutes
#   corpus    the low-spot map over the locked training maps (the 104 with
#             property lines and lawns), read from the corpus as workflow 17
#             does. Maps are named #1-#104 in the log, never by place.
#   lowspots  the low-spot map for the lots in the WATER_LOTS secret
#             (label,lat,lng per line). The repository is public, so lots
#             live only in that secret: the log prints labels and numbers,
#             never a place, and no maps are uploaded.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: tests
        type: choice
        options: [tests, limits, corpus, lowspots]

permissions:
  contents: read

jobs:
  water:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      - name: Tests
        run: node water/test/lowspots.test.js

      - name: What the low-spot map can find
        if: ${{ inputs.task == 'limits' }}
        run: SEEDS=10 node water/tools/limits.mjs | tee limits.txt

      - name: Low spots over the corpus
        if: ${{ inputs.task == 'corpus' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node water/tools/corpus.mjs | tee corpus.txt

      - name: Low spots on the owner's lots
        if: ${{ inputs.task == 'lowspots' }}
        env:
          WATER_LOTS: ${{ secrets.WATER_LOTS }}
          OUT: ${{ runner.temp }}/water-out
        run: node water/tools/lowspots.mjs | tee lowspots.txt

      - name: The answer
        if: always()
        run: |
          echo "--------------------------------------------------------------"
          case "${{ inputs.task }}" in
            limits)   tail -40 limits.txt 2>/dev/null || echo "no table: see the step above" ;;
            corpus)   sed -n '/=====/,$p' corpus.txt 2>/dev/null || echo "no summary: see the step above" ;;
            lowspots) cat lowspots.txt 2>/dev/null || echo "no lots run: see the step above" ;;
            *)        echo "Water tests: ${{ job.status }}" ;;
          esac
