name: W. Water tool

# The lawn water tool (water session): its own folder (water/), its own
# tests and its own Worker at water.<home domain>. Nothing here touches
# Lawn Mapper, the shade map or the home page.
#
# FREE. The GitHub runner, Cloudflare's free Worker, and public data only
# (USGS lidar on AWS; addresses, property lines and photos asked of Lawn
# Mapper's own routes).
#
#   tests     the water tests (made-up ground with known answers)
#   deploy    the tests, then the water site to water.<home domain> (the
#             domain derived from vars.CUSTOM_DOMAIN, as the home page's is)
#   limits    what the low-spot map can find, on made-up ground: the table in
#             water/FINDINGS.md H8, about 2 minutes
#   corpus    the low-spot map over the locked training maps (the 104 with
#             property lines and lawns), read from the corpus as workflow 17
#             does. Maps are named #1-#104 in the log, never by place.
#   surfaces  is each 1 m cell lawn? the points' measures (brightness,
#             returns, canopy...) fitted on half the corpus's traced lawns
#             and scored on the other half (water/FINDINGS.md H11)
#   paving-sam  the impervious scoring plus SAM 3 on Replicate asked for paving (PAID:
#             the owner's REPLICATE_TOKEN; at most 80 predictions, about half a cent each)
#   flair     IGNF's FLAIR land-cover U-Nets (photo; + NIR; + lidar height), out of the box,
#             scored on the same held-out squares and cells as the paving and roof finders
#   impervious  roofs and imperviousness scored on the Chesapeake Bay
#             Program's 1 m land use, residential squares in VA/MD/PA
#             (water/FINDINGS.md H12)
#   baro      the owner's barometer on the spreader against the lidar ground,
#             visit by visit (the shade map's field readings; numbers only)
#   lowspots  the low-spot map for the lots in the WATER_LOTS secret
#             (label,lat,lng per line). The repository is public, so lots
#             live only in that secret: the log prints labels and numbers,
#             never a place, and no maps are uploaded.
on:
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: tests
        type: choice
        options: [tests, deploy, limits, corpus, surfaces, impervious, paving-sam, flair, baro, lowspots]

permissions:
  contents: read

jobs:
  water:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      - name: Tests
        run: |
          node water/test/lowspots.test.js
          node water/test/site.test.js
          node water/test/plan.test.js
          node water/test/heads.test.js
          node water/test/hydraulics.test.js && node water/test/layout.test.js && node water/test/measured.test.js && node water/test/advice.test.js

      - name: The water database (gauge readings)
        if: ${{ inputs.task == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node water/tools/d1.mjs

      - name: Deploy the water site
        if: ${{ inputs.task == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          node water/tools/prepare.mjs
          if npx wrangler deploy --config water/wrangler.toml > water-deploy.log 2>&1; then
            tail -8 water-deploy.log
            d=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' water/wrangler.toml)
            who=$(grep -q 'ADMIN_ONLY = "1"' water/wrangler.toml && echo "admin only" || echo "open to everyone")
            echo "WATER_STATE=live ($who) at https://$d" >> "$GITHUB_ENV"
          else
            tail -30 water-deploy.log
            echo "WATER_STATE=did not deploy -- see the step above" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Is it answering
        if: ${{ inputs.task == 'deploy' }}
        run: |
          d=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' water/wrangler.toml)
          for i in 1 2 3 4 5 6; do
            body=$(curl -s "https://$d/" || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$d/" || true)
            # admin only until it ships: signed out, the runner should be shown the "not open yet" page
            if echo "$body" | grep -q "isn't open yet"; then echo "answering, admin only (signed out: not open yet)"; exit 0; fi
            if [ "$code" = 200 ]; then echo "answering, open to everyone"; exit 0; fi
            if [ "$code" = 403 ]; then
              echo "WATER_STATE=${WATER_STATE} (the zone answers GitHub's runner 403, so it can't be checked from here)" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "page $code -- waiting for the new domain"; sleep 20
          done
          echo "WATER_STATE=${WATER_STATE} (but not answering yet: a new custom domain can take a few minutes)" >> "$GITHUB_ENV"

      - name: What the low-spot map can find
        if: ${{ inputs.task == 'limits' }}
        run: SEEDS=10 node water/tools/limits.mjs | tee limits.txt

      - name: Low spots over the corpus
        if: ${{ inputs.task == 'corpus' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node water/tools/corpus.mjs | tee corpus.txt

      - name: Is each cell lawn (fit on half the corpus, test on the rest)
        if: ${{ inputs.task == 'surfaces' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node water/tools/surfaces.mjs | tee surfaces.txt

      - name: Roofs and imperviousness on the Chesapeake land use
        if: ${{ inputs.task == 'impervious' }}
        run: SQUARES=24 node water/tools/impervious.mjs | tee impervious.txt
      - name: FLAIR -- Python, PyTorch (CPU) and its published weights
        if: ${{ inputs.task == 'flair' }}
        run: |
          python3 -m pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python3 -m pip install -q segmentation-models-pytorch scipy pillow numpy
          mkdir -p flair
          for v in rgb rgbi rgbie; do
            curl -sSfL --retry 3 -o "flair/$v.pth" "https://huggingface.co/IGNF/FLAIR-INC_${v}_15cl_resnet34-unet/resolve/main/FLAIR-INC_${v}_15cl_resnet34-unet_weights.pth"
          done
      - name: FLAIR against the lidar + photo paving model and the roof finders, same squares
        if: ${{ inputs.task == 'flair' }}
        run: |
          SQUARES=24 DUMP=flair-in node water/tools/impervious.mjs > impervious.txt
          tail -3 impervious.txt
          DUMP=flair-in WEIGHTS=flair python3 water/tools/flair_score.py | tee flair.txt
      - name: Paving by SAM 3 on Replicate, against the lidar and the photo (paid, capped)
        if: ${{ inputs.task == 'paving-sam' }}
        env:
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_TOKEN }}
          SAM: '1'
        run: SQUARES=24 node water/tools/impervious.mjs | tee impervious.txt

      - name: The owner's barometer against the lidar ground
        if: ${{ inputs.task == 'baro' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node water/tools/baro.mjs | tee baro.txt

      - name: Low spots on the owner's lots
        if: ${{ inputs.task == 'lowspots' }}
        env:
          WATER_LOTS: ${{ secrets.WATER_LOTS }}
          OUT: ${{ runner.temp }}/water-out
        run: node water/tools/lowspots.mjs | tee lowspots.txt

      - name: The answer
        if: always()
        run: |
          echo "--------------------------------------------------------------"
          case "${{ inputs.task }}" in
            limits)   tail -40 limits.txt 2>/dev/null || echo "no table: see the step above" ;;
            corpus)   sed -n '/=====/,$p' corpus.txt 2>/dev/null || echo "no summary: see the step above" ;;
            surfaces) sed -n '/=====/,$p' surfaces.txt 2>/dev/null || echo "no summary: see the step above" ;;
            impervious|paving-sam) sed -n '/=====/,$p' impervious.txt 2>/dev/null || echo "no summary: see the step above" ;;
            flair)    sed -n '/=====/,$p' flair.txt 2>/dev/null || echo "no summary: see the step above" ;;
            baro)     sed -n '/=====/,$p' baro.txt 2>/dev/null || echo "no summary: see the step above" ;;
            lowspots) cat lowspots.txt 2>/dev/null || echo "no lots run: see the step above" ;;
            deploy)   echo "Water site: ${WATER_STATE:-not deployed -- see the steps above}" ;;
            *)        echo "Water tests: ${{ job.status }}" ;;
          esac
