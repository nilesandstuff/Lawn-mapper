name: 25. Fetch not-lawn examples for review

# EXAMPLES OF THINGS THAT ARE CERTAINLY NOT LAWN, AWAY FROM OUR OWN MAPS
# (owner, 2026-09-27). About 150 places near our corpus -- half water, the
# rest houses, pools, driveways, car parks, roads and sidewalks -- that
# OpenStreetMap or USGS has already outlined, each photographed exactly as a
# finished map is (tools/not_lawn_candidates.py picks them, never within
# 400 m of a map we score; tools/not-lawn-examples.js photographs them).
#
# NOTHING HERE REACHES THE DETECTOR. Every example is a DRAFT for the owner to
# review on /outlines.html: drop wrong outlines, approve, or reject. Training
# will teach only approved, kept outlines as "not lawn" and ignore the rest
# of each picture.
#
# The first version of this workflow fetched outlines over our own maps,
# which mostly repeats what the tracing already says; the owner caught it.
on:
  workflow_dispatch:
    inputs:
      quota:
        description: 'A top-up: only these classes, e.g. pool:14,parking:10 (empty = the full ~150)'
        default: ''
      id_start:
        description: 'For a top-up, number on from the saved examples, e.g. pool:2,parking:6 -- or they overwrite'
        default: ''
      seed:
        description: 'Random seed for where to search (change it for a top-up, to search new places)'
        default: '7'
      mode:
        description: 'fetch (pick, photograph, save drafts) or audit (read-only: print what is stored for every reviewed example)'
        default: 'fetch'

jobs:
  examples:
    name: Pick, photograph and save drafts for the owner to review
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci

      - name: What is stored for every reviewed example (read-only)
        if: ${{ inputs.mode == 'audit' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/not-lawn-examples.js audit

      - name: Check the parsing and the picking before trusting them
        if: ${{ inputs.mode != 'audit' }}
        working-directory: tools
        run: |
          python3 public_negatives_test.py
          python3 not_lawn_candidates_test.py
          node outlines.test.js

      - name: Where our maps are (to search near, and to keep clear of)
        if: ${{ inputs.mode != 'audit' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/not-lawn-examples.js seeds > seeds.json

      - name: Pick about 150 outlined places
        if: ${{ inputs.mode != 'audit' }}
        working-directory: tools
        env:
          QUOTA: ${{ inputs.quota }}
          ID_START: ${{ inputs.id_start }}
          SEED: ${{ inputs.seed }}
        run: python3 not_lawn_candidates.py ../seeds.json ../candidates.json

      - name: Photograph them as a map is photographed
        if: ${{ inputs.mode != 'audit' }}
        env:
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: node tools/not-lawn-examples.js fetch candidates.json examples

      - name: Save them as drafts
        if: ${{ inputs.mode != 'audit' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/not-lawn-examples.js upload examples

      - name: Where to look
        if: always()
        run: |
          echo
          echo "Drafts are on the site at /outlines.html (owner only)."
          echo "Nothing is shown to the detector until it is approved there."
