name: 3. Find county servers

# Diagnostic, run when parcel lookups stop working. Walks each county's ArcGIS
# services directory looking for a parcel layer that actually answers, and
# prints a config block for whatever it finds.
#
# Read-only: it issues GETs against public county services and changes nothing.
on:
  workflow_dispatch:
    inputs:
      county:
        description: 'One key (indiana, vanderburgh, wayne, champaign, washoe, kent, ottawa, allegan, muskegon, newaygo), blank for all, or "none" to skip'
        required: false
        default: ''
      statewide:
        description: 'Also hunt for STATEWIDE parcel services (one endpoint per state)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      states:
        description: 'Which states to probe, comma separated. Blank = all candidates.'
        required: false
        default: ''

jobs:
  discover:
    name: Search for working parcel layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Search
        run: node tools/discover-counties.js ${{ inputs.county }}

      # North Carolina turned out to publish every county's parcels from one
      # state endpoint, which made adding the whole state a bounding box. This
      # asks which other states do the same. Every URL it tries is a guess;
      # the point of running it is to find out which guesses are right.
      - name: Hunt for statewide parcel services
        if: inputs.statewide == 'true'
        env:
          STATES: ${{ inputs.states }}
        run: node tools/probe-statewide.js
