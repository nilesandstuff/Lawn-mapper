name: 4. Browser test

# Runs the real app in a real browser against the real Mapbox libraries, which
# is the only place bugs in the map interaction itself can show up.
#
# Stops before "Detect my lawn", so it spends nothing on Replicate. It uses a
# geocode and a few map tiles from your Mapbox allowance.
on:
  workflow_dispatch:
    inputs:
      detect:
        description: 'Also run a REAL detection (costs a few cents)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      address:
        description: 'Address to test (blank = a known Ottawa County lot)'
        required: false
        default: ''
        type: string

jobs:
  browser:
    name: Drive the app in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Not a project dependency: it would slow every other workflow's install
      # for something only this job needs.
      - name: Install Playwright
        run: |
          npm install playwright --no-save
          npx playwright install --with-deps chromium

      - name: Start the app
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_TOKEN }}
        run: |
          # The browser here runs on 127.0.0.1, which is not one of the domains
          # MAPBOX_TOKEN is restricted to, so handing it to the page means every
          # tile comes back 403 and the test drives a map with no imagery on it.
          # Locally the unrestricted token is the right one for both jobs; the
          # restriction exists to protect the token once it is on a public page.
          DEV_TOKEN="${MAPBOX_SERVER_TOKEN:-$MAPBOX_TOKEN}"
          printf 'MAPBOX_TOKEN=%s\nMAPBOX_SERVER_TOKEN=%s\nREPLICATE_TOKEN=%s\n' \
            "$DEV_TOKEN" "$DEV_TOKEN" "$REPLICATE_TOKEN" > .dev.vars
          npx wrangler dev --port 8787 --local > wrangler.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/api/config; then
              echo "app is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the app never came up"; cat wrangler.log; exit 1

      - name: Drive it
        env:
          RUN_DETECT: ${{ inputs.detect }}
          TEST_ADDRESS: ${{ inputs.address }}
        run: node tools/browser-test.mjs http://127.0.0.1:8787

      - name: Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshot
          path: browser-test.png
          if-no-files-found: ignore

      - name: Worker log
        if: failure()
        run: cat wrangler.log || true
