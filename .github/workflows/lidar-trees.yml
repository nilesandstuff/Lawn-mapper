name: 30. Trees from the lidar

# THE LIDAR IN PLACE OF THE TREE MODEL (owner, 2026-10-05: "the restor/tcd
# model misses a lot of trees, especially narrow trees ... use lidar to
# replace the tree canopy model all together ... tee up the results in a
# separate viewer page"). Per approved map: the 3DEP point cloud by return
# (tools/tree_lidar.py), trees from it alone (tools/lidar_canopy.py: over 2 m,
# pulses split or classed vegetation, not a roof), written beside the tree
# model's canopy for /lidar-trees.html (tools/lidar-trees.js). Free: downloads
# and arithmetic on the GitHub runner.
on:
  workflow_dispatch:
    inputs:
      lawns:
        description: 'Which lawns: every approved map (all), the frozen benchmark of 32, or only those since the freeze (new)'
        type: choice
        default: 'all'
        options: ['all', 'benchmark', 'new']
      min_height_m:
        description: 'Shortest tree, in metres over the ground'
        required: false
        default: '2'
      dense_pen:
        description: 'Dense = fewer than this share of last returns reach the ground'
        required: false
        default: '0.8'

jobs:
  trees:
    name: Find trees in the lidar and write the viewer maps
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-lidar.txt
      - name: Install the lidar reader and the tracer
        run: pip install -r tools/requirements-lidar.txt numpy scipy scikit-image pillow
      - name: Check the readers
        run: |
          (cd tools && python3 tree_lidar_test.py && python3 lidar_canopy_test.py)
          node tools/lidar-trees.test.js

      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/train-detector.js
      - name: Match the frames to the 3DEP projects
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js
      - name: Read the lidar by return
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          OUT: tree-lidar
        run: python3 tools/tree_lidar.py
      - name: Find the trees in it
        env:
          FRAMES: frames
          LIDAR: tree-lidar
          OUT: lidar-canopy
          MIN_H_M: ${{ inputs.min_height_m }}
          DENSE_PEN: ${{ inputs.dense_pen }}
        run: python3 tools/lidar_canopy.py
      - name: Write the viewer maps
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          CANOPY: lidar-canopy
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/lidar-trees.js
