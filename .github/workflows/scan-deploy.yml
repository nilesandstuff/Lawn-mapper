name: S. Yard AR tool

# The yard AR tool (core session, docs/SCAN-PLAN.md): its own folder (scan/),
# its own tests and its own Worker at scan.<home domain>. Nothing here touches
# Lawn Mapper, the shade map, the water map or the home page.
#
# FREE. The GitHub runner and Cloudflare's free Worker. The 8th Wall engine
# binary is installed from npm at deploy time (pinned in scan/tools/prepare.mjs)
# and copied into the site as it is, notice and LICENSE included.
#
#   tests     the scan tests (Node, no phone needed)
#   deploy    the tests, then the site to scan.<home domain> (the domain
#             derived from vars.CUSTOM_DOMAIN, as the water tool's is).
#             ADMIN ONLY until docs/SCAN-PLAN.md phase 3 passes.
#   walks     print the walks the phone saved to the site (newest first):
#             distances and counts only, read from the log, no copying.
#   twin      one walk's twin against the lidar the AR read, in numbers
#             (scan/tools/twin-check.mjs): where the solid cells came
#             from, how many of the phone's points land. No places.
on:
  # THE SHARED LIDAR RULE (CLAUDE.md "One way to read lidar"): this site copies public/shade/ in at deploy time, so a
  # change to structures.js or what it imports, landed on the default branch, redeploys it by itself.
  push:
    branches: [claude/resume-previous-session-y94slo]
    paths:
      - 'public/shade/structures.js'
      - 'public/shade/canopy.js'
      - 'public/shade/grid.js'
      - 'public/shade/ground.js'
      - 'public/shade/ept.js'
      - 'public/shade/las.js'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: tests
        type: choice
        options: [tests, deploy, walks, twin, fix, place, depth, study, skyline, pavement, checks, repeat, register, walkfix, walkfixjs, reference, warp, marks, naip, drive]
      walk:
        description: 'For twin, fix or depth: the walk id, or latest'
        default: latest
      calib:
        description: 'For skyline: the phone camera turn,tilt in degrees (e.g. -0.6,-3.1); empty for none'
        default: ''
      slack:
        description: 'For skyline: degrees a leaf-off tree top may stand above the lidar (0 for none)'
        default: '0'
      lag:
        description: 'For skyline: milliseconds each picture lags its pose (0 for none)'
        default: '0'
      truth:
        description: 'For skyline: checks (the check points own fit) or refs (the references placement)'
        default: checks
      narrow:
        description: 'For skyline: 1 to search on roof-edge and open-sky samples alone'
        default: '0'
      mapfrom:
        description: 'For place: a walk recorded with no map open takes its map (and check points) from this walk id'
        default: ''

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      - name: Tests
        run: |
          node scan/test/frames.test.js
          node scan/test/walk.test.js
          node scan/test/track.test.js
          node scan/test/worker.test.js
          node scan/test/prepare.test.js
          node scan/test/align.test.js
          node scan/test/locate.test.js
          node scan/test/photo.test.js
          node scan/test/lidar.test.js
          node scan/test/twin.test.js
          node scan/test/minimap.test.js
          node scan/test/surface.test.js
          node scan/test/outline.test.js
          node scan/test/postfix.test.js
          node scan/test/anchors.test.js
          node scan/test/app.test.js
          node scan/test/outbox.test.js
          node scan/test/maps-pick.test.js
          node scan/test/geo.test.js
          node scan/test/semantics.test.js
          node scan/test/walkfix.test.js
          node tools/lidar-model.test.js

      - name: The 8th Wall engine binary (pinned)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        run: |
          v=$(sed -n "s/^export const ENGINE_VERSION = '\(.*\)';/\1/p" scan/tools/prepare.mjs)
          echo "engine version $v" 
          npm install --no-save --no-audit --no-fund "@8thwall/engine-binary@$v"
          ls -la node_modules/@8thwall/engine-binary/dist | head
          head -c 400 node_modules/@8thwall/engine-binary/dist/xr.js; echo

      - name: The scan database (walks)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scan/tools/d1.mjs

      - name: The twin bucket (the walks' points, track and pictures)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scan/tools/r2.mjs

      - name: Deploy the scan site
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          node scan/tools/prepare.mjs
          # the built page opened in a browser first (scan/tools/page-check.mjs): a page that throws is not deployed
          npm install playwright --no-save --no-audit --no-fund > /dev/null 2>&1
          npx playwright install --with-deps chromium > /dev/null 2>&1
          node scan/tools/page-check.mjs
          if npx wrangler deploy --config scan/wrangler.toml > scan-deploy.log 2>&1; then
            tail -8 scan-deploy.log
            d=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' scan/wrangler.toml)
            who=$(grep -q 'ADMIN_ONLY = "1"' scan/wrangler.toml && echo "admin only" || echo "open to everyone")
            echo "SCAN_STATE=live ($who) at https://$d" >> "$GITHUB_ENV"
          else
            tail -30 scan-deploy.log
            echo "SCAN_STATE=did not deploy -- see the step above" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Is it answering
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        run: |
          d=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' scan/wrangler.toml)
          for i in 1 2 3 4 5 6; do
            body=$(curl -s "https://$d/" || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$d/" || true)
            if echo "$body" | grep -q "isn't open yet"; then echo "answering, admin only (signed out: not open yet)"; exit 0; fi
            if [ "$code" = 200 ]; then echo "answering, open to everyone"; exit 0; fi
            if [ "$code" = 403 ]; then
              echo "SCAN_STATE=${SCAN_STATE} (the zone answers GitHub's runner 403, so it can't be checked from here)" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "page $code -- waiting for the new domain"; sleep 20
          done
          echo "SCAN_STATE=${SCAN_STATE} (but not answering yet: a new custom domain can take a few minutes)" >> "$GITHUB_ENV"

      - name: The walks kept on the site
        if: ${{ inputs.task == 'walks' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: BRIEF=1 N=6 node scan/tools/walks.mjs | tee walks.txt

      - name: A walk's twin against the lidar
        if: ${{ inputs.task == 'twin' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
        run: |
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/twin-check.mjs twin | tee twin.txt

      # RECORD FIRST, FIX AFTERWARDS (scan/lib/postfix.js): the whole walk placed on the model, its pins put on the map,
      # its check points scored; fixed.json and mesh.bin kept in the walk's folder of the twin bucket. No pictures read.
      - name: A walk fixed afterwards
        if: ${{ inputs.task == 'fix' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/post-fix.mjs twin | tee fix.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/fixed.json twin/mesh.bin | tee -a fix.txt

      # WHAT CAN PLACE THIS WALK (scan/tools/match-study.mjs): each kind of evidence scored round the references' fit.
      - name: What can place a walk
        if: ${{ inputs.task == 'study' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/match-study.mjs twin | tee study.txt

      # DEPTH FROM ONE PICTURE (scan/tools/depth_run.py): a public depth model on every picture of the walk, scaled to
      # ARCore's points from the same moment, and the two compared. Free runner, CPU. Kept beside the twin for later.
      - uses: actions/setup-python@v5
        if: ${{ inputs.task == 'depth' }}
        with:
          python-version: '3.11'
      - name: A walk's pictures through a depth model
        if: ${{ inputs.task == 'depth' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45" pillow numpy
          node scan/tools/twin-r2.mjs get "$WALK" twin
          python scan/tools/depth_run.py twin | tee depth.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/depth-summary.json twin/depth-maps.npz | tee -a depth.txt

      # CAN THE SKYLINE PLACE A WALK (scan/tools/skyline_study.py, SCAN-H11 option 1): the sky in each picture against
      # the shade map's model seen from every placement; scored against the check points. CPU, free.
      - name: Run actions/setup-python@v5 (skyline)
        if: ${{ inputs.task == 'skyline' || inputs.task == 'pavement' || inputs.task == 'place' || inputs.task == 'checks' || inputs.task == 'register' || inputs.task == 'walkfix' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: A walk's skyline against the lidar
        if: ${{ inputs.task == 'skyline' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          SKY_CAL: ${{ inputs.calib }}
          SKY_TREE_SLACK: ${{ inputs.slack }}
          SKY_LAG: ${{ inputs.lag }}
          SKY_TRUTH: ${{ inputs.truth }}
          SKY_NARROW: ${{ inputs.narrow }}
        run: |
          set -o pipefail
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45" pillow numpy
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/skyline-prep.mjs twin | tee skyline.txt
          python scan/tools/skyline_study.py twin | tee -a skyline.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/skyline.json | tee -a skyline.txt

      # PLACE A WALK FROM ITS PICTURES (SCAN-H19): the skyline for the coarse placement, the lidar's brightness under the
      # pavement and the ground's shape for the fine one, then the after-the-walk fix with it (used when the walk has
      # no references). Keeps skyline.json, pavement.json, placement.json, fixed.json and mesh.bin beside the twin.
      - name: A walk placed from its pictures
        if: ${{ inputs.task == 'place' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          MAPFROM: ${{ inputs.mapfrom }}
          SKY_LEAN: '1'
        run: |
          set -o pipefail
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45" pillow numpy scipy small_gicp
          node scan/tools/twin-r2.mjs get "$WALK" twin
          : > place.txt
          # a walk recorded with no map open (the app before its picker, 2026-11-07): its map from another walk, kept
          if [ -n "$MAPFROM" ]; then
            node scan/tools/twin-map.mjs twin "$MAPFROM" | tee -a place.txt
            node scan/tools/twin-r2.mjs put "$WALK" twin/meta.json twin/live.json | tee -a place.txt
          fi
          node scan/tools/skyline-prep.mjs twin | tee -a place.txt
          python scan/tools/skyline_study.py twin | tee -a place.txt
          python scan/tools/pavement_study.py twin | tee -a place.txt
          # SCAN-PLAN 12: the walk's depth points as sight lines through the model (study: placement.json unchanged)
          python scan/tools/view_study.py twin | tee -a place.txt
          # which depth points are real (the walk's own lines, then the model); the moments near readings cluster
          python scan/tools/depth_audit.py twin | tee -a place.txt
          node scan/tools/post-fix.mjs twin | tee -a place.txt
          # the best fit overall (the owner, 2026-11-08): ground, buildings, things, pavement, each capped; nothing lost
          # for what changed, only for seeing through a house (study: placement.json unchanged)
          python scan/tools/consensus_study.py twin | tee -a place.txt
          # the walk registered to the lidar with small_gicp, ground first (the research report's recipe; study only)
          python scan/tools/register_study.py twin | tee -a place.txt
          # the walk inspector's data (scan/public/inspect.html): per-point verdicts, credits, placements; private bucket
          python scan/tools/inspect_build.py twin | tee -a place.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/skyline.json twin/pavement.json twin/placement.json twin/fixed.json twin/mesh.bin $(test -f twin/view.json && echo twin/view.json) $(test -f twin/consensus.json && echo twin/consensus.json) $(test -f twin/registration.json && echo twin/registration.json) $(test -f twin/inspect.json && echo twin/inspect.json twin/inspect-points.bin) | tee -a place.txt

      # PAVEMENT FROM THE PICTURES (scan/tools/pavement_study.py): road and sidewalk pixels cast onto the ground, kept
      # for the match against the model's intensity when it has one; tested against the traced lawn meanwhile.
      - name: A walk's pavement from its pictures
        if: ${{ inputs.task == 'pavement' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45" pillow numpy scipy
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/skyline-prep.mjs twin | tee pavement.txt
          python scan/tools/pavement_study.py twin | tee -a pavement.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/pavement.json | tee -a pavement.txt

      # DO THE CHECK MARKS SIT ON THE LIDAR (scan/tools/checks-shade.mjs; the owner, 2026-11-08: "Are we sure that
      # (1,000, 1,000) and (2,000, 2,000) actually point to where the lidar signatures for those visually recognizable
      # shapes would be"): round each check mark, how far the Mapbox photo the marks were put on sits from the lidar's
      # ground. No pictures read; the photo is fetched for the run and never kept.
      - name: The check marks against the lidar
        if: ${{ inputs.task == 'checks' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/skyline-prep.mjs twin > /dev/null
          node scan/tools/checks-prep.mjs twin | tee checks.txt
          node scan/tools/checks-shade.mjs twin | tee -a checks.txt

      # DO REPEAT WALKS AGREE (scan/tools/repeat_study.mjs; the research report of 2026-11-08: a fit's score "needs
      # held-out checks: surveyed corners, or agreement between repeat walks"): each check mark carried through each
      # walk's own placement; how far apart the walks put it, and the gap they share from the photo's mark. The walk
      # input takes walks comma separated, each already through task place.
      # THE WALK REGISTERED TO THE LIDAR, GROUND FIRST (scan/tools/register_study.py, small_gicp; the research report's
      # recipe, Paired-CSLiDAR): from the starts task place kept. The walk input takes walks comma separated.
      - name: Walks registered to the lidar
        if: ${{ inputs.task == 'register' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          pip install --quiet numpy scipy small_gicp
          : > register.txt
          for W in $(echo "$WALKS" | tr ',' ' '); do
            rm -rf twin
            echo "== walk $W" | tee -a register.txt
            node scan/tools/twin-r2.mjs get "$W" twin | tee -a register.txt
            node scan/tools/skyline-prep.mjs twin > /dev/null
            python scan/tools/register_study.py twin | tee -a register.txt
            node scan/tools/twin-r2.mjs put "$W" twin/registration.json | tee -a register.txt
          done
          if [ "$(echo "$WALKS" | tr ',' ' ' | wc -w)" -ge 2 ]; then node scan/tools/repeat_study.mjs "$WALKS" | tee -a register.txt; fi

      # A WALK PLACED BY AN EARLIER WALK (scan/tools/walk_fix_study.py; the owner, 2026-11-09: "lets try both photos and
      # shapes. If they're about equal, i say let's go with the shapes"): each walk in turn the reference, placed by its
      # marks; the others placed from it by their pictures and by their shapes, scored on their own held-out check
      # marks. The walk input takes walks comma separated (same map). CPU, free.
      - name: Walks placed by an earlier walk
        if: ${{ inputs.task == 'walkfix' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet numpy scipy small_gicp opencv-python-headless
          : > walkfix.txt
          dirs=""
          for W in $(echo "$WALKS" | tr ',' ' '); do
            node scan/tools/twin-r2.mjs get "$W" "w-$W" | tee -a walkfix.txt
            node scan/tools/skyline-prep.mjs "w-$W" > /dev/null
            dirs="$dirs w-$W"
          done
          python scan/tools/walk_fix_study.py $dirs | tee -a walkfix.txt
          # the page's own shape fix (scan/lib/walkref.js), the code the phone runs, on the same walks
          node scan/tools/reference-build.mjs check $dirs | tee -a walkfix.txt

      # THE PHOTOS STRETCHED ONTO THE LIDAR (scan/tools/warp-prep.mjs, warp_study.py; docs/SCAN-PLAN.md section 17):
      # the map's kept photo and Mapbox matched to the lidar's ground brightness (windows, and RoMa on the CPU), a
      # smoothed spline per photo scored on held-out matches, and the owner's check points placed on both photos. The
      # walk input: any walk on the map. CPU, free; keeps the stretched photos under refs/warp/<map>/.
      # THE PLACEMENT MAP'S LIDAR CORNERS ON THE WALK'S MAP (scan/tools/marks-check.mjs; SCAN-PLAN section 21): what
      # the page finds and why each candidate was kept. Counts and reasons only.
      - name: The lidar's corners on a map
        if: ${{ inputs.task == 'marks' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          node scan/tools/marks-check.mjs "$WALK" | tee marks.txt

      # DOES NAIP SIT ON THE LIDAR? (scan/tools/naip-check.mjs; SCAN-PLAN section 22): NAIP's near infrared against the
      # lidar's ground brightness (both near infrared), patch by patch, after a planted slide. The walk input: walks
      # comma separated, or "recent" (the newest walk on each of the last three maps). Dates and distances only.
      - name: NAIP against the lidar
        if: ${{ inputs.task == 'naip' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          node scan/tools/naip-check.mjs "${WALK:-recent}" | tee naip.txt

      # THE DRIVE'S WIDTH ON THE HARD-EDGED GROUND PICTURE (scan/tools/drive-width.mjs; SCAN-PLAN section 23): the
      # owner's test of the picture against a tape measure. Widths and lengths only.
      - name: The drive's width on the ground picture
        if: ${{ inputs.task == 'drive' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          node scan/tools/drive-width.mjs "$WALK" | tee drive.txt

      - name: Photos stretched onto the lidar
        if: ${{ inputs.task == 'warp' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet numpy scipy opencv-python-headless pillow
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "git+https://github.com/Parskatt/RoMa.git" || echo "RoMa did not install: the windows only"
          node scan/tools/warp-prep.mjs "$WALK" warp | tee warp.txt
          python scan/tools/warp_study.py warp | tee -a warp.txt
          node scan/tools/warp-keep.mjs warp | tee -a warp.txt

      # THE PAGE'S OWN SHAPE FIX ALONE (scan/tools/reference-build.mjs check): minutes, not the pictures' 35; a few
      # search settings side by side (WALKREF_VARIANTS). The walk input: walks comma separated, same map.
      - name: The page's shape fix on walks
        if: ${{ inputs.task == 'walkfixjs' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
          NO_PICTURES: '1'
          WALKREF_VARIANTS: '1,4;0.5,4;0.5,2;0.75,3'
        run: |
          set -o pipefail
          dirs=""
          for W in $(echo "$WALKS" | tr ',' ' '); do
            node scan/tools/twin-r2.mjs get "$W" "w-$W" > /dev/null
            dirs="$dirs w-$W"
          done
          node scan/tools/reference-build.mjs check $dirs | tee walkfix.txt

      # THE MAP'S REFERENCE WALK (scan/tools/reference-build.mjs; SCAN-H32): a walk placed by its marks becomes the one
      # that places later walks on its map by their shape, live on the page. The walk input: one walk.
      - name: A walk kept as its map's reference
        if: ${{ inputs.task == 'reference' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs get "$WALK" twin | tee reference.txt
          node scan/tools/reference-build.mjs build twin | tee -a reference.txt

      - name: Repeat walks against each other
        if: ${{ inputs.task == 'repeat' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
        run: |
          set -o pipefail
          node scan/tools/repeat_study.mjs "$WALKS" | tee repeat.txt

      - name: The answer
        if: always()
        run: |
          echo "--------------------------------------------------------------"
          case "${{ inputs.task || 'deploy' }}" in
            deploy)
              echo "Scan site: ${SCAN_STATE:-not deployed -- see the steps above}"
              echo "Engine: ${SCAN_ENGINE:-unknown}"
              if [ -n "$SCAN_R2" ]; then echo "Twins: kept in the $SCAN_R2 bucket, viewed at /twin.html"; else echo "Twins: NOT kept (no bucket: see the twin bucket step)"; fi
              echo "Open it from the dashboard's Yard AR card (admin account), on each phone." ;;
            walks) cat walks.txt 2>/dev/null || echo "no walks read: see the step above" ;;
            twin) cat twin.txt 2>/dev/null || echo "no twin check: see the step above" ;;
            fix) cat fix.txt 2>/dev/null || echo "no fix: see the step above" ;;
            study) cat study.txt 2>/dev/null || echo "no study: see the step above" ;;
            skyline) cat skyline.txt 2>/dev/null || echo "no skyline study: see the step above" ;;
            pavement) cat pavement.txt 2>/dev/null || echo "no pavement study: see the step above" ;;
            place) grep -v '^  model\|^  rays\|^  the picture' place.txt 2>/dev/null | tail -60 || echo "no placement: see the step above" ;;
            register) grep -v '^Twin read\|: kept (' register.txt 2>/dev/null | tail -70 || echo "no registration: see the step above" ;;
            repeat) cat repeat.txt 2>/dev/null || echo "no repeat-walk study: see the step above" ;;
            warp) cat warp.txt 2>/dev/null || echo "no warp study: see the step above" ;;
            marks) cat marks.txt 2>/dev/null || echo "no marks check: see the step above" ;;
            naip) cat naip.txt 2>/dev/null || echo "no NAIP check: see the step above" ;;
            drive) cat drive.txt 2>/dev/null || echo "no drive width: see the step above" ;;
            walkfixjs) cat walkfix.txt 2>/dev/null || echo "no check: see the step above" ;;
            walkfix) grep -v '^Twin read' walkfix.txt 2>/dev/null | tail -40 || echo "no walk-to-walk study: see the step above" ;;
            reference) cat reference.txt 2>/dev/null || echo "no reference: see the step above" ;;
            checks) cat checks.txt 2>/dev/null || echo "no check-mark test: see the step above" ;;
            depth) tail -25 depth.txt 2>/dev/null || echo "no depth run: see the step above" ;;
            *) echo "Scan tests: ${{ job.status }}" ;;
          esac
