name: S. Yard AR tool

# The yard AR tool (core session, docs/SCAN-PLAN.md): its own folder (scan/),
# its own tests and its own Worker at scan.<home domain>. Nothing here touches
# Lawn Mapper, the shade map, the water map or the home page.
#
# FREE. The GitHub runner and Cloudflare's free Worker. The 8th Wall engine
# binary is installed from npm at deploy time (pinned in scan/tools/prepare.mjs)
# and copied into the site as it is, notice and LICENSE included.
#
#   tests     the scan tests (Node, no phone needed)
#   deploy    the tests, then the site to scan.<home domain> (the domain
#             derived from vars.CUSTOM_DOMAIN, as the water tool's is).
#             ADMIN ONLY until docs/SCAN-PLAN.md phase 3 passes.
#   walks     print the walks the phone saved to the site (newest first):
#             distances and counts only, read from the log, no copying.
#   twin      one walk's twin against the lidar the AR read, in numbers
#             (scan/tools/twin-check.mjs): where the solid cells came
#             from, how many of the phone's points land. No places.
on:
  # THE SHARED LIDAR RULE (CLAUDE.md "One way to read lidar"): this site copies public/shade/ in at deploy time, so a
  # change to structures.js or what it imports, landed on the default branch, redeploys it by itself.
  push:
    branches: [claude/resume-previous-session-y94slo]
    paths:
      - 'public/shade/structures.js'
      - 'public/shade/canopy.js'
      - 'public/shade/grid.js'
      - 'public/shade/ground.js'
      - 'public/shade/ept.js'
      - 'public/shade/las.js'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: tests
        type: choice
        options: [tests, deploy, walks, twin]
      walk:
        description: 'For twin: the walk id, or latest'
        default: latest

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      - name: Tests
        run: |
          node scan/test/frames.test.js
          node scan/test/walk.test.js
          node scan/test/track.test.js
          node scan/test/worker.test.js
          node scan/test/prepare.test.js
          node scan/test/align.test.js
          node scan/test/locate.test.js
          node scan/test/photo.test.js
          node scan/test/lidar.test.js
          node scan/test/twin.test.js
          node scan/test/minimap.test.js
          node scan/test/surface.test.js

      - name: The 8th Wall engine binary (pinned)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        run: |
          v=$(sed -n "s/^export const ENGINE_VERSION = '\(.*\)';/\1/p" scan/tools/prepare.mjs)
          echo "engine version $v" 
          npm install --no-save --no-audit --no-fund "@8thwall/engine-binary@$v"
          ls -la node_modules/@8thwall/engine-binary/dist | head
          head -c 400 node_modules/@8thwall/engine-binary/dist/xr.js; echo

      - name: The scan database (walks)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scan/tools/d1.mjs

      - name: The twin bucket (the walks' points, track and pictures)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scan/tools/r2.mjs

      - name: Deploy the scan site
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          node scan/tools/prepare.mjs
          if npx wrangler deploy --config scan/wrangler.toml > scan-deploy.log 2>&1; then
            tail -8 scan-deploy.log
            d=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' scan/wrangler.toml)
            who=$(grep -q 'ADMIN_ONLY = "1"' scan/wrangler.toml && echo "admin only" || echo "open to everyone")
            echo "SCAN_STATE=live ($who) at https://$d" >> "$GITHUB_ENV"
          else
            tail -30 scan-deploy.log
            echo "SCAN_STATE=did not deploy -- see the step above" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Is it answering
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        run: |
          d=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' scan/wrangler.toml)
          for i in 1 2 3 4 5 6; do
            body=$(curl -s "https://$d/" || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$d/" || true)
            if echo "$body" | grep -q "isn't open yet"; then echo "answering, admin only (signed out: not open yet)"; exit 0; fi
            if [ "$code" = 200 ]; then echo "answering, open to everyone"; exit 0; fi
            if [ "$code" = 403 ]; then
              echo "SCAN_STATE=${SCAN_STATE} (the zone answers GitHub's runner 403, so it can't be checked from here)" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "page $code -- waiting for the new domain"; sleep 20
          done
          echo "SCAN_STATE=${SCAN_STATE} (but not answering yet: a new custom domain can take a few minutes)" >> "$GITHUB_ENV"

      - name: The walks kept on the site
        if: ${{ inputs.task == 'walks' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scan/tools/walks.mjs | tee walks.txt

      - name: A walk's twin against the lidar
        if: ${{ inputs.task == 'twin' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
        run: |
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/twin-check.mjs twin | tee twin.txt

      - name: The answer
        if: always()
        run: |
          echo "--------------------------------------------------------------"
          case "${{ inputs.task || 'deploy' }}" in
            deploy)
              echo "Scan site: ${SCAN_STATE:-not deployed -- see the steps above}"
              echo "Engine: ${SCAN_ENGINE:-unknown}"
              if [ -n "$SCAN_R2" ]; then echo "Twins: kept in the $SCAN_R2 bucket, viewed at /twin.html"; else echo "Twins: NOT kept (no bucket: see the twin bucket step)"; fi
              echo "Open it from the dashboard's Yard AR card (admin account), on each phone." ;;
            walks) head -3 walks.txt 2>/dev/null || echo "no walks read: see the step above" ;;
            twin) cat twin.txt 2>/dev/null || echo "no twin check: see the step above" ;;
            *) echo "Scan tests: ${{ job.status }}" ;;
          esac
