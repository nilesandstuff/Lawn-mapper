name: S. Yard AR tool

# The yard AR tool (core session, docs/SCAN-PLAN.md): its own folder (scan/),
# its own tests and its own Worker at scan.<home domain>. Nothing here touches
# Lawn Mapper, the shade map, the water map or the home page.
#
# FREE. The GitHub runner and Cloudflare's free Worker. The 8th Wall engine
# binary is installed from npm at deploy time (pinned in scan/tools/prepare.mjs)
# and copied into the site as it is, notice and LICENSE included.
#
#   tests     the scan tests (Node, no phone needed)
#   deploy    the tests, then the site to scan.<home domain> (the domain
#             derived from vars.CUSTOM_DOMAIN, as the water tool's is).
#             ADMIN ONLY until docs/SCAN-PLAN.md phase 3 passes.
#   walks     print the walks the phone saved to the site (newest first):
#             distances and counts only, read from the log, no copying.
#   twin      one walk's twin against the lidar the AR read, in numbers
#             (scan/tools/twin-check.mjs): where the solid cells came
#             from, how many of the phone's points land. No places.
on:
  # THE SHARED LIDAR RULE (CLAUDE.md "One way to read lidar"): this site copies public/shade/ in at deploy time, so a
  # change to structures.js or what it imports, landed on the default branch, redeploys it by itself.
  push:
    branches: [claude/resume-previous-session-y94slo]
    paths:
      - 'public/shade/structures.js'
      - 'public/shade/canopy.js'
      - 'public/shade/grid.js'
      - 'public/shade/ground.js'
      - 'public/shade/ept.js'
      - 'public/shade/las.js'
      # the fusing's one home (docs/MAPS.md "The fused model"): the scan page runs it too, so a change redeploys this site
      - 'public/shade/fuse.js'
      - 'public/shade/model-out.js'
  workflow_dispatch:
    inputs:
      task:
        description: 'What to run'
        required: true
        default: tests
        type: choice
        options: [tests, deploy, walks, twin, disagree, segment, view, classes, mend, jumps, corners, trunks, crownsky, semcheck, surfaces, placed, prunerecordings, name, learn, fix, place, depth, study, skyline, pavement, checks, repeat, register, walkfix, walkfixjs, reference, warp, marks, naip, drive, thermalindex]
      walk:
        description: 'For twin, fix or depth: the walk id, or latest'
        default: latest
      calib:
        description: 'For skyline: the phone camera turn,tilt in degrees (e.g. -0.6,-3.1); empty for none'
        default: ''
      slack:
        description: 'For skyline: degrees a leaf-off tree top may stand above the lidar (0 for none)'
        default: '0'
      lag:
        description: 'For skyline: milliseconds each picture lags its pose (0 for none)'
        default: '0'
      truth:
        description: 'For skyline: checks (the check points own fit) or refs (the references placement)'
        default: checks
      narrow:
        description: 'For skyline: 1 to search on roof-edge and open-sky samples alone'
        default: '0'
      mapfrom:
        description: 'For place: a walk recorded with no map open takes its map (and check points) from this walk id'
        default: ''

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund

      - name: Tests
        run: |
          node scan/test/frames.test.js
          node scan/test/pin.test.js
          node scan/test/corners.test.js
          node scan/test/things.test.js
          node scan/test/perf.test.js
          node scan/test/guide.test.js
          node scan/test/walk.test.js
          node scan/test/track.test.js
          node scan/test/worker.test.js
          node scan/test/prepare.test.js
          node scan/test/align.test.js
          node scan/test/locate.test.js
          node scan/test/photo.test.js
          node scan/test/lidar.test.js
          node scan/test/twin.test.js
          node scan/test/refkeep.test.js
          node scan/test/disagree.test.js
          node scan/test/thermal.test.js
          node scan/test/thermal-snap.test.js
          node scan/test/reference-route.test.js
          node scan/test/minimap.test.js
          node scan/test/surface.test.js
          node scan/test/outline.test.js
          node scan/test/postfix.test.js
          node scan/test/anchors.test.js
          node scan/test/app.test.js
          node scan/test/outbox.test.js
          node scan/test/maps-pick.test.js
          node scan/test/geo.test.js
          node scan/test/semantics.test.js
          node scan/test/walkfix.test.js
          node scan/test/fuse-walk.test.js
          node scan/test/clear-measure.test.js
          node tools/lidar-model.test.js

      - name: The 8th Wall engine binary (pinned)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        run: |
          v=$(sed -n "s/^export const ENGINE_VERSION = '\(.*\)';/\1/p" scan/tools/prepare.mjs)
          echo "engine version $v" 
          npm install --no-save --no-audit --no-fund "@8thwall/engine-binary@$v"
          ls -la node_modules/@8thwall/engine-binary/dist | head
          head -c 400 node_modules/@8thwall/engine-binary/dist/xr.js; echo

      - name: The scan database (walks)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scan/tools/d1.mjs

      - name: The twin bucket (the walks' points, track and pictures)
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scan/tools/r2.mjs

      - name: Deploy the scan site
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          node scan/tools/prepare.mjs
          # the built page opened in a browser first (scan/tools/page-check.mjs): a page that throws is not deployed
          # (2026-11-11: twice in a row this install sat ten minutes and failed with nothing said, its output thrown
          # away. Now: three minutes at most, then the browser alone without the system packages, which the runner
          # mostly has; and what it said, if both fail.)
          timeout 180 npm install playwright --no-save --no-audit --no-fund > pw.log 2>&1 || { tail -15 pw.log; echo "playwright could not be installed"; exit 1; }
          timeout 180 npx playwright install --with-deps chromium > pw.log 2>&1 \
            || { echo "the browser's system packages did not install in three minutes: trying the browser alone"; tail -5 pw.log; timeout 180 npx playwright install chromium > pw.log 2>&1; } \
            || { tail -15 pw.log; echo "no browser to check the page in"; exit 1; }
          node scan/tools/page-check.mjs
          if npx wrangler deploy --config scan/wrangler.toml > scan-deploy.log 2>&1; then
            tail -8 scan-deploy.log
            d=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' scan/wrangler.toml)
            who=$(grep -q 'ADMIN_ONLY = "1"' scan/wrangler.toml && echo "admin only" || echo "open to everyone")
            echo "SCAN_STATE=live ($who) at https://$d" >> "$GITHUB_ENV"
          else
            tail -30 scan-deploy.log
            echo "SCAN_STATE=did not deploy -- see the step above" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Is it answering
        if: ${{ (inputs.task || 'deploy') == 'deploy' }}
        run: |
          d=$(sed -n 's/^pattern = "\(.*\)"$/\1/p' scan/wrangler.toml)
          for i in 1 2 3 4 5 6; do
            body=$(curl -s "https://$d/" || true)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$d/" || true)
            if echo "$body" | grep -q "isn't open yet"; then echo "answering, admin only (signed out: not open yet)"; exit 0; fi
            if [ "$code" = 200 ]; then echo "answering, open to everyone"; exit 0; fi
            if [ "$code" = 403 ]; then
              echo "SCAN_STATE=${SCAN_STATE} (the zone answers GitHub's runner 403, so it can't be checked from here)" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "page $code -- waiting for the new domain"; sleep 20
          done
          echo "SCAN_STATE=${SCAN_STATE} (but not answering yet: a new custom domain can take a few minutes)" >> "$GITHUB_ENV"

      - name: The walks kept on the site
        if: ${{ inputs.task == 'walks' }}
        env:
          LIST_N: ${{ inputs.walk }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # the walk input, when a number, is how many walks to list (6 when not)
          N=6; if [[ "$LIST_N" =~ ^[0-9]{1,2}$ ]]; then N="$LIST_N"; fi
          BRIEF=1 N=$N node scan/tools/walks.mjs | tee walks.txt
          node scan/tools/twin-r2.mjs refs | tee -a walks.txt
          node scan/tools/twin-r2.mjs sizes | tee -a walks.txt

      - name: A walk's twin against the lidar
        if: ${{ inputs.task == 'twin' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
        run: |
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/twin-check.mjs twin | tee twin.txt

      # WHERE A WALK AND THE LIDAR MODEL DISAGREE (scan/lib/disagree.js, 2026-11-18): the phone's labelled points, placed
      # by the walk's own roof corners, against the shade map's model on 1 m cells. Counts and lengths only.
      - name: Where a walk and the lidar disagree
        if: ${{ inputs.task == 'disagree' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs get "$WALK" twin | tee disagree.txt
          node scan/tools/disagree.mjs twin | tee -a disagree.txt

      # RECORD FIRST, FIX AFTERWARDS (scan/lib/postfix.js): the whole walk placed on the model, its pins put on the map,
      # its check points scored; fixed.json and mesh.bin kept in the walk's folder of the twin bucket. No pictures read.
      - name: A walk fixed afterwards
        if: ${{ inputs.task == 'fix' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/post-fix.mjs twin | tee fix.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/fixed.json twin/mesh.bin | tee -a fix.txt

      # WHAT CAN PLACE THIS WALK (scan/tools/match-study.mjs): each kind of evidence scored round the references' fit.
      - name: What can place a walk
        if: ${{ inputs.task == 'study' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/match-study.mjs twin | tee study.txt

      # DEPTH FROM ONE PICTURE (scan/tools/depth_run.py): a public depth model on every picture of the walk, scaled to
      # ARCore's points from the same moment, and the two compared. Free runner, CPU. Kept beside the twin for later.
      - uses: actions/setup-python@v5
        if: ${{ inputs.task == 'depth' }}
        with:
          python-version: '3.11'
      - name: A walk's pictures through a depth model
        if: ${{ inputs.task == 'depth' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45" pillow numpy
          node scan/tools/twin-r2.mjs get "$WALK" twin
          python scan/tools/depth_run.py twin | tee depth.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/depth-summary.json twin/depth-maps.npz | tee -a depth.txt

      # CAN THE SKYLINE PLACE A WALK (scan/tools/skyline_study.py, SCAN-H11 option 1): the sky in each picture against
      # the shade map's model seen from every placement; scored against the check points. CPU, free.
      - name: Run actions/setup-python@v5 (skyline)
        if: ${{ inputs.task == 'trunks' || inputs.task == 'crownsky' || inputs.task == 'semcheck' || inputs.task == 'surfaces' || inputs.task == 'skyline' || inputs.task == 'pavement' || inputs.task == 'place' || inputs.task == 'checks' || inputs.task == 'register' || inputs.task == 'walkfix' || inputs.task == 'segment' || inputs.task == 'view' || inputs.task == 'classes' || inputs.task == 'mend' || inputs.task == 'jumps' || inputs.task == 'name' || inputs.task == 'learn' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # EVERY POINT OF A WALK IN 3D (scan/public/cloud.html; the owner, 2026-11-19): each point coloured from the picture
      # taken when it was seen, kept beside the twin for the page. CPU, free. Counts only.
      - name: A walk's points made ready for the 3D view
        if: ${{ inputs.task == 'view' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
          JUDGE_OUT: twin/judged.bin
          WITH_SEGMENTS: '1'
        run: |
          set -o pipefail
          pip install --quiet pillow numpy scipy
          STRICT=1 node scan/tools/twin-r2.mjs get "$WALK" twin | tee view.txt
          node scan/tools/disagree.mjs twin > /dev/null || true
          python scan/tools/view_prep.py twin 2>&1 | grep -v '^Shapes tidied' | tee -a view.txt
          python scan/tools/dense_prep.py twin 2>&1 | grep -v '^Shapes tidied' | tee -a view.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/view-rgb.bin twin/view.json twin/view-kind.bin twin/view-dense.bin | tee -a view.txt

      # THE OWNER NAMES THE THINGS (scan/public/name.html; 2026-11-19): the kept shapes of each photo, tidied, and the thing
      # the lift made of each, kept beside the twin for the page. CPU, free. Counts only.
      # THE OLD FULL RECORDINGS DELETED (the owner's yes, 2026-11-20; twin-r2.mjs prune-recordings): only the video files
      # of walks begun before 2026-11-20, listed first, refused if more than 17. Dates and sizes only.
      - name: The old full recordings deleted
        if: ${{ inputs.task == 'prunerecordings' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BEFORE: '2026-11-20T00:00:00Z'
          MOST: '17'
          CONFIRM: delete
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs prune-recordings | tee prune.txt

      # THE ROOF CORNERS' DISTANCES, PHONE AGAINST MAP (scan/tools/corners.mjs, 2026-11-21; the owner: "measure the exact
      # distances between the corners of my roofs to see if our lidar shapes are good or not"). Each walk's two small
      # files only. The walk input: walks comma separated, or latest for the last 40. Distances only, no places.
      - name: The roof corners' distances over the walks
        if: ${{ inputs.task == 'corners' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
        run: |
          set -o pipefail
          if [ "$WALKS" = "latest" ]; then WALKS=""; fi
          node scan/tools/corners.mjs "$WALKS" | tee corners.txt

      # TREE TRUNKS IN A WALK'S OWN POINTS (scan/tools/trunks.py, 2026-11-22): narrow free-standing columns from the
      # ground up, each kept as slices (its own lean and width), beside the twin for the 3D view. Reads the walk's
      # point parts only. CPU, a few minutes. Counts and sizes only.
      - name: A walk's tree trunks
        if: ${{ inputs.task == 'trunks' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet numpy scipy
          # the walk's own kept points (the second try, 2026-11-22: the joined cloud was a miss), their kinds, the start cut
          node scan/tools/twin-r2.mjs parts "$WALK" twin 'cloud-*' 'labels-*' view-kind.bin view-rgb.bin view.json start.json owner-trunks.json live.json meta.json 'track-*' | tee trunks.txt
          # the walk's own fit to its map (three agreeing corners, not known to have slid), for the plants on the map
          node scan/tools/walk-fit.mjs twin | tee -a trunks.txt || true
          python scan/tools/trunks.py twin twin/trunks.json | tee -a trunks.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/trunks.json | tee -a trunks.txt
          # THE PLANTS AT FACE VALUE (scan/tools/plants.py, 2026-11-23, the owner: "just mark trees in general and take
          # their shapes at face value (but clean up the noise)... anything over 3 feet that the phone calls a tree, is
          # a tree"): the same points, on a 1 ft grid, how low and how high plant was seen in each cell
          python scan/tools/plants.py twin twin/plants.json | tee -a trunks.txt
          if [ -f twin/plants.json ]; then node scan/tools/twin-r2.mjs put "$WALK" twin/plants.json twin/plants-phone.json twin/built.json | tee -a trunks.txt; fi
          # the same plants gridded on the map, kept with the map for the start page to put into the map's record
          node scan/tools/plants-keep.mjs "$WALK" twin | tee -a trunks.txt
          # CAN A LEAF-OFF WALK TAKE LIDAR BRANCHES AWAY? (scan/tools/bare_study.py, 2026-11-24, the owner's question):
          # how often a line through a bare crown stops in it, and the walk against itself. No lidar read. Counts only.
          python scan/tools/bare_study.py twin | tee -a trunks.txt || true
          # ARE THE FAR POINTS WRONG, OR ONLY FEW? AND WHICH SOLID POINTS ARE SKY? (scan/tools/range_study.py, 2026-11-23,
          # the owner: no limit by distance "unless you demonstrate that they're just plain wrong"): the walk against
          # what it saw from close. And whether a fused model has been made (fused-check.mjs). Counts and times only.
          python scan/tools/range_study.py twin | tee -a trunks.txt
          node scan/tools/fused-check.mjs | tee -a trunks.txt || true

      # WHAT A WALK'S PINS SAY ABOUT THE WALK (scan/tools/placed.mjs, 2026-11-22): one thing pinned twice, or a plain pin
      # on a marked corner, measured in the walk's own frame and on the map. Two small files. Distances only.
      - name: A walk's pins, one against another
        if: ${{ inputs.task == 'placed' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          # "<walk>:doubled" (or ":doubled:dry"): a walk shown not to have come back to itself has the things it placed
          # twice looked over, the later of each two taken away (scan/tools/things-fix.mjs; kept, "Put back" undoes it)
          case "$WALK" in
            *:doubled:dry) node scan/tools/things-fix.mjs "${WALK%%:*}" dry | tee placed.txt ;;
            *:doubled) node scan/tools/things-fix.mjs "${WALK%%:*}" | tee placed.txt ;;
            # "<walk>:fused": why is there no fused map? the owner's maps of the walk's place, which holds the walk's plants,
            # which has a fused model, and the fusing run here on the real files (scan/tools/fuse-check.mjs). No ids, no places.
            *:fused) node scan/tools/fuse-check.mjs "${WALK%%:*}" | tee placed.txt ;;
            # "<walk>:info" or "<walk>:info:<other walk>[,<other>]": what the walk's own record says (walk-info.mjs)
            *:info*) O="${WALK#*:info}"; O="${O#:}"; node scan/tools/walk-info.mjs "${WALK%%:*}" ${O//,/ } | tee placed.txt; node scan/tools/placed.mjs "${WALK%%:*}" | tee -a placed.txt || true ;;
            # "<walk>:marks" (or ":marks:force"): the marks that walk was made with, kept with its map (marks-restore.mjs)
            *:marks:force) node scan/tools/marks-restore.mjs "${WALK%%:*}" force | tee placed.txt ;;
            *:marks) node scan/tools/marks-restore.mjs "${WALK%%:*}" | tee placed.txt ;;
            *) node scan/tools/placed.mjs "$WALK" | tee placed.txt ;;
          esac

      # DID THE PHONE'S OWN PLACE JUMP? (mend_study.py --jumps, 2026-11-21): the walk's poses only. Quick, free.
      - name: A walk's poses looked over for jumps
        if: ${{ inputs.task == 'jumps' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          pip install --quiet pillow numpy scipy
          node scan/tools/twin-r2.mjs get "$WALK" twin | tee jumps.txt
          python scan/tools/mend_study.py twin --jumps 2>&1 | grep -v '^Shapes tidied' | tee -a jumps.txt

      # A WALK MENDED BY ITSELF (scan/tools/mend_study.py, 2026-11-21): where two stretches of the walk saw one place, the
      # second slid onto the first; half the slides solve, the other half judge. CPU, free. Numbers only.
      - name: A walk mended by itself
        if: ${{ inputs.task == 'mend' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
          JUDGE_OUT: twin/judged.bin
          WITH_SEGMENTS: '1'
        run: |
          set -o pipefail
          pip install --quiet pillow numpy scipy
          STRICT=1 node scan/tools/twin-r2.mjs get "$WALK" twin | tee mend.txt
          node scan/tools/disagree.mjs twin > /dev/null || true
          python scan/tools/mend_study.py twin --write 2>&1 | grep -v '^Shapes tidied' | tee -a mend.txt
          if [ -f twin/mend.json ]; then
            python scan/tools/dense_prep.py twin --mended 2>&1 | grep -v '^Shapes tidied\|^  depth:\|^  sdepth:\|^Beside' | tee -a mend.txt
            node scan/tools/twin-r2.mjs put "$WALK" twin/mend.json twin/view-mended.bin | tee -a mend.txt
          fi
          if [ -f twin/start.json ]; then node scan/tools/twin-r2.mjs put "$WALK" twin/start.json twin/view.json | tee -a mend.txt; fi

      # A WALK'S CLASSES ON THE FREE RUNNER (scan/tools/classes_cpu.py, 2026-11-20): the picture model on the CPU, the
      # kinds voted onto the points, both clouds made ready for the 3D view. Slow (seconds a picture), free. Counts only.
      - name: A walk's pictures given their classes, and its 3D view made ready
        if: ${{ inputs.task == 'classes' }}
        timeout-minutes: 300
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
          JUDGE_OUT: twin/judged.bin
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          pip install --quiet pillow numpy scipy
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45,<5"
          STRICT=1 node scan/tools/twin-r2.mjs get "$WALK" twin | tee classes.txt
          node scan/tools/disagree.mjs twin > /dev/null || true
          python scan/tools/classes_cpu.py twin 2>&1 | grep -v -i "key-[0-9]" | tee -a classes.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/segments-masks.npz | tee -a classes.txt
          python scan/tools/view_prep.py twin 2>&1 | grep -v '^Shapes tidied' | tee -a classes.txt
          python scan/tools/dense_prep.py twin 2>&1 | grep -v '^Shapes tidied' | tee -a classes.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/view-rgb.bin twin/view.json twin/view-kind.bin twin/view-dense.bin | tee -a classes.txt

      # WHAT THE OWNER'S OWN HANDS SAY (scan/tools/owner_study.py, 2026-11-20): the names they gave, the points they
      # erased, and the levels of the ground they saw in the 3D view. CPU, free. Numbers and category names only.
      - name: What the owner's names, erasing and the ground's levels say
        if: ${{ inputs.task == 'learn' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          JUDGE_OUT: twin/judged.bin
          WITH_SEGMENTS: '1'
        run: |
          set -o pipefail
          pip install --quiet pillow numpy scipy
          node scan/tools/twin-r2.mjs get "$WALK" twin | tee learn.txt
          node scan/tools/disagree.mjs twin > /dev/null || true
          python scan/tools/owner_study.py twin 2>&1 | grep -v '^Shapes tidied' | tee -a learn.txt
          # the kinds voted onto the walk, from above, for the owner's eyes (studies.py study_vote)
          python scan/tools/studies.py twin --study vote 2>&1 | grep -v '^Shapes tidied' | tee -a learn.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/study-vote.json twin/study-vote-points.png twin/study-vote-filled.png | grep -c ': kept (' | sed 's/^/Study parts kept: /' | tee -a learn.txt
      - name: A walk's shapes made ready to be named
        if: ${{ inputs.task == 'name' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
          JUDGE_OUT: twin/judged.bin
          WITH_SEGMENTS: '1'
        run: |
          set -o pipefail
          pip install --quiet pillow numpy scipy
          node scan/tools/twin-r2.mjs get "$WALK" twin | tee name.txt
          node scan/tools/disagree.mjs twin > /dev/null || true
          python scan/tools/name_prep.py twin 2>&1 | tee -a name.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/seg.json twin/seg-[0-9]*.png > put.txt || true
          echo "Parts kept: $(grep -c ': kept (' put.txt), not kept: $(grep -c 'NOT kept' put.txt) $(grep 'NOT kept' put.txt | sed 's/.*NOT kept//' | sort | uniq -c | tr '\n' ' ')" | tee -a name.txt
          ! grep -q 'NOT kept' put.txt

      # SEGMENT FIRST, NAME AFTER (scan/tools/segment_study.py, 2026-11-18; docs/SCAN-PLAN.md section 29): the walk's
      # standing points grouped by shape alone, and by a picture model that cuts and names in one pass, lifted onto the
      # points; what each patch of the disagreement report turns out to be. CPU, free. Counts, sizes and names only;
      # the top-down pictures go to the private bucket.
      - name: A walk cut into things
        if: ${{ inputs.task == 'segment' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
          CELLS_OUT: twin/disagree-cells.json
          JUDGE_OUT: twin/judged.bin
          WITH_SEGMENTS: '1'
        run: |
          set -o pipefail
          pip install --quiet pillow numpy scipy
          python scan/tools/segment_study.py --selftest
          node scan/tools/twin-r2.mjs get "$WALK" twin | tee segment.txt
          node scan/tools/disagree.mjs twin | tee -a segment.txt
          # the shapes workflow S3 brought back from the GPU, when the walk has them: lifted again here, free
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45,<5"
          if [ -f twin/segments-masks.npz ]; then
            # ... and its Segment Anything shapes named by the vote of the panoptic model's pixels
            python scan/tools/segment_study.py twin --masks twin/segments-masks.npz 2>&1 | grep -v -i "key-[0-9]" | tee -a segment.txt
          else
            python scan/tools/segment_study.py twin --panoptic 2>&1 | grep -v -i "key-[0-9]" | tee -a segment.txt
          fi
          # the studies, each under its own name (scan/tools/studies.py): nothing overwrites another
          python scan/tools/studies.py twin --study "${STUDIES:-names,map,reach,relief,thin,best}" 2>&1 | tee -a segment.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/study-* | tee -a segment.txt
          # the first sheets last: one of them refused by the bucket (a 503, 2026-11-19) must not fail the studies
          node scan/tools/twin-r2.mjs put "$WALK" twin/segments-*.png twin/segments-*.jpg | tee -a segment.txt || true

      # CAN COLOUR SAY WHERE THE LIDAR'S CROWN IS NOT, WHERE DEPTH CANNOT REACH? (scan/tools/crown_sky_study.py,
      # 2026-11-24, the owner's idea: tree or sky seen from a place against what the lidar says is there). Measured
      # against the walk's own depth from 8 to 30 ft first. The twin with its pictures; counts only.
      - name: A walk's pictures against the lidar's crown
        if: ${{ inputs.task == 'crownsky' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet pillow numpy scipy
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/walk-fit.mjs twin | tee crownsky.txt || true
          node scan/tools/skyline-prep.mjs twin | tee -a crownsky.txt
          python scan/tools/crown_sky_study.py twin | tee -a crownsky.txt

      # THE GROUND AS THE WALK SAW IT (scan/tools/surfaces.py, 2026-11-24, the owner: "Lawn shape refinement and driveway
      # marking?"): paving and grass from the walk's own ground points on the map, against the traced lawn, and the
      # paving's straight runs and widths (the owner's drive is known by tape measure). Counts and widths only.
      - name: A walk's ground, paving and grass
        if: ${{ inputs.task == 'surfaces' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet numpy scipy
          # "<walk>" or "<walk>,<walk>,...": several walks of one lot are pooled, each put on the map by its own corners
          # (the owner, 2026-11-25: "the walks are cumulative"). The first walk named is the one whose map keeps the result.
          : > surfaces.txt; DIRS=""; FIRST="${WALK%%,*}"
          for W in ${WALK//,/ }; do
            node scan/tools/twin-r2.mjs parts "$W" "twin-$W" 'cloud-*' 'labels-*' view-kind.bin view.json start.json live.json meta.json 'track-*' 'keys-*' 'key-*.sem' 'key-*.rdepth' | tail -2 | tee -a surfaces.txt
            node scan/tools/walk-fit.mjs "twin-$W" | tee -a surfaces.txt || true
            DIRS="$DIRS twin-$W"
          done
          node scan/tools/lawn-prep.mjs "twin-$FIRST" | tee -a surfaces.txt || true
          python scan/tools/surfaces.py $DIRS --nocast | tee -a surfaces.txt
          python scan/tools/surfaces.py $DIRS --keep "twin-$FIRST/surfaces-map.json" | tee -a surfaces.txt
          node scan/tools/surfaces-keep.mjs "$FIRST" "twin-$FIRST" | tee -a surfaces.txt || true
          python scan/tools/surfaces.py $DIRS --feet 2 | tee -a surfaces.txt

      # DO THE PHONE'S LABEL PICTURES SIT ON THE CAMERA PICTURES? (scan/tools/sem_check.py, 2026-11-25). Small parts only.
      - name: A walk's label pictures against its own points
        if: ${{ inputs.task == 'semcheck' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet numpy scipy pillow
          node scan/tools/twin-r2.mjs parts "$WALK" twin 'cloud-*' 'labels-*' 'keys-*' 'key-*.sem' 'key-*.rdepth' 'key-*.jpg' 'track-*' meta.json | tee semcheck.txt
          python scan/tools/sem_check.py twin | tee -a semcheck.txt

      - name: A walk's skyline against the lidar
        if: ${{ inputs.task == 'skyline' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          SKY_CAL: ${{ inputs.calib }}
          SKY_TREE_SLACK: ${{ inputs.slack }}
          SKY_LAG: ${{ inputs.lag }}
          SKY_TRUTH: ${{ inputs.truth }}
          SKY_NARROW: ${{ inputs.narrow }}
        run: |
          set -o pipefail
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45" pillow numpy
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/skyline-prep.mjs twin | tee skyline.txt
          python scan/tools/skyline_study.py twin | tee -a skyline.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/skyline.json | tee -a skyline.txt

      # PLACE A WALK FROM ITS PICTURES (SCAN-H19): the skyline for the coarse placement, the lidar's brightness under the
      # pavement and the ground's shape for the fine one, then the after-the-walk fix with it (used when the walk has
      # no references). Keeps skyline.json, pavement.json, placement.json, fixed.json and mesh.bin beside the twin.
      - name: A walk placed from its pictures
        if: ${{ inputs.task == 'place' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          MAPFROM: ${{ inputs.mapfrom }}
          SKY_LEAN: '1'
        run: |
          set -o pipefail
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45" pillow numpy scipy small_gicp
          node scan/tools/twin-r2.mjs get "$WALK" twin
          : > place.txt
          # a walk recorded with no map open (the app before its picker, 2026-11-07): its map from another walk, kept
          if [ -n "$MAPFROM" ]; then
            node scan/tools/twin-map.mjs twin "$MAPFROM" | tee -a place.txt
            node scan/tools/twin-r2.mjs put "$WALK" twin/meta.json twin/live.json | tee -a place.txt
          fi
          node scan/tools/skyline-prep.mjs twin | tee -a place.txt
          python scan/tools/skyline_study.py twin | tee -a place.txt
          python scan/tools/pavement_study.py twin | tee -a place.txt
          # SCAN-PLAN 12: the walk's depth points as sight lines through the model (study: placement.json unchanged)
          python scan/tools/view_study.py twin | tee -a place.txt
          # which depth points are real (the walk's own lines, then the model); the moments near readings cluster
          python scan/tools/depth_audit.py twin | tee -a place.txt
          node scan/tools/post-fix.mjs twin | tee -a place.txt
          # the best fit overall (the owner, 2026-11-08): ground, buildings, things, pavement, each capped; nothing lost
          # for what changed, only for seeing through a house (study: placement.json unchanged)
          python scan/tools/consensus_study.py twin | tee -a place.txt
          # the walk registered to the lidar with small_gicp, ground first (the research report's recipe; study only)
          python scan/tools/register_study.py twin | tee -a place.txt
          # the walk inspector's data (scan/public/inspect.html): per-point verdicts, credits, placements; private bucket
          python scan/tools/inspect_build.py twin | tee -a place.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/skyline.json twin/pavement.json twin/placement.json twin/fixed.json twin/mesh.bin $(test -f twin/view.json && echo twin/view.json) $(test -f twin/consensus.json && echo twin/consensus.json) $(test -f twin/registration.json && echo twin/registration.json) $(test -f twin/inspect.json && echo twin/inspect.json twin/inspect-points.bin) | tee -a place.txt

      # PAVEMENT FROM THE PICTURES (scan/tools/pavement_study.py): road and sidewalk pixels cast onto the ground, kept
      # for the match against the model's intensity when it has one; tested against the traced lawn meanwhile.
      - name: A walk's pavement from its pictures
        if: ${{ inputs.task == 'pavement' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "transformers>=4.45" pillow numpy scipy
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/skyline-prep.mjs twin | tee pavement.txt
          python scan/tools/pavement_study.py twin | tee -a pavement.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/pavement.json | tee -a pavement.txt

      # DO THE CHECK MARKS SIT ON THE LIDAR (scan/tools/checks-shade.mjs; the owner, 2026-11-08: "Are we sure that
      # (1,000, 1,000) and (2,000, 2,000) actually point to where the lidar signatures for those visually recognizable
      # shapes would be"): round each check mark, how far the Mapbox photo the marks were put on sits from the lidar's
      # ground. No pictures read; the photo is fetched for the run and never kept.
      - name: The check marks against the lidar
        if: ${{ inputs.task == 'checks' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs get "$WALK" twin
          node scan/tools/skyline-prep.mjs twin > /dev/null
          node scan/tools/checks-prep.mjs twin | tee checks.txt
          node scan/tools/checks-shade.mjs twin | tee -a checks.txt

      # DO REPEAT WALKS AGREE (scan/tools/repeat_study.mjs; the research report of 2026-11-08: a fit's score "needs
      # held-out checks: surveyed corners, or agreement between repeat walks"): each check mark carried through each
      # walk's own placement; how far apart the walks put it, and the gap they share from the photo's mark. The walk
      # input takes walks comma separated, each already through task place.
      # THE WALK REGISTERED TO THE LIDAR, GROUND FIRST (scan/tools/register_study.py, small_gicp; the research report's
      # recipe, Paired-CSLiDAR): from the starts task place kept. The walk input takes walks comma separated.
      - name: Walks registered to the lidar
        if: ${{ inputs.task == 'register' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          pip install --quiet numpy scipy small_gicp
          : > register.txt
          for W in $(echo "$WALKS" | tr ',' ' '); do
            rm -rf twin
            echo "== walk $W" | tee -a register.txt
            node scan/tools/twin-r2.mjs get "$W" twin | tee -a register.txt
            node scan/tools/skyline-prep.mjs twin > /dev/null
            python scan/tools/register_study.py twin | tee -a register.txt
            node scan/tools/twin-r2.mjs put "$W" twin/registration.json | tee -a register.txt
          done
          if [ "$(echo "$WALKS" | tr ',' ' ' | wc -w)" -ge 2 ]; then node scan/tools/repeat_study.mjs "$WALKS" | tee -a register.txt; fi

      # A WALK PLACED BY AN EARLIER WALK (scan/tools/walk_fix_study.py; the owner, 2026-11-09: "lets try both photos and
      # shapes. If they're about equal, i say let's go with the shapes"): each walk in turn the reference, placed by its
      # marks; the others placed from it by their pictures and by their shapes, scored on their own held-out check
      # marks. The walk input takes walks comma separated (same map). CPU, free.
      - name: Walks placed by an earlier walk
        if: ${{ inputs.task == 'walkfix' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet numpy scipy small_gicp opencv-python-headless
          : > walkfix.txt
          dirs=""
          for W in $(echo "$WALKS" | tr ',' ' '); do
            node scan/tools/twin-r2.mjs get "$W" "w-$W" | tee -a walkfix.txt
            node scan/tools/skyline-prep.mjs "w-$W" > /dev/null
            dirs="$dirs w-$W"
          done
          python scan/tools/walk_fix_study.py $dirs | tee -a walkfix.txt
          # the page's own shape fix (scan/lib/walkref.js), the code the phone runs, on the same walks
          node scan/tools/reference-build.mjs check $dirs | tee -a walkfix.txt

      # THE PHOTOS STRETCHED ONTO THE LIDAR (scan/tools/warp-prep.mjs, warp_study.py; docs/SCAN-PLAN.md section 17):
      # the map's kept photo and Mapbox matched to the lidar's ground brightness (windows, and RoMa on the CPU), a
      # smoothed spline per photo scored on held-out matches, and the owner's check points placed on both photos. The
      # walk input: any walk on the map. CPU, free; keeps the stretched photos under refs/warp/<map>/.
      # THE PLACEMENT MAP'S LIDAR CORNERS ON THE WALK'S MAP (scan/tools/marks-check.mjs; SCAN-PLAN section 21): what
      # the page finds and why each candidate was kept. Counts and reasons only.
      - name: The lidar's corners on a map
        if: ${{ inputs.task == 'marks' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          # for marks: "e,n" metres from the biggest building's middle, a window of the shade model's columns there
          WINDOW: ${{ inputs.calib }}
        run: |
          set -o pipefail
          node scan/tools/marks-check.mjs "$WALK" | tee marks.txt

      # EVERY THERMAL WALK FILED UNDER ITS MAP (scan/tools/twin-r2.mjs thermal-index; 2026-11-16): a walk whose map's
      # id the site's old map rule refused was converted but never filed, so the water site saw none. Counts only.
      - name: Thermal walks filed under their maps
        if: ${{ inputs.task == 'thermalindex' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scan/tools/twin-r2.mjs thermal-index

      # DOES NAIP SIT ON THE LIDAR? (scan/tools/naip-check.mjs; SCAN-PLAN section 22): NAIP's near infrared against the
      # lidar's ground brightness (both near infrared), patch by patch, after a planted slide. The walk input: walks
      # comma separated, or "recent" (the newest walk on each of the last three maps). Dates and distances only.
      - name: NAIP against the lidar
        if: ${{ inputs.task == 'naip' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          node scan/tools/naip-check.mjs "${WALK:-recent}" | tee naip.txt

      # THE DRIVE'S WIDTH ON THE HARD-EDGED GROUND PICTURE (scan/tools/drive-width.mjs; SCAN-PLAN section 23): the
      # owner's test of the picture against a tape measure. Widths and lengths only.
      - name: The drive's width on the ground picture
        if: ${{ inputs.task == 'drive' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          node scan/tools/drive-width.mjs "$WALK" | tee drive.txt

      - name: Photos stretched onto the lidar
        if: ${{ inputs.task == 'warp' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          pip install --quiet numpy scipy opencv-python-headless pillow
          pip install --quiet torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "git+https://github.com/Parskatt/RoMa.git" || echo "RoMa did not install: the windows only"
          node scan/tools/warp-prep.mjs "$WALK" warp | tee warp.txt
          python scan/tools/warp_study.py warp | tee -a warp.txt
          node scan/tools/warp-keep.mjs warp | tee -a warp.txt

      # THE PAGE'S OWN SHAPE FIX ALONE (scan/tools/reference-build.mjs check): minutes, not the pictures' 35; a few
      # search settings side by side (WALKREF_VARIANTS). The walk input: walks comma separated, same map.
      - name: The page's shape fix on walks
        if: ${{ inputs.task == 'walkfixjs' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
          NO_PICTURES: '1'
          WALKREF_VARIANTS: '1,4;0.5,4;0.5,2;0.75,3'
        run: |
          set -o pipefail
          dirs=""
          for W in $(echo "${WALKS%%:*}" | tr ',' ' '); do
            node scan/tools/twin-r2.mjs get "$W" "w-$W" > /dev/null
            dirs="$dirs w-$W"
          done
          # "walk,walk:labels": do the phone's labels help the fix? The first walk made a reference here, the second matched
          case "$WALKS" in *:labels) node scan/tools/reference-build.mjs labels $dirs | tee walkfix.txt ;; *) node scan/tools/reference-build.mjs check $dirs | tee walkfix.txt ;; esac

      # THE MAP'S REFERENCE WALK (scan/tools/reference-build.mjs; SCAN-H32): a walk placed by its marks becomes the one
      # that places later walks on its map by their shape, live on the page. The walk input: one walk.
      - name: A walk kept as its map's reference
        if: ${{ inputs.task == 'reference' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
          NO_PICTURES: '1'
        run: |
          set -o pipefail
          # "<walk>:dry" says what would be kept and writes nothing
          if [[ "$WALK" == *:dry ]]; then export DRY=1; WALK="${WALK%:dry}"; fi
          # "<walk>,<walk>:against": each walk matched to its map's saved reference by shape, judged by its own corners
          if [[ "$WALK" == *:against ]]; then
            dirs=""
            for W in $(echo "${WALK%:against}" | tr ',' ' '); do node scan/tools/twin-r2.mjs get "$W" "w-$W" > /dev/null; dirs="$dirs w-$W"; done
            REF_SCALE="${{ inputs.calib }}" node scan/tools/reference-build.mjs against $dirs | tee reference.txt
            exit 0
          fi
          # "<walk>,<walk>,...:crossval": each walk against a reference made of the others (nothing written);
          # "<walk>,<walk>,...:rebuild" (":rebuild:dry"): the map's reference made again from these walks, every point counted
          if [[ "$WALK" == *:crossval || "$WALK" == *:rebuild ]]; then
            HOW="${WALK##*:}"; dirs=""
            for W in $(echo "${WALK%:*}" | tr ',' ' '); do node scan/tools/twin-r2.mjs get "$W" "w-$W" > /dev/null; dirs="$dirs w-$W"; done
            node scan/tools/reference-build.mjs "$HOW" $dirs | tee reference.txt
            exit 0
          fi
          # "<walk>:restore" (or ":restore:dry"): what the map's reference and its backups hold; the newest backup put back
          if [[ "$WALK" == *:restore ]]; then
            W="${WALK%:restore}"; node scan/tools/twin-r2.mjs get "$W" twin > /dev/null
            node scan/tools/reference-build.mjs restore twin | tee reference.txt
            exit 0
          fi
          # "<walk>:on:<other walk>": keep a walk that names no map into the reference of the other walk's map
          if [[ "$WALK" == *:on:* ]]; then
            O="${WALK##*:on:}"; WALK="${WALK%%:on:*}"; node scan/tools/twin-r2.mjs get "$O" other > /dev/null; export MAP_FROM=other
          fi
          # "<walk>:fresh" (or ":fresh:dry"): the map's reference made afresh from this walk alone, if it has earned it
          HOW=keep; if [[ "$WALK" == *:fresh ]]; then HOW=fresh; WALK="${WALK%:fresh}"; fi
          node scan/tools/twin-r2.mjs get "$WALK" twin | tee reference.txt
          # keep: the part of the walk its agreeing marks vouch for, added to the map's reference (lib/refkeep.js)
          node scan/tools/reference-build.mjs "$HOW" twin | tee -a reference.txt

      - name: Repeat walks against each other
        if: ${{ inputs.task == 'repeat' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walk }}
        run: |
          set -o pipefail
          node scan/tools/repeat_study.mjs "$WALKS" | tee repeat.txt

      - name: The answer
        if: always()
        run: |
          echo "--------------------------------------------------------------"
          case "${{ inputs.task || 'deploy' }}" in
            deploy)
              echo "Scan site: ${SCAN_STATE:-not deployed -- see the steps above}"
              echo "Engine: ${SCAN_ENGINE:-unknown}"
              if [ -n "$SCAN_R2" ]; then echo "Twins: kept in the $SCAN_R2 bucket, viewed at /twin.html"; else echo "Twins: NOT kept (no bucket: see the twin bucket step)"; fi
              echo "Open it from the dashboard's Yard AR card (admin account), on each phone." ;;
            walks) cat walks.txt 2>/dev/null || echo "no walks read: see the step above" ;;
            twin) cat twin.txt 2>/dev/null || echo "no twin check: see the step above" ;;
            disagree) cat disagree.txt 2>/dev/null || echo "no report: see the step above" ;;
            view) cat view.txt 2>/dev/null || echo "no 3D view: see the step above" ;;
            prunerecordings) cat prune.txt 2>/dev/null || echo "nothing listed: see the step above" ;;
            jumps) cat jumps.txt 2>/dev/null || echo "no poses read: see the step above" ;;
            placed) cat placed.txt 2>/dev/null || echo "no pins read: see the step above" ;;
            trunks) cat trunks.txt 2>/dev/null || echo "no trunks looked for: see the step above" ;;
            surfaces) grep -v ': kept (' surfaces.txt 2>/dev/null | cut -c1-900 | tail -45 || echo "no ground read: see the step above" ;;
            semcheck) cat semcheck.txt 2>/dev/null || echo "no check: see the step above" ;;
            crownsky) grep -v '^Twin read\|: kept (' crownsky.txt 2>/dev/null | tail -20 || echo "no colour study: see the step above" ;;
            corners) cat corners.txt 2>/dev/null || echo "no corners read: see the step above" ;;
            mend) cat mend.txt 2>/dev/null || echo "nothing mended: see the step above" ;;
            classes) cat classes.txt 2>/dev/null || echo "no classes: see the step above" ;;
            learn) cat learn.txt 2>/dev/null || echo "nothing learned: see the step above" ;;
            name) cat name.txt 2>/dev/null || echo "nothing made ready to name: see the step above" ;;
            segment) grep -v '^Twin read' segment.txt 2>/dev/null | tail -60 || echo "no segment trial: see the step above" ;;
            fix) cat fix.txt 2>/dev/null || echo "no fix: see the step above" ;;
            study) cat study.txt 2>/dev/null || echo "no study: see the step above" ;;
            skyline) cat skyline.txt 2>/dev/null || echo "no skyline study: see the step above" ;;
            pavement) cat pavement.txt 2>/dev/null || echo "no pavement study: see the step above" ;;
            place) grep -v '^  model\|^  rays\|^  the picture' place.txt 2>/dev/null | tail -60 || echo "no placement: see the step above" ;;
            register) grep -v '^Twin read\|: kept (' register.txt 2>/dev/null | tail -70 || echo "no registration: see the step above" ;;
            repeat) cat repeat.txt 2>/dev/null || echo "no repeat-walk study: see the step above" ;;
            warp) cat warp.txt 2>/dev/null || echo "no warp study: see the step above" ;;
            marks) cat marks.txt 2>/dev/null || echo "no marks check: see the step above" ;;
            naip) cat naip.txt 2>/dev/null || echo "no NAIP check: see the step above" ;;
            drive) cat drive.txt 2>/dev/null || echo "no drive width: see the step above" ;;
            walkfixjs) cat walkfix.txt 2>/dev/null || echo "no check: see the step above" ;;
            walkfix) grep -v '^Twin read' walkfix.txt 2>/dev/null | tail -40 || echo "no walk-to-walk study: see the step above" ;;
            reference) cat reference.txt 2>/dev/null || echo "no reference: see the step above" ;;
            checks) cat checks.txt 2>/dev/null || echo "no check-mark test: see the step above" ;;
            depth) tail -25 depth.txt 2>/dev/null || echo "no depth run: see the step above" ;;
            *) echo "Scan tests: ${{ job.status }}" ;;
          esac
