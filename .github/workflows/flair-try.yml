name: 36. Try FLAIR on our lots

# IGNF's FLAIR land-cover U-Nets, run exactly as published on the locked lots
# and scored like the detector (owner, 2026-10-18: "try it, since it may have
# usefulness for the lawnmap"; E13 in docs/DETECTOR-FINDINGS.md). Three
# variants: the photo alone, + NAIP near-infrared, + height above ground from
# our lidar. Nothing is trained and nothing changes on the site.
#
# FREE: GitHub's own CPU runner. The frames, lidar and NAIP are fetched the
# way workflow 14 fetches them; the lidar is read at 1 m a cell rather than
# 14's 2 m, since FLAIR reads 0.2 m pictures.
on:
  workflow_dispatch:
    inputs:
      lawns:
        description: 'Which lawns'
        required: false
        default: 'locked'
        type: choice
        options: [locked, all]

jobs:
  try:
    name: Run FLAIR over the lots and score it
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PIP_DEFAULT_TIMEOUT: '60'
      PIP_RETRIES: '10'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Install PyTorch, the lidar reader and the FLAIR loader
        run: |
          pip install -r tools/requirements.txt
          pip install -r tools/requirements-trees.txt -r tools/requirements-lidar.txt
          pip install segmentation-models-pytorch

      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/train-detector.js

      - name: Match the frames to the 3DEP projects
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js

      - name: Plan the newest flight over each frame
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          MODE: newest
        run: node tools/lidar-newest.js

      - name: Read the lidar over the frames, at 1 m
        continue-on-error: true
        env:
          FRAMES: frames
          CANOPY: canopy
          PLAN: lidar-plan.json
          OUT: lidar
          TILE_DIR: lidar-tiles
          CELL_M: '1'
        run: |
          python3 tools/lidar_frame.py
          rm -rf lidar-tiles

      - name: Read NAIP's near-infrared over the frames
        continue-on-error: true
        env:
          FRAMES: frames
          OUT: naip
        run: python3 tools/naip_bands.py

      - name: Fetch FLAIR's published weights
        run: |
          mkdir -p flair
          for v in rgb rgbi rgbie; do
            curl -sSfL -o "flair/$v.pth" \
              "https://huggingface.co/IGNF/FLAIR-INC_${v}_15cl_resnet34-unet/resolve/main/FLAIR-INC_${v}_15cl_resnet34-unet_weights.pth"
          done
          ls -la flair

      - name: Run FLAIR and score it
        env:
          FRAMES: frames
          LIDAR: lidar
          NAIP: naip
          WEIGHTS: flair
          OUT: flair-out
        run: python3 tools/flair_try.py

      - name: Keep the scores and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flair-try
          path: flair-out/*
          if-no-files-found: ignore
