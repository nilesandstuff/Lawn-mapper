name: 37. Does Overture line up with our lots

# Overture's buildings, roads and sidewalks (public/lib/overture.js, copied from
# the water session's) against our locked lots, before anything is built on
# them (owner, 2026-10-19: "as long as the image lines up, it would be good
# info for every stage"). Buildings are scored against the lidar's roofs, which
# have no perspective lean; the traced lawns say what a never-lawn rule would
# cost. Nothing is trained and nothing changes on the site.
#
# FREE: GitHub's own CPU runner. Overture answers without a key.
on:
  workflow_dispatch:
    inputs:
      lawns:
        description: 'Which lawns'
        required: false
        default: 'locked'
        type: choice
        options: [locked, all]
      lidar_from:
        description: 'Reuse the lidar masks from an earlier run of this workflow (its run id); blank reads the lidar afresh'
        required: false
        default: ''

jobs:
  check:
    name: Overture against the lidar roofs and the traced lawns
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      actions: read
    env:
      PIP_DEFAULT_TIMEOUT: '60'
      PIP_RETRIES: '10'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Install the lidar reader
        run: |
          pip install -r tools/requirements.txt
          pip install -r tools/requirements-trees.txt -r tools/requirements-lidar.txt

      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/train-detector.js

      - name: Reuse an earlier run's lidar masks
        if: inputs.lidar_from != ''
        uses: actions/download-artifact@v4
        with:
          name: overture-lidar
          path: .
          run-id: ${{ inputs.lidar_from }}
          github-token: ${{ github.token }}

      - name: Unpack them
        if: inputs.lidar_from != ''
        run: tar -xf overture-lidar.tar && ls lidar | wc -l

      - name: Match the frames to the 3DEP projects
        if: inputs.lidar_from == ''
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js

      - name: Plan the newest flight over each frame
        if: inputs.lidar_from == ''
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          MODE: newest
        run: node tools/lidar-newest.js

      # Capped: on 2026-10-19 USGS's tile host timed out and lots fell back to
      # octree reads of 8-14 minutes each. The masks are written lot by lot, so
      # a capped step still leaves the lots it finished for the check below.
      - name: Read the lidar over the frames, at 1 m
        if: inputs.lidar_from == ''
        continue-on-error: true
        timeout-minutes: 100
        env:
          FRAMES: frames
          CANOPY: canopy
          PLAN: lidar-plan.json
          OUT: lidar
          TILE_DIR: lidar-tiles
          CELL_M: '1'
          PYTHONUNBUFFERED: '1'
        run: |
          python3 tools/lidar_frame.py
          rm -rf lidar-tiles

      - name: Overture against the lidar roofs and the traced lawns
        if: always()
        env:
          FRAMES: frames
          LIDAR: lidar
          OUT: overture-out
        run: node tools/overture-check.js

      # One tar: the lots' ids carry colons, which an artifact refuses in a file name.
      - name: Pack the lidar roof masks
        if: always() && inputs.lidar_from == ''
        run: tar -cf overture-lidar.tar lidar/*-roof.png lidar/*-height.png 2>/dev/null || true

      - name: Keep the lidar roof masks for a rerun
        if: always() && inputs.lidar_from == ''
        uses: actions/upload-artifact@v4
        with:
          name: overture-lidar
          path: overture-lidar.tar
          if-no-files-found: ignore

      - name: Keep the scores and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overture-check
          path: overture-out/*
          if-no-files-found: ignore
