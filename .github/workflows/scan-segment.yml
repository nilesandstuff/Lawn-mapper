# S3. A WALK'S PICTURES THROUGH SEGMENT ANYTHING (core session, 2026-11-18; docs/SCAN-PLAN.md section 29). The trial
# of "segment first, name after": Segment Anything and a panoptic model on each picture of one walk, on Modal's GPU
# (scan/tools/segment_modal.py), lifted onto the walk's points on this runner (scan/tools/segment_study.py) and set
# against the disagreement report's patches. MODAL IS PAID: run only when the owner has said yes, with the number of
# runs and a rough cost. The log carries counts, sizes and names only; the top-down pictures go to the private bucket.
name: "S3. Yard AR segments"

on:
  workflow_dispatch:
    inputs:
      walk:
        description: "The walk's id (the number in its twin page's address)"
        required: true
      what:
        description: "classes (the panoptic model alone: cheap, all the vote needs), shapes (Segment Anything + panoptic) or names (the whole-picture namers on kept shapes)"
        default: "shapes"
      gpu:
        description: "Modal GPU"
        default: "L4"

permissions:
  contents: read

jobs:
  segment:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund

      - name: The walk's twin, and where it disagrees with the lidar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          WALK: ${{ inputs.walk }}
          CELLS_OUT: twin/disagree-cells.json
          JUDGE_OUT: twin/judged.bin
          WITH_SEGMENTS: '1'
        run: |
          set -o pipefail
          pip install --quiet modal numpy scipy pillow
          python scan/tools/segment_study.py --selftest
          node scan/tools/twin-r2.mjs get "$WALK" twin | tee segment.txt
          node scan/tools/disagree.mjs twin | tee -a segment.txt

      - name: The pictures' shapes, on Modal's GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          MODAL_GPU: ${{ inputs.gpu }}
        run: |
          set -o pipefail
          if [ "${{ inputs.what }}" = "names" ]; then
            modal run scan/tools/segment_modal.py::names --src twin --out out 2>&1 | grep -v -i "key-[0-9]" | tee -a segment.txt
            cp out/segments-names.json twin/segments-names.json
          elif [ "${{ inputs.what }}" = "classes" ]; then
            modal run scan/tools/segment_modal.py::main --src twin --out out --no-sam 2>&1 | grep -v -i "key-[0-9]" | tee -a segment.txt
            cp out/masks.npz twin/segments-masks.npz
          else
            modal run scan/tools/segment_modal.py::main --src twin --out out 2>&1 | grep -v -i "key-[0-9]" | tee -a segment.txt
            cp out/masks.npz twin/segments-masks.npz
          fi

      # CLASSES ONLY: kept beside the twin, voted onto the points, made ready for the 3D view (no lift, no shapes matched)
      - name: Classes voted onto the walk's points
        if: ${{ inputs.what == 'classes' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          node scan/tools/twin-r2.mjs put "$WALK" twin/segments-masks.npz | tee -a segment.txt
          python scan/tools/view_prep.py twin 2>&1 | grep -v '^Shapes tidied' | tee -a segment.txt
          python scan/tools/studies.py twin --study vote 2>&1 | grep -v '^Shapes tidied' | tee -a segment.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/view-rgb.bin twin/view.json twin/view-kind.bin twin/study-vote.json twin/study-vote-points.png twin/study-vote-filled.png | tee -a segment.txt

      - name: Lifted onto the walk's points
        if: ${{ inputs.what != 'classes' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALK: ${{ inputs.walk }}
        run: |
          set -o pipefail
          # the shapes and the names are kept beside the twin, so the lift, the studies and their pictures can be
          # redone without the GPU
          python scan/tools/segment_study.py twin --masks twin/segments-masks.npz 2>&1 | tee -a segment.txt
          python scan/tools/studies.py twin --study names,map,reach,relief,thin,best 2>&1 | tee -a segment.txt
          node scan/tools/twin-r2.mjs put "$WALK" twin/segments-* twin/study-* | tee -a segment.txt

      - name: The answer
        if: always()
        run: |
          echo "--------------------------------------------------------------"
          grep -v '^Twin read' segment.txt 2>/dev/null | tail -70 || echo "no segment trial: see the steps above"
