name: 42. Try canopy height (CHMv2) on our lots

# Meta's Canopy Height Maps v2 -- a DPT head on the DINOv3 satellite ViT-L,
# trained against airborne lidar -- run out of the box on the locked lots and
# measured against the lidar's heights, the tree model's canopy and the
# traced lawn (S53 in docs/DETECTOR-FINDINGS.md; owner, 2026-10-22: "try
# everything that makes sense to try"). Nothing is trained and nothing
# changes on the site.
#
# FREE: GitHub's own CPU runner. The model reads at 0.6 m a pixel, so a lot is
# a few hundred pixels and the whole corpus is minutes. The frames, lidar (at
# 1 m) and canopy are fetched the way workflow 14 fetches them. The checkpoint
# is gated on the hub: the HF_TOKEN secret (the DINOv3 licence covers it).
on:
  workflow_dispatch:
    inputs:
      lawns:
        description: 'Which lawns'
        required: false
        default: 'locked'
        type: choice
        options: [locked, all]
      scales:
        description: 'Metres a pixel the photo is read at, comma-separated (0.6 is the model''s own)'
        required: false
        default: '0.6,0.3'

permissions:
  contents: read

jobs:
  try:
    name: Run CHMv2 over the lots and measure it
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PIP_DEFAULT_TIMEOUT: '60'
      PIP_RETRIES: '10'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Install PyTorch, the model loader, the tree model's loader and the lidar reader
        run: |
          pip install -r tools/requirements.txt
          pip install -r tools/requirements-trees.txt -r tools/requirements-lidar.txt

      - name: Check the checkpoint can be opened
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install --quiet huggingface_hub
          python3 - <<'PY'
          import os, sys
          from huggingface_hub import hf_hub_download
          from huggingface_hub.errors import GatedRepoError
          repo = "facebook/dinov3-vitl16-chmv2-dpt-head"
          if not os.environ.get("HF_TOKEN"):
              print(f"::error::{repo} is gated and the HF_TOKEN secret is not set."); sys.exit(1)
          try:
              hf_hub_download(repo, "config.json")
          except GatedRepoError:
              print(f"::error::{repo} is gated and the token's account has not been granted access (the DINOv3 licence page)."); sys.exit(1)
          print(f"{repo} opens with the token.")
          PY

      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/train-detector.js

      - name: Find the canopy
        env:
          IMAGES: frames
          OUT: canopy
          MODEL: restor/tcd-segformer-mit-b5
          MIN_CLUMP_M2: 4
        run: python3 tools/tree-canopy.py

      - name: Match the frames to the 3DEP projects
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js

      - name: Plan the newest flight over each frame
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          MODE: newest
          SAVED: tools/locked-lidar-plan.json
        run: node tools/lidar-newest.js

      - name: Read the lidar over the frames, at 1 m
        continue-on-error: true
        env:
          FRAMES: frames
          CANOPY: canopy
          PLAN: lidar-plan.json
          OUT: lidar
          TILE_DIR: lidar-tiles
          CELL_M: '1'
          LIDAR_SHIFTS: tools/locked-lidar-shifts.json
        run: |
          python3 tools/lidar_frame.py
          rm -rf lidar-tiles

      - name: Run CHMv2 and measure it
        env:
          FRAMES: frames
          LIDAR: lidar
          CANOPY: canopy
          OUT: chm-out
          CHM_SCALES: ${{ inputs.scales }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 tools/chm_try.py

      - name: Keep the heights and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chm-try
          path: chm-out/*
          if-no-files-found: ignore
