name: 12. Train a lawn detector

# Trains a small model on the approved maps and says whether it beats the
# detector we pay for, measured on lawns it was never shown.
#
# FREE. No Replicate, no predictions, no imagery fetched from anybody --
# the photographs are already in the R2 bucket and the corrected outlines are
# already in D1. This is arithmetic over things that have been sitting there.
#
# Run it whenever a batch of maps has been approved. The answer it gives is
# not "is the model good" but "is it better than what we have, yet" -- which
# is the only question that decides anything.
on:
  workflow_dispatch:
    inputs:
      no_backbone:
        description: 'Colour and texture only, ignoring the pretrained eye'
        type: boolean
        default: false
      publish:
        description: 'Commit the trained model so dev mode can draw it'
        type: boolean
        default: false

jobs:
  train:
    name: Train and leave one out
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # ONE COMMAND, NOT TWO, and that is not tidiness. --no-save keeps these
      # out of package.json, which means the NEXT npm install sees them as
      # strays and prunes them: installing the model runner separately removed
      # the decoders, and the run failed with "the image decoders are missing"
      # a step after they were installed. "removed 2 packages" was the only
      # sign, in the middle of an otherwise ordinary install log.
      #
      # They stay out of package.json for a good reason -- nothing the Worker
      # or the site ships decodes a PNG or runs a neural network, and this is
      # ~200 MB of dependency that would otherwise sit in the deploy.
      - name: Install the decoders and the model runner
        run: npm install pngjs jpeg-js @huggingface/transformers --no-save

      - name: Train, and test on lawns it has not seen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          # Set this to compare against the colour-and-texture-only run that
          # scored 43%. A fallback must never be silent, so the tool prints
          # which features it used whichever way this lands.
          NO_BACKBONE: ${{ inputs.no_backbone }}
          EXPORT_MODEL: ${{ inputs.publish }}
        run: node tools/train-detector.js

      # The weights are a few hundred numbers of JSON, committed rather than
      # stashed somewhere, so the model dev mode draws is the one in the branch
      # and `git log` says which run produced it. Deploying is still separate
      # and still deliberate.
      - name: Commit the model
        if: inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # STAGE FIRST, THEN ASK. `git diff` does not see untracked files, so
          # the very first run -- the one creating the model -- reported "the
          # model is unchanged" about a file that had just come into
          # existence, and committed nothing. Staging turns a new file into a
          # difference that can be asked about.
          git add public/model
          if git diff --cached --quiet -- public/model; then
            echo "The model is byte-for-byte what is already committed."
            exit 0
          fi
          git commit -m "Trained lawn head, from workflow 12

          Weights only. The error recorded in the file comes from leaving one
          lawn out at a time, not from this fit -- this one has seen them all."
          git push origin HEAD:${{ github.ref_name }}
          echo
          echo "Committed. Run workflow 2 to deploy it, then turn on developer"
          echo "mode in the app and press \"Show the trained model\"."

      - name: If that failed
        if: failure()
        run: |
          echo "Nothing was trained, and nothing was spent finding that out."
          echo
          echo "The usual reasons, in order of likelihood:"
          echo "  * no approved maps have a stored photograph yet -- the console's"
          echo "    Training data card shows how many do"
          echo "  * the R2 bucket is not reachable with this API token"
          echo "  * the corpus table is not there, which the deploy would also say"
