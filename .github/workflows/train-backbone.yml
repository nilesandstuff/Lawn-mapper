name: 14. Train with a real backbone (Python)

# The same leave-one-out measurement as workflow 12, but the features come from
# a proper vision model run in PyTorch instead of the crippled ONNX export.
#
# WHY THIS IS A SECOND WORKFLOW. The ONNX build of DINOv2 that Node can load is
# frozen at 224 pixels -- its position-embedding table was baked in at one size
# -- so over a 40 m property it gives a patch every 3.3 m, and the only way to
# do better was to run it on sixteen separate tiles. Tiling destroys the one
# thing a pretrained model is for: a patch in the middle of a tile cannot see
# the garden it sits in, so grass in shadow has nothing around it to be read
# against.
#
# In PyTorch the same architecture interpolates its position embeddings and
# takes any input size. One pass over the whole property, every patch attending
# to every other. That is what makes shadow legible -- and shadow is the thing
# colour alone will never survive.
#
# THE WINDOWS WERE TRIED, "MEASURED WORSE", AND THEN THE MEASUREMENT WAS
# RETRACTED. On 2026-09-23 the extractor gained a mode that reads a lot too
# big for 10 cm a pixel in one pass in overlapping 896 px windows at the
# photograph's own resolution, keeping only the middle of each so every
# patch had about 11 m of real picture around it -- overlap and a margin
# thrown away, which is the difference from the tiling above. The first
# comparison (H22) said every backbone row was 16 points worse in windows,
# and this header said the whole lot in view was worth more than the
# resolution. It was not: the squeeze was dropping the grid's cover, so the
# windowed rows were read out of register (H25). Re-run with that fixed
# (2026-09-24), windows are within 1.5 points of squeezing whole, both
# directions. The mode stays behind the `windows` input, off by default,
# because it costs three times the run for nothing measurable at 32 lawns.
# See tools/windows.py.
#
# AND NOW A SECOND EYE, which is the reason to run this again.
#
# DINOv2 learned from ordinary photographs. It has seen grass and tarmac, but
# never from above, and it has no idea how big anything in a picture is.
# Scale-MAE learned from satellite imagery and learned scale on purpose -- it
# is handed the ground distance a pixel covers and builds its position encoding
# from it. It is the first backbone tried here that has seen a lawn from above
# before today.
#
# That also makes the scale a required input. The frame dump writes scale.json
# beside the photographs; without it the run stops rather than guessing, because
# a wrong ground size does not error, it just quietly reads a garden as a
# landscape.
#
# FREE. Python, torch and the weights are downloads; nothing here is billed.
# It is slower than workflow 12 -- a bigger model at a higher resolution on a
# CPU -- which is the price of asking a better question. Scale-MAE is a
# ViT-Large, so it is the slowest of the lot; budget twenty minutes.
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Which backbone to try'
        type: choice
        default: scalemae-large
        options:
          # Trained on satellite imagery, and told the scale of what it is
          # looking at. The only entry here that has ever seen a lawn from
          # above before today.
          - scalemae-large
          # The same model told N x the metres a pixel. Scale-MAE's own
          # pretraining fed it res of about 2.2-5.0, never metres; we pass
          # 0.07-0.10. These measure which number it reads best. See
          # SatelliteEye in tools/extract_features.py.
          - scalemae-large, res x5
          - scalemae-large, res x10
          - scalemae-large, res x25
          - facebook/dinov2-base
          - facebook/dinov2-small
          - facebook/dinov2-large
          - facebook/dinov2-with-registers-base
      size:
        description: 'Input size in pixels. All of them work for every model. Bigger is finer and slower.'
        type: choice
        # 896, NOT 672, and the difference is a recorded decision rather than a
        # preference. H9: 672 -> 896 moved the eye-only row 8.2 points better
        # against a byte-identical control, which is the cleanest result this
        # project has. 1280 holds the single best number (26.1%) but 896 against
        # 1280 was left UNSETTLED on 2026-09-19 pending more corpus, with
        # "work at 896 in the meantime, for the run times". A default of 672 is
        # a size that measurement has already retired.
        default: '896'
        options:
          - '448'
          - '672'
          - '896'
          # THE FRAMES THEMSELVES ARE 1280px, so this is the last size that
          # asks the backbone a question about pixels that exist rather than
          # about an upscale.
          #
          # MEASURED, run 35417355609: 21 minutes of extraction, 10 of scoring,
          # 33 for the whole job. The estimate here used to say "roughly 70
          # minutes of extraction and something over an hour and a half in
          # total", extrapolated from 672 -> 896 costing 5 minutes -> 16.
          # That extrapolation was wrong by more than double, and it was wrong
          # in the direction that discourages running it -- which it did, for
          # a day. The three-hour cap below stays as it is; a generous cap
          # costs nothing and a tight one wastes a run at its last step.
          - '1280'
      publish:
        # IT DOES NOT CHECK WHETHER IT WON. This said "publish the result if it
        # wins", and the code has no such condition: EXPORT_MODEL=true always
        # writes model/lawn-head.json, and it writes the COLOUR-AND-TEXTURE row
        # rather than the winner, because that is the only one a browser can
        # run. Leave it off unless the table says the head is worth having --
        # the description was the only thing standing between a losing run and
        # a published model.
        description: 'Write the colour-and-texture head to R2 for developer mode (does NOT check whether it beat SAM)'
        type: boolean
        default: false
      seen_only:
        # DOUBLES THE TABLE AND ROUGHLY THE RUN. Every configuration gets a twin
        # trained with the "inferred, not seen" pixels dropped from the sample,
        # so the two sit in ONE run and share the corpus, the folds and the
        # seed -- which matters because H13 says a backbone row occasionally
        # comes back different on an identical re-run, and a two-run comparison
        # could not tell that apart from a result.
        #
        # READ THE SEEN COLUMN. The twins' headline and inferred figures include
        # ground they were deliberately never taught; the run prints the paired
        # comparison itself for that reason.
        description: 'Also train a twin of each row with unseen ground dropped (doubles the run)'
        type: boolean
        default: false
      windows:
        # THE CONTROL SWITCH for the 10 cm change to the backbone. "on" reads
        # a lot too big for one pass at the photograph's own resolution in
        # overlapping windows; "off" squeezes every lot whole into the input
        # size, which is what every run before 2026-09-23 did. Same corpus,
        # both settings, is the only way to say what windows were worth.
        #
        # OFF BY DEFAULT FOR THE RUN TIME, not for a measured loss. The first
        # comparison (H22, 2026-09-23) read windows 16 points worse; that was
        # a registration bug in the squeeze (H25), and the re-run with it
        # fixed (2026-09-24) put every row within 1.5 points either way.
        # Windows triple the extraction and the decoder's time.
        #
        # "tiles" (owner, 2026-09-27): EVERY lot resampled to 6 cm a pixel and
        # read in 448 px blocks -- 27 m, keeping the middle 17 m, 5 m of
        # context past it each side -- so the model always sees the same
        # pixels over the same ground, a patch is 0.96 m instead of 1.3-5.4 m,
        # and blocks nowhere near the lot are skipped (TILE_* in
        # tools/extract_features.py). "tiles 10 cm" is the control: the same
        # blocks at the photograph's own resolution (45 m, 1.6 m patches), to
        # tell "every lot read the same way" from "finer patches".
        #
        # "both" (2026-09-28, after H55): every lot read BOTH ways -- squeezed
        # whole, and in the 6 cm blocks -- and the decoder given the two side
        # by side at every block cell (FEATURES_WHOLE in
        # tools/train_decoder.py). H55 found each reading far better on
        # different lots, so this asks whether the decoder can pick. Costs
        # the tiles run plus one whole-lot pass; use `canopy: on lawn` (one
        # decoder) to stay inside the time limit.
        description: 'Big lots in 10 cm windows (on), every lot whole (off), in blocks: 6 cm (tiles) or 10 cm (tiles 10 cm), or whole + 6 cm blocks stacked (both)'
        type: choice
        default: 'off'
        options: ['on', 'off', 'tiles', 'tiles 10 cm', 'both']
      lawns:
        # WHICH LAWNS. The 32 maps every table since 2026-09-23 was measured
        # on are frozen as the benchmark (tools/lawn-set.js, cohort column);
        # the corpus keeps growing past them. "benchmark" compares with every
        # table in docs/DETECTOR-FINDINGS.md; "all" trains on the most and
        # compares with nothing; "new" is only what arrived since the freeze.
        # (The 15 cm scoring grid is fixed now: H23 measured the old 512
        # against it as nothing, and this input took its place under
        # GitHub's limit of ten.)
        #
        # "benchmark, 10 folds" is the same 32 trained the way `all` is (ten
        # folds, not leave-one-out): the check that the change of method did
        # not change the answer (owner's question, 2026-09-27).
        #
        # "locked" (owner, 2026-10-06; the default since): exactly the maps in
        # tools/locked-lawns.json, so tests stay comparable while new maps
        # arrive. Workflow 31 lets the next batch in.
        description: 'Which lawns: the locked training set (default; workflow 31 lets new maps in), every approved map (all), the frozen benchmark of 32, only those approved since that freeze (new), or the benchmark in 10 folds'
        type: choice
        default: 'locked'
        options: ['locked', 'all', 'benchmark', 'new', 'benchmark, 10 folds']
      decoder:
        # STAGE 1 OF THE PLAN. Every row the scorer trains itself is a 16-unit
        # head over a RANDOM 32 of the eye's 1024 numbers, one cell at a time.
        # The decoder (tools/train_decoder.py) is a small convolutional net
        # over the whole patch grid, trained per fold on visible ground only,
        # and lands in the same table as a row of its own. Measured at about
        # 40 s a fold on four threads, so around 20-25 minutes of CPU on top
        # of the extraction at 32 lawns.
        #
        # "fused" (S11, the owner's question of 2026-09-26): the same decoder
        # with seven more numbers a patch -- lidar height, ground-return share
        # and return count, NAIP's NDVI, the tree model's canopy, and a flag
        # each for "no lidar" / "no NAIP" -- with modality dropout. See
        # tools/fuse_layers.py. A choice rather than an eleventh input because
        # GitHub allows ten. Needs the canopy (anything but off).
        #
        # FUSED IS THE MAIN SET-UP FROM 2026-09-27 (owner): H50 measured it
        # level with "on" at 55 lots, and it is the one expected to pull
        # ahead as the corpus grows. "on" stays as the other arm.
        #
        # "fused + edge" (S19, owner 2026-09-29): the fused decoder TWICE over
        # the same features -- as it is, and with the edge refiner
        # (tools/edge_refine.py), a small net on the 15 cm grid that sees the
        # photograph and re-draws the decoder's edge -- scored side by side as
        # "the pretrained eye, decoder" and "decoder, edge refined". Takes the
        # canopy setting for both (not 'compare'); free runner only.
        description: 'Train the convolutional decoder over the full patch grid (on), the same with lidar + NAIP NDVI + canopy as extra inputs (fused, the main set-up), fused with and without the edge refiner (fused + edge, S19), or not at all (off)'
        # THE PLAN FROM 2026-09-29 (H60, owner): `fused + edge`, the default.
        # It still trains and scores the plain fused decoder beside the
        # refined one, so every run keeps the comparison.
        type: choice
        default: 'fused + edge'
        #
        # "fused + edge + trees" (owner, 2026-10-05): THE PLAN's two decoders
        # and two more over the same features, both TAUGHT UNDER TREES (the
        # inferred lawn graded as lawn instead of left out; UNDER_TREES in
        # tools/train_decoder.py), one of them also reading the lidar BY
        # RETURN (penetration, split pulses, spread; FUSE_RETURNS). Read
        # ALONE, beside THE PLAN's row: if a decoder taught what is under a
        # tree beats stage 3's rules, the rules can go. Free runner only.
        # H75: the taught decoder tied THE PLAN (better under the trees,
        # worse in the open) and the lidar by return added nothing, so
        # "+ trees" now trains only the taught decoder and scores THE PLAN
        # with the taught answer under the canopy as a row of its own;
        # "+ trees + returns" keeps the bookmarked returns arm.
        options: ['on', 'fused', 'fused + edge', 'fused + edge + trees', 'fused + edge + trees + returns', 'off']
      seed:
        # THE DECODER'S SEED. It is deterministic given the seed and the
        # features (H26: two runs identical to the decimal), which means one
        # run says nothing about how much the number would move under a
        # different draw of dropout and flips. A second seed is the cheapest
        # measurement of that; H13 says the extraction itself drifts too.
        description: 'Seed for the decoder (change it to measure how much the decoder row moves on a different draw)'
        type: string
        default: '7'
      canopy:
        # THE TREE MODEL'S MASK AS UNSEEN GROUND. The plan's stage 1 finds
        # VISIBLE lawn, and the hand-drawn "inferred" marks are a person's
        # guess at where a canopy edge is; the tree model draws that edge per
        # pixel. With this on, workflow 19's segmenter runs over the same
        # frames first (about ten minutes), and its mask joins the marks:
        # the decoder does not train on it and the SEEN column scores outside
        # it. Never a "not lawn" label -- see seenOnlyTwin in the scorer.
        #
        # "on lawn" (the default) makes canopy unseen ONLY where the tracer
        # drew lawn. "everywhere" makes every canopy cell unseen, which was
        # the first run (H27, 24.3%) -- and in its pictures the lawn's edge
        # crept into the woods, because the woods the tracer never drew had
        # been the decoder's only weighted examples of not-lawn under trees.
        #
        # "compare" trains the decoder THREE times over the one extraction --
        # no canopy, on lawn, everywhere -- and scores all three. H28: the
        # extraction comes back in more than one state and the head rows move
        # 2 points between states, so two RUNS cannot say what the canopy did;
        # three decoders over the same features can. About an hour more.
        description: 'Tree canopy as unseen ground: only over lawn the tracer drew (on lawn), every canopy cell (everywhere), all three decoders over one extraction (compare), or not at all (off).'
        type: choice
        default: 'on lawn'
        options: ['on lawn', 'everywhere', 'compare', 'off']
      not_lawn:
        # THE OWNER'S NOT-LAWN TRACES (tinker mode, 2026-09-29), replacing the
        # public outlines (H57, H61: mostly the middle of a road or a roof,
        # rarely an edge). "on" writes each approved lot's traces beside its
        # labels as <id>-notlawn.png, and the decoders grade those cells as not
        # lawn, even outside the property line. "on" also adds every approved
        # not-lawn-only map (owner, 2026-10-02) as an example frame graded
        # only inside its traces. Off by default until measured. The cache
        # ignores the per-lot traces; the example frames are new photographs,
        # so their features are extracted (and cached) like any frame's.
        description: 'Train with the not-lawn traces drawn in tinker mode, and approved not-lawn-only maps (on), or without (off)'
        type: choice
        default: 'off'
        options: ['off', 'on']
      cache:
        # REUSE WHAT DOES NOT CHANGE (owner, 2026-09-29). The canopy, lidar and
        # NAIP depend only on the frames and their code; the backbone's
        # features only on the frames, the model, the size and the arrangement.
        # Each is saved under a key made of exactly those, so a run that
        # changes only the decoder, the seed or the scorer skips straight to
        # training. 'rebuild' ignores what is saved (e.g. after 3DEP or NAIP
        # themselves change) and saves afresh. Free runner only.
        description: 'Reuse saved canopy / lidar / NAIP / features when nothing they depend on changed'
        type: choice
        default: 'use'
        options: ['use', 'rebuild']
      gpu:
        # WHERE THE ARITHMETIC HAPPENS (owner, 2026-09-28). "modal" sends the
        # tree model, the backbone and the decoders to a GPU on Modal
        # (tools/modal_gpu.py; secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET);
        # the downloads and the scorer stay here. "github" is the four-core
        # CPU runner every run before this used. Same scripts, same settings
        # (tools/modal_plan.py, pinned by modal_plan_test.py); a GPU's float
        # arithmetic differs from a CPU's in the last digits, so compare
        # like with like when it matters.
        # DEFAULT GITHUB (owner, 2026-09-29): Modal costs money -- $8.78 in the
        # first day -- so it is chosen per run, with the owner's approval,
        # never by default. It was measured the same as the CPU to within half
        # a seed (+0.2 [-0.4, +0.8]; a lot moves 1.2 points, a seed 2.6).
        description: 'Where the models run: this free CPU runner, or a paid GPU on Modal (ask first)'
        type: choice
        default: 'github'
        options: ['github', 'modal']
      release:
        # THE LIVE MODEL (owner, 2026-09-29). `alpha` trains THE PLAN's
        # decoder + edge refiner ONCE on every lot in `lawns` -- no folds, no
        # scoring, because a scoring run keeps no weights and a release is
        # not measured, it is shipped -- and puts it on Modal's volume, where
        # the site's "Trained model (alpha release)" reads it. Either runner:
        # `gpu: modal` does the backbone and the training on Modal's L4. Run workflow 2 after
        # the first one so the site switches the model on.
        #
        # FEEDBACK LOOP 1 IS THIS BUTTON: every approved correction joins
        # `lawns: all`, so running it again after a week of corrections
        # ships a model that has learned from them.
        description: 'Ship a release to the site instead of scoring (alpha = train on every lot, upload)'
        type: choice
        default: 'off'
        options: ['off', 'alpha']
      corrections:
        # S21 (owner, 2026-10-06): one more decoder beside THE PLAN's, the same
        # but with the cells where the person corrected the LIVE MODEL's own
        # outline weighted 3x (lots whose outline a trained release drew).
        # Free runner only.
        description: 'Also train THE PLAN weighted toward the live model''s corrected mistakes (S21)'
        type: choice
        default: 'off'
        options: ['off', 'on']
      edge_reach:
        # A WIDER-REACHING EDGE REFINER (owner, 2026-10-06: misses 2-6 m out
        # from the outline along a hard woodline or pavement). "compare" trains
        # THE PLAN's decoder once more over the same features, seed and folds
        # with the refiner reaching ~4.6 m instead of ~1 m, scored as
        # "decoder, wide edge ...". "wide" makes a release use it. Free runner.
        description: 'Edge refiner reach: normal, compare (also train a wide one, ~4.6 m), or wide (for a release)'
        type: choice
        default: 'normal'
        options: ['normal', 'compare', 'wide']
      refiner_trial:
        # AIMING THE REFINER (owner, 2026-10-07, overnight go-ahead). "compare"
        # trains THE PLAN's decoder twice more over the same features, seed
        # and folds: once with the photo's edges handed to the refiner ("hard
        # edges"), once with those AND the wide reach, its changes gated to
        # where the decoder is unsure ("wide gated"). Free runner only. "hard
        # edges" / "wide gated" make a release with that refiner.
        # "average of 3" (overnight 2026-10-07): THE PLAN's decoder and refiner
        # trained three times per fold from different seeds, answers averaged,
        # scored as "decoder, averaged x3 ...". Free runner.
        # HELD OUT BY PHOTO (S32, owner 2026-10-08): THE PLAN's decoder trained
        # once on every lot NOT drawn on a county photo, answering the county
        # lots -- a model that never saw a county photo -- beside a matched
        # control, twelve Mapbox lots held out the same way. Read each against
        # THE PLAN's own row of the same run with workflow 24. Free runner.
        # NO FLIPS (owner, 2026-10-09): THE PLAN's decoder over the same
        # features, seed and folds with every training grid as drawn -- no
        # flips or quarter turns -- to measure what that augmentation is
        # worth before trying more of it. Free runner.
        description: 'Refiner trial: off, compare (hard-edges and wide-gated refiners), hard edges / wide gated (for a release), average of 3 (three decoders averaged), epochs (THE PLAN at 15 and 60 epochs beside the usual 30), held out by photo (county lots answered by a decoder that never saw one, and 12 Mapbox lots the same way), or no flips (THE PLAN trained without flips and quarter turns)'
        type: choice
        default: 'off'
        options: ['off', 'compare', 'hard edges', 'wide gated', 'average of 3', 'epochs', 'held out by photo', 'no flips']
      layers:
        # MIDDLE LAYERS TOO (S30, owner 2026-10-07): "compare" keeps Scale-MAE's
        # blocks 8 and 16 beside its last layer (256 numbers each) and trains
        # THE PLAN's decoder once more reading all three, scored as "decoder,
        # middle layers + ...". Free runner; the backbone runs once either way.
        # "variants" (S31): the same middle layers, cut down three ways --
        # block 8 only, block 16 only, both at 64 numbers each.
        description: 'Backbone layers: last (as always), compare (also a decoder on blocks 8 and 16 too), or variants (block 8 only / 16 only / both small)'
        type: choice
        default: 'last'
        options: ['last', 'compare', 'variants']
      release_epochs:
        # How long a RELEASE trains (S29). 30 is every release so far.
        description: 'Epochs for a release (30 unless S29 found better)'
        default: '30'
      distrust_lidar:
        # LIDAR THAT DISAGREES WITH ITS PHOTO, HIDDEN IN TRAINING (owner,
        # 2026-10-06; H76): a lot whose traced visible lawn stands over 0.5 m
        # on the lidar (B28's felled trees at 25 m) trains the TAUGHT decoders
        # with its lidar zeroed. THE PLAN's decoders are left alone, so they
        # stay the anchor. Held-out lots keep their lidar as it is.
        description: 'Hide in training the lidar of lots where it stands over traced visible lawn (taught decoders only)'
        type: choice
        default: 'off'
        options: ['off', 'on']
      about:
        # WHAT THIS RUN IS FOR, kept with the pictures for ever.
        #
        # This workflow is the one where it matters most: the model, the size
        # and the twins are all recorded automatically, and none of them says
        # whether 1280 was being tried against 896 or the seen-only column was
        # the whole point. Six weeks on, that is the part nobody can rebuild.
        description: 'What is this run testing? (kept with the pictures)'
        required: false
        default: ''

jobs:
  extract:
    name: Extract with PyTorch
    runs-on: ubuntu-latest
    # Generous rather than tight. 1280px is roughly 70 minutes of extraction on
    # a CPU plus the scoring, and a cap that cut that off would waste the whole
    # run at the last step. Three hours is still far short of the six-hour
    # default, so a hung run does not sit there all afternoon.
    # 360 since 2026-09-29: GitHub's own ceiling for a job (owner: use all
    # of it). The two jobs each get it, so a run can take up to twelve hours.
    timeout-minutes: 360
    # PyPI SLOW, NOT GONE (2026-09-28): two of three runs died at the install
    # when pypi.org timed out five times running at pip's 15 s default on one
    # small package; pip then backtracked to an old numpy it could not build.
    # A minute a try and ten tries rides that out.
    env:
      PIP_DEFAULT_TIMEOUT: '60'
      PIP_RETRIES: '10'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          # Without this, setup-python looks for a requirements.txt in the root,
          # finds none, and fails the job before anything has run.
          cache-dependency-path: tools/requirements.txt

      # Stop in seconds rather than after an hour of extraction when the
      # choices cannot go together.
      - name: Check the choices go together
        if: ${{ (inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && (inputs.canopy == 'compare' || (startsWith(inputs.decoder, 'fused + edge + trees') && inputs.canopy == 'off'))) || ((inputs.not_lawn == 'on' || inputs.corrections == 'on') && inputs.gpu == 'modal') || (inputs.release != 'off' && (inputs.decoder != 'fused + edge' || inputs.canopy == 'compare' || inputs.canopy == 'off')) }}
        run: |
          echo "::error::'fused + edge' (and '+ trees', which also needs a canopy setting) trains its decoders under ONE canopy setting (canopy not 'compare'); not-lawn traces are read on the free runner only; a release is THE PLAN (decoder 'fused + edge', a canopy setting) on either runner."
          exit 1

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      # The CPU wheel, explicitly. The default index pulls the CUDA build --
      # about two gigabytes of driver support for a machine with no GPU, which
      # turns a three minute install into fifteen and then never uses it.
      - name: Install PyTorch and the model loader
        run: pip install -r tools/requirements.txt

      # Step one: the photographs, at the same grid everything is measured on,
      # so the patch grid lines up with the outlines without reconciling two
      # separate resizes.
      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          # AS STORED, not at the model's size. This used to be `inputs.size`,
          # which squeezed a 3192 px photograph of a 319 m lot into 896 before
          # the extractor ever saw it -- 36 cm a pixel handed to a model whose
          # rule is 10. The extractor now decides for itself: a lot it can read
          # at 10 cm in one pass is resized there exactly as before, and a
          # bigger one is read in overlapping windows at the photograph's own
          # resolution. Either way it needs the real pixels to choose from.
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          NOT_LAWN: ${{ inputs.not_lawn == 'on' && '1' || '' }}
          LAWN_SET: ${{ inputs.lawns == 'benchmark, 10 folds' && 'benchmark' || inputs.lawns }}
          CORRECTIONS: ${{ inputs.corrections == 'on' && '1' || '' }}
        run: node tools/train-detector.js

      # APPROVED NOT-LAWN-ONLY MAPS (owner, 2026-10-02: the substitute for the
      # public outlines, mostly for ponds) as example frames beside the lots:
      # graded "not lawn" inside their traces and nothing anywhere else, so
      # they say nothing about what surrounds a pond. Trained on, never held
      # out, never scored (train_decoder.py, ':example:').
      # INFERRED LAWN THE OWNER DOES NOT TRUST (owner, 2026-10-08): the ids
      # go beside the frames, and train_decoder.py grades those lots on seen
      # ground only. From the database each run, so a mark made after the
      # frames were cached still counts; sent to Modal with the lidar. The
      # decoder's log says which lots, or that the list was missing.
      - name: Which lots' inferred ground is not taught
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/inferred-doubt.js inferred-doubt.json

      - name: Add the approved not-lawn-only maps
        if: ${{ inputs.not_lawn == 'on' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
        run: node tools/not-lawn-examples.js maps frames

      # That the windows land where the photograph has them, before twenty
      # minutes of extraction relies on it. A stitch off by a patch does not
      # fail; it trains the head on a picture out of register with its labels.
      - name: Check the window stitching
        working-directory: tools
        run: python3 windows_test.py

      # And that labels land on the right patches and answers on the right
      # cells, before the decoder is trained on either. Same reason.
      - name: Check the decoder's grids
        if: ${{ inputs.decoder != 'off' }}
        working-directory: tools
        run: |
          python3 decoder_test.py
          python3 refine_test.py
          python3 release_ensemble_test.py
          python3 multi_layers_test.py
          python3 holdout_test.py
          python3 inferred_doubt_test.py
          python3 flips_test.py

      # The tree model over the same frames, exactly as workflow 19 runs it,
      # so the canopy lands on the pixels the features describe. Its
      # requirements share the CPU torch already installed and add
      # scikit-image and scipy.
      # THE FRAMES' FINGERPRINT: every photograph, label and scale.json byte
      # that went into this run (the examples too, when on). A new approved
      # lot, a re-traced one or a changed NAIP alignment changes it, so a
      # cache can never hand back work done on a different corpus.
      - name: Fingerprint the frames for the cache
        id: frames
        if: ${{ inputs.gpu != 'modal' }}
        run: |
          # Not-lawn traces (<id>-notlawn.png) and the live model's outlines
          # (<id>-detected.png, S21) are left out: only the decoder
          # reads them, so a run with them reuses everything saved without.
          fp=$(cd frames && find . -type f ! -name '*-notlawn.png' ! -name '*-detected.png' -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-20)
          echo "fp=$fp" >> "$GITHUB_OUTPUT"
          echo "frames fingerprint $fp ($(ls frames | wc -l) files)"

      - name: Reuse the canopy, lidar and NAIP if saved
        id: prep
        if: ${{ inputs.gpu != 'modal' && inputs.cache == 'use' && inputs.canopy != 'off' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            canopy
            lidar
            lidar-plan.json
            naip
          key: prep-v1-${{ steps.frames.outputs.fp }}-fused${{ startsWith(inputs.decoder, 'fused') }}-${{ hashFiles('tools/tree-canopy.py', 'tools/clumps.py', 'tools/lidar-plan.js', 'tools/lidar-cover.js', 'tools/lidar_frame.py', 'tools/naip_bands.py', 'tools/naip_align.py', 'tools/requirements-trees.txt', 'tools/requirements-lidar.txt') }}

      - name: Reuse the backbone's features if saved
        id: feats
        if: ${{ inputs.gpu != 'modal' && inputs.cache == 'use' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            feats
            feats-whole
            feats-multi
          key: feats-v1-${{ steps.frames.outputs.fp }}-${{ inputs.model }}-${{ inputs.size }}-${{ inputs.windows }}-${{ inputs.layers == 'last' && 'last' || 'compare' }}-${{ hashFiles('tools/extract_features.py', 'tools/windows.py', 'tools/requirements.txt') }}

      - name: Install the tree model's loader and the lidar reader
        if: ${{ inputs.canopy != 'off' }}
        run: pip install -r tools/requirements-trees.txt -r tools/requirements-lidar.txt

      - name: Check the clump outlines and the lidar arithmetic
        if: ${{ inputs.canopy != 'off' }}
        working-directory: tools
        run: |
          python3 canopy_test.py
          python3 lidar_test.py
          python3 crowns_lidar_test.py
          python3 fuse_test.py
          python3 folds_test.py
          python3 naip_align_test.py

      - name: Install the Modal client
        if: ${{ inputs.gpu == 'modal' }}
        run: pip install modal

      - name: Find the canopy
        if: ${{ inputs.canopy != 'off' && inputs.gpu != 'modal' && steps.prep.outputs.cache-hit != 'true' }}
        env:
          IMAGES: frames
          OUT: canopy
          MODEL: restor/tcd-segformer-mit-b5
          MIN_CLUMP_M2: 4
        run: python3 tools/tree-canopy.py

      # The same script on Modal's GPU. The frames go up once, here, and stay
      # in this run's folder on the volume for the backbone below.
      - name: Find the canopy on Modal's GPU
        if: ${{ inputs.canopy != 'off' && inputs.gpu == 'modal' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RUN_DIR: gh-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          cat > canopy-plan.json <<EOF
          {"run": "$RUN_DIR", "send": ["frames"], "fetch": ["canopy"],
           "steps": [{"script": "tree-canopy.py", "env": {"IMAGES": "frames", "OUT": "canopy",
                      "MODEL": "restor/tcd-segformer-mit-b5", "MIN_CLUMP_M2": "4"}}]}
          EOF
          bash tools/modal-run.sh canopy-plan.json

      # The lidar's canopy height over the same frames, exactly as workflow
      # 23 reads it, for stage 3's woods rule (H34). Three minutes and a few
      # MB a lawn from the public point clouds; a frame with no project over
      # it simply has no height and reads as before.
      #
      # TWO STEPS, NOT ONE: both tools read OUT, and one env block sent the
      # plan into a FILE called "lidar" that the reader then could not make a
      # folder of. Run 36098297014 failed on exactly that.
      - name: Match the frames to the 3DEP projects
        if: ${{ inputs.canopy != 'off' && steps.prep.outputs.cache-hit != 'true' }}
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js

      - name: Read the lidar over the frames
        if: ${{ inputs.canopy != 'off' && steps.prep.outputs.cache-hit != 'true' }}
        env:
          FRAMES: frames
          CANOPY: canopy
          PLAN: lidar-plan.json
          OUT: lidar
          # NAIP-CHM (E9, H41) is no longer read (owner, 2026-09-29): its
          # only uses were the shelved "lidar ∩ NAIP canopy" row and a
          # picture layer. NAIP_CHM=1 brings it back.
        run: python3 tools/lidar_frame.py

      # S11, the fused inputs: NAIP's near-infrared over every frame (one
      # exportImage each, about a metre a pixel), for the decoder to read as
      # NDVI beside the lidar and the canopy. See tools/naip_bands.py.
      - name: Read NAIP's near-infrared over the frames
        if: ${{ startsWith(inputs.decoder, 'fused') && inputs.canopy != 'off' && steps.prep.outputs.cache-hit != 'true' }}
        env:
          FRAMES: frames
          OUT: naip
        run: python3 tools/naip_bands.py

      # THE LIDAR BY RETURN (owner, 2026-10-05; H73), for the decoders taught
      # under trees. The same frames and 3DEP plan as the lidar step above,
      # read again keeping each point's return number (tools/tree_lidar.py).
      # Not cached: about 15-25 minutes of point downloads.
      - name: Read the lidar by return over the frames
        if: ${{ inputs.decoder == 'fused + edge + trees + returns' && inputs.canopy != 'off' }}
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          OUT: tree-lidar
        run: |
          (cd tools && python3 tree_lidar_test.py)
          python3 tools/tree_lidar.py

      # IS THE LIDAR'S GROUND WHERE THE GROUND IS? (H76) Seconds; its JSON is
      # what `distrust_lidar` reads, and its table is worth having every run.
      - name: Check the lidar against the visible lawn
        if: ${{ inputs.canopy != 'off' }}
        continue-on-error: true
        env:
          LIDAR: lidar
          FRAMES: frames
          OUT: lidar/ground-check.json
        run: python3 tools/lidar_ground_check.py

      # Both scales: the whole-lot pass first, into its own directory, exactly
      # as `windows: off` reads it; the step below then reads the 6 cm blocks.
      - name: Run the backbone over each lot whole (both scales)
        if: ${{ inputs.windows == 'both' && inputs.gpu != 'modal' && steps.feats.outputs.cache-hit != 'true' }}
        env:
          IMAGES: frames
          OUT: feats-whole
          MODEL: ${{ inputs.model }}
          SIZE: ${{ inputs.size }}
          TARGET_MPP: '9'
        run: python3 tools/extract_features.py

      - name: Run the backbone over them
        if: ${{ inputs.gpu != 'modal' && steps.feats.outputs.cache-hit != 'true' }}
        env:
          IMAGES: frames
          OUT: feats
          MODEL: ${{ inputs.model }}
          SIZE: ${{ inputs.size }}
          # Nine metres a pixel is a target no lot fails, so "off" reads every
          # lot whole -- the pre-2026-09-23 behaviour, kept as the control.
          TARGET_MPP: ${{ inputs.windows == 'off' && '9' || '0.10' }}
          TILE_MPP: ${{ (inputs.windows == 'tiles' || inputs.windows == 'both') && '0.06' || (inputs.windows == 'tiles 10 cm' && '0.10' || '') }}
          MULTI_LAYERS: ${{ inputs.layers != 'last' && '8,16' || '' }}
          MULTI_OUT: ${{ inputs.layers != 'last' && 'feats-multi' || '' }}
        run: python3 tools/extract_features.py

      # The backbone and every decoder in one call on Modal's GPU, with the
      # environment each would get here (tools/modal_plan.py). The frames are
      # already there when the canopy ran there; the lidar and NAIP are not.
      # Features and answers come back for the scorer, and the run's folder
      # on the volume is deleted.
      - name: Run the backbone and train the decoders on Modal's GPU
        if: ${{ inputs.gpu == 'modal' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}
          SEND: ${{ inputs.canopy == 'off' && 'frames' || '' }},lidar,naip,inferred-doubt.json${{ inputs.decoder == 'fused + edge + trees + returns' && ',tree-lidar' || '' }}
          WINDOWS: ${{ inputs.windows }}
          CANOPY: ${{ inputs.canopy }}
          DECODER: ${{ inputs.decoder }}
          DISTRUST_LIDAR: ${{ inputs.distrust_lidar }}
          EDGE_REACH: ${{ inputs.edge_reach }}
          REFINER_TRIAL: ${{ inputs.refiner_trial }}
          RELEASE_EPOCHS: ${{ inputs.release_epochs }}
          SEED: ${{ inputs.seed }}
          LAWNS: ${{ inputs.lawns }}
          MODEL: ${{ inputs.model }}
          SIZE: ${{ inputs.size }}
          RELEASE: ${{ inputs.release }}
          OUT: gpu-plan.json
        run: |
          python3 tools/modal_plan.py
          bash tools/modal-run.sh gpu-plan.json

      # A release trained on Modal ships from here; the training job has
      # nothing left to do for it.
      - name: Hand the release to the live server (trained on Modal)
        if: ${{ inputs.gpu == 'modal' && inputs.release != 'off' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: bash tools/ship-release.sh

      - name: Keep the release beside the run (trained on Modal)
        if: ${{ inputs.gpu == 'modal' && inputs.release != 'off' }}
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

      # Saved BEFORE the handoff below moves the folders into the tar. Only
      # what was computed this run is saved; a hit is left as it was.
      - name: Save the canopy, lidar and NAIP for later runs
        if: ${{ inputs.gpu != 'modal' && inputs.canopy != 'off' && steps.prep.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            canopy
            lidar
            lidar-plan.json
            naip
          key: prep-v1-${{ steps.frames.outputs.fp }}-fused${{ startsWith(inputs.decoder, 'fused') }}-${{ hashFiles('tools/tree-canopy.py', 'tools/clumps.py', 'tools/lidar-plan.js', 'tools/lidar-cover.js', 'tools/lidar_frame.py', 'tools/naip_bands.py', 'tools/naip_align.py', 'tools/requirements-trees.txt', 'tools/requirements-lidar.txt') }}

      - name: Save the backbone's features for later runs
        if: ${{ inputs.gpu != 'modal' && steps.feats.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            feats
            feats-whole
            feats-multi
          key: feats-v1-${{ steps.frames.outputs.fp }}-${{ inputs.model }}-${{ inputs.size }}-${{ inputs.windows }}-${{ inputs.layers == 'last' && 'last' || 'compare' }}-${{ hashFiles('tools/extract_features.py', 'tools/windows.py', 'tools/requirements.txt') }}

      # TWO JOBS, NOT ONE (2026-09-28). A job may run six hours at most, and
      # the not-lawn examples (~140 frames beside 55 lots) made every step
      # about 3.6x longer: the 6 cm blocks would have spent five hours in the
      # backbone alone. Everything the decoders and the scorer read goes to
      # the second job as one artifact, and that job gets six hours of its own.
      # ONE TAR, NOT A FOLDER: artifacts refuse file names with a colon, and
      # every lot id has two ("-112.83597,37.70577:sam3:find"). The first
      # run of this split died on exactly that (36471713925).
      - name: Hand the frames and features to the training job
        run: |
          mkdir -p work
          have=""
          for d in frames canopy lidar naip tree-lidar feats feats-whole feats-multi lidar-plan.json preds preds-edge preds-corr preds-nonl preds-wide preds-hardedge preds-widegate preds-ens3 preds-ep15 preds-ep60 preds-noflip preds-multi preds-l8 preds-l16 preds-lsmall preds-hold-county preds-hold-mapbox preds-trees preds-trees-canopy preds-trees-returns preds-none preds-lawn preds-all; do
            if [ -e "$d" ]; then have="$have $d"; fi
          done
          du -sh $have || true
          tar -cf work/work.tar $have
          ls -la work

      - name: Keep them for the training job
        uses: actions/upload-artifact@v4
        with:
          name: work
          path: work/work.tar
          retention-days: 1
          # Floats and photographs do not compress; zipping them is only time.
          compression-level: 0

  train:
    name: Train the decoder and score it
    needs: extract
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PIP_DEFAULT_TIMEOUT: '60'
      PIP_RETRIES: '10'
      # Every decoder reads the not-lawn traces the dump wrote, when asked.
      NOT_LAWN: ${{ inputs.not_lawn == 'on' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Install PyTorch and the model loader
        run: pip install -r tools/requirements.txt

      - name: Install the tree model's loader and the lidar reader
        if: ${{ inputs.canopy != 'off' }}
        run: pip install -r tools/requirements-trees.txt -r tools/requirements-lidar.txt

      - name: Fetch the frames and features from the extraction job
        uses: actions/download-artifact@v4
        with:
          name: work
          path: work

      - name: Put them where the steps below expect them
        run: |
          tar -xf work/work.tar
          rm -f work/work.tar
          ls

      # Step one and a half: one decoder per held-out lawn over the full patch
      # grid, its answers written as pictures for the scorer to read. Leave
      # one out exactly as the scorer does, so the row it produces is the same
      # kind of number as the rows beside it.
      - name: Train the decoder
        if: ${{ inputs.release == 'off' && inputs.decoder != 'off' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: ${{ startsWith(inputs.decoder, 'fused') && '1' || '' }}
          FUSE_LIDAR: lidar
          # Leave-one-out costs the square of the corpus (68 min a decoder at
          # 53 lawns, past the time limit with three). The full corpus is held
          # out a NEIGHBOURHOOD at a time in 15 folds (tools/folds.py): a lot is
          # never scored by a decoder that trained on the lot next door. The
          # benchmark stays leave-one-out, as every table was.
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          # THE REFINER'S TWIN (2026-10-07). In a `fused + edge` run this is
          # THE PLAN's decoder WITHOUT the refiner -- taught under trees, the
          # canopy as input, exactly as the step below -- so the pictures'
          # navy and black layers are the refiner's change and nothing else.
          # From H78 to this date it was the older untaught decoder, and those
          # layers mixed three changes (owner's reading, 2026-10-07).
          FUSE_CANOPY: ${{ (startsWith(inputs.decoder, 'fused + edge') && inputs.canopy != 'off' || inputs.canopy == 'everywhere') && '1' || '0' }}
          UNDER_TREES: ${{ startsWith(inputs.decoder, 'fused + edge') && inputs.canopy != 'off' && '1' || '' }}
        run: python3 tools/train_decoder.py

      # S19: the same decoder, same features, same folds and seed, trained
      # together with the edge refiner (tools/edge_refine.py), which re-draws
      # its edge on the 15 cm grid from the photograph. Scored beside the
      # plain one above, so the comparison is within one extraction.
      - name: Train the decoder with the edge refiner
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-edge
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          # H78 (2026-10-06): THE PLAN's decoder is taught under trees and given
          # the canopy as an input; stage 3 and the veto still follow it.
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
        run: python3 tools/train_decoder.py

      # The same, with the refiner reaching ~4.6 m either side (edge_reach).
      - name: Train THE PLAN's decoder with a wide edge refiner
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.edge_reach == 'compare' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-wide
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          REFINE_REACH: wide
        run: python3 tools/train_decoder.py

      # AIMING THE REFINER (refiner_trial: compare), over THE PLAN's features.
      - name: Train THE PLAN's decoder with the photo's edges in the refiner
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.refiner_trial == 'compare' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-hardedge
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          REFINE_EDGES: '1'
        run: python3 tools/train_decoder.py

      - name: Train THE PLAN's decoder with a wide, doubt-gated refiner given the photo's edges
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.refiner_trial == 'compare' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-widegate
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          REFINE_EDGES: '1'
          REFINE_GATE: '1'
          REFINE_REACH: wide
        run: python3 tools/train_decoder.py

      - name: Train THE PLAN's decoder three times and average them
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.refiner_trial == 'average of 3' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-ens3
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          ENSEMBLE: '3'
        run: python3 tools/train_decoder.py

      # HELD OUT BY PHOTO (S32): see the input. Both steps read which photo
      # each lot was drawn on from the database (tools/photo-sources.js).
      - name: Train THE PLAN's decoder on the Mapbox lots only, answering the county lots
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.refiner_trial == 'held out by photo' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-hold-county
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          HOLDOUT: county
          HOLDOUT_SOURCES: photos.json
        run: |
          node tools/photo-sources.js photos.json
          python3 tools/train_decoder.py
      - name: Train THE PLAN's decoder with twelve Mapbox lots held out the same way
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.refiner_trial == 'held out by photo' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-hold-mapbox
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          HOLDOUT: 'mapbox:12'
          HOLDOUT_SOURCES: photos.json
        run: python3 tools/train_decoder.py

      # HOW LONG TO TRAIN (owner, 2026-10-07): 30 epochs was set at 32 lots on
      # 2026-09-24 (H25) and never tested since. THE PLAN at 15 and 60 beside it.
      - name: Train THE PLAN's decoder for 15 epochs
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.refiner_trial == 'epochs' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-ep15
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          EPOCHS: '15'
        run: python3 tools/train_decoder.py

      - name: Train THE PLAN's decoder for 60 epochs
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.refiner_trial == 'epochs' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-ep60
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          EPOCHS: '60'
        run: python3 tools/train_decoder.py

      # NO FLIPS (owner, 2026-10-09): what the eight orientations are worth.
      - name: Train THE PLAN's decoder without flips or quarter turns
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.refiner_trial == 'no flips' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-noflip
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          FLIPS: '0'
        run: python3 tools/train_decoder.py

      - name: Train THE PLAN's decoder reading the middle layers too
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.layers == 'compare' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: feats-multi
          FRAMES: frames
          OUT: preds-multi
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
        run: python3 tools/train_decoder.py

      # S31: chasing H85's parking-lot gain with less of the middle layers.
      - name: Train THE PLAN's decoder reading block 8 too
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.layers == 'variants' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: feats-multi
          WHOLE_SLICE: '0-255'
          FRAMES: frames
          OUT: preds-l8
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
        run: python3 tools/train_decoder.py

      - name: Train THE PLAN's decoder reading block 16 too
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.layers == 'variants' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: feats-multi
          WHOLE_SLICE: '256-511'
          FRAMES: frames
          OUT: preds-l16
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
        run: python3 tools/train_decoder.py

      - name: Train THE PLAN's decoder reading both middle blocks, small
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.layers == 'variants' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: feats-multi
          WHOLE_SLICE: '0-63,256-319'
          FRAMES: frames
          OUT: preds-lsmall
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
        run: python3 tools/train_decoder.py

      # S21 and the pond maps (owner, 2026-10-06), over the same features as
      # THE PLAN's decoder above: once weighted toward the live model's
      # corrected mistakes, once without the not-lawn maps a not_lawn run adds.
      - name: Train THE PLAN's decoder weighted to its corrections
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.corrections == 'on' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-corr
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          # H78 (2026-10-06): THE PLAN's decoder is taught under trees and given
          # the canopy as an input; stage 3 and the veto still follow it.
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          CORRECTIONS_WEIGHT: '3'
        run: python3 tools/train_decoder.py
      - name: Train THE PLAN's decoder without the not-lawn maps
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge') && inputs.not_lawn == 'on' && inputs.canopy != 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-nonl
          CANOPY: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          # H78 (2026-10-06): THE PLAN's decoder is taught under trees and given
          # the canopy as an input; stage 3 and the veto still follow it.
          FUSE_CANOPY: ${{ inputs.canopy != 'off' && '1' || '0' }}
          UNDER_TREES: ${{ inputs.canopy != 'off' && '1' || '' }}
          REFINE: '1'
          SKIP_EXAMPLES: '1'
          NOT_LAWN: ''
        run: python3 tools/train_decoder.py

      # TAUGHT UNDER TREES (owner, 2026-10-05): THE PLAN's decoder (fused,
      # edge refiner) again over the same features, seed and folds, with the
      # inferred lawn graded as lawn. Then the same with the lidar by return.
      - name: Train the decoder taught under trees
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge + trees') && inputs.canopy != 'compare' && inputs.canopy != 'off' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-trees
          CANOPY: canopy
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy == 'everywhere' && '1' || '0' }}
          REFINE: '1'
          UNDER_TREES: '1'
          LIDAR_DISTRUST: ${{ inputs.distrust_lidar == 'on' && 'lidar/ground-check.json' || '' }}
        run: |
          (cd tools && python3 under_trees_test.py)
          python3 tools/train_decoder.py
      # THE SAME, TOLD WHERE THE CANOPY IS (owner's review of H75's pictures,
      # 2026-10-06: "more willing to trace bare ground and pavement"). Taught
      # lawn on leaf-coloured pixels with no canopy input, a decoder can only
      # learn "not-grass can be lawn" everywhere; with the tree model's mask
      # as an input it can learn it under trees only. H48's reason for
      # keeping the channel out (every canopy cell it saw was not-lawn) does
      # not hold once canopy over lawn is graded as lawn.
      - name: Train the decoder taught under trees, canopy as input
        if: ${{ inputs.release == 'off' && startsWith(inputs.decoder, 'fused + edge + trees') && inputs.canopy != 'compare' && inputs.canopy != 'off' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-trees-canopy
          CANOPY: canopy
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: '1'
          REFINE: '1'
          UNDER_TREES: '1'
          LIDAR_DISTRUST: ${{ inputs.distrust_lidar == 'on' && 'lidar/ground-check.json' || '' }}
        run: python3 tools/train_decoder.py
      - name: Train the decoder taught under trees, with the lidar by return
        if: ${{ inputs.release == 'off' && inputs.decoder == 'fused + edge + trees + returns' && inputs.canopy != 'compare' && inputs.canopy != 'off' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-trees-returns
          CANOPY: canopy
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FUSE_RETURNS: tree-lidar
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          FUSE_CANOPY: ${{ inputs.canopy == 'everywhere' && '1' || '0' }}
          REFINE: '1'
          UNDER_TREES: '1'
          LIDAR_DISTRUST: ${{ inputs.distrust_lidar == 'on' && 'lidar/ground-check.json' || '' }}
        run: python3 tools/train_decoder.py

      # THE THREE-WAY COMPARISON, over the one extraction above. Same seed,
      # same features, same folds; only what carries weight differs.
      - name: Train the decoder without the canopy
        if: ${{ inputs.decoder != 'off' && inputs.canopy == 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-none
          SEED: ${{ inputs.seed }}
          FUSE: ${{ startsWith(inputs.decoder, 'fused') && '1' || '' }}
          FUSE_LIDAR: lidar
          # Leave-one-out costs the square of the corpus (68 min a decoder at
          # 53 lawns, past the time limit with three). The full corpus is held
          # out a NEIGHBOURHOOD at a time in 15 folds (tools/folds.py): a lot is
          # never scored by a decoder that trained on the lot next door. The
          # benchmark stays leave-one-out, as every table was.
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
        run: python3 tools/train_decoder.py

      - name: Train the decoder, canopy unseen on lawn
        if: ${{ inputs.decoder != 'off' && inputs.canopy == 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-lawn
          CANOPY: canopy
          CANOPY_MODE: lawn
          SEED: ${{ inputs.seed }}
          FUSE: ${{ startsWith(inputs.decoder, 'fused') && '1' || '' }}
          FUSE_LIDAR: lidar
          # Leave-one-out costs the square of the corpus (68 min a decoder at
          # 53 lawns, past the time limit with three). The full corpus is held
          # out a NEIGHBOURHOOD at a time in 15 folds (tools/folds.py): a lot is
          # never scored by a decoder that trained on the lot next door. The
          # benchmark stays leave-one-out, as every table was.
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
          # H48: no canopy CHANNEL for this decoder -- every canopy cell it is
          # graded on is not-lawn, so the channel taught "canopy = not lawn".
          FUSE_CANOPY: '0'
        run: python3 tools/train_decoder.py

      - name: Train the decoder, canopy unseen everywhere
        if: ${{ inputs.decoder != 'off' && inputs.canopy == 'compare' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          OUT: preds-all
          CANOPY: canopy
          CANOPY_MODE: all
          SEED: ${{ inputs.seed }}
          FUSE: ${{ startsWith(inputs.decoder, 'fused') && '1' || '' }}
          FUSE_LIDAR: lidar
          # Leave-one-out costs the square of the corpus (68 min a decoder at
          # 53 lawns, past the time limit with three). The full corpus is held
          # out a NEIGHBOURHOOD at a time in 15 folds (tools/folds.py): a lot is
          # never scored by a decoder that trained on the lot next door. The
          # benchmark stays leave-one-out, as every table was.
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          FUSE_NAIP: naip
        run: python3 tools/train_decoder.py

      # Step two: the same folds, the same scoring, the same comparison against
      # SAM. Only where the numbers came from has changed, which is what makes
      # this answerable against workflow 12's table.
      - name: Score it the same way as before
        if: ${{ inputs.release == 'off' }}
        env:
          # Every row's per-lot result as a file, for workflow 24 to compare
          # runs lot by lot and across seeds (tools/compare-runs.js).
          LOT_RESULTS: lot-results.json
          # Only a label here -- the decoders above did the folding -- but
          # without it every file said "leave-one-out" (H50's six did).
          FOLDS: ${{ (inputs.lawns == 'all' || inputs.lawns == 'locked') && 'place' || (inputs.lawns == 'benchmark, 10 folds' && '10' || '') }}
          SEED: ${{ inputs.seed }}
          DECODER_KIND: ${{ inputs.decoder }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          FEATURES_DIR: feats
          EXPORT_MODEL: ${{ inputs.publish }}
          # ALWAYS DRAWN. This was an input until 2026-09-24; it went to make
          # room for `seed` under GitHub's limit of ten dispatch inputs. (The
          # runs that failed in four seconds with no log that morning were
          # NOT this -- workflow 1, untouched, failed the same way. Every job
          # on the account stopped starting, which is what an exhausted
          # Actions allowance looks like.) The pictures are two minutes and
          # have never been the thing anyone turned off.
          RENDER_PREDICTIONS: 'true'
          SEEN_ONLY_TWINS: ${{ inputs.seen_only }}
          RUN_ABOUT: ${{ inputs.about }}
          # 15 cm a cell, 512 to 1024 across. The old fixed 512 was an input
          # until 2026-09-24; H23 measured the two as the same.
          GRID_CELL_M: '0.15'
          LAWN_SET: ${{ inputs.lawns == 'benchmark, 10 folds' && 'benchmark' || inputs.lawns }}
          # Empty when the decoder was not trained, and the scorer skips the row.
          PREDICTIONS_DIR: ${{ inputs.decoder != 'off' && inputs.canopy != 'compare' && 'preds' || '' }}
          # The three-way comparison, one row each. The seen column is scored
          # with the canopy unseen on lawn, whichever decoder is being read.
          # S19 (`fused + edge`): the refined decoder as a row of its own.
          PREDICTIONS_DIRS: ${{ (inputs.decoder != 'off' && inputs.canopy == 'compare' && 'no canopy=preds-none,canopy on lawn=preds-lawn,canopy everywhere=preds-all') || (inputs.decoder == 'fused + edge' && format('edge refined=preds-edge{0}{1}{2}{3}{4}{5}{6}{7}{8}', inputs.corrections == 'on' && ',corrections weighted=preds-corr' || '', inputs.not_lawn == 'on' && ',no pond maps=preds-nonl' || '', inputs.edge_reach == 'compare' && ',wide edge=preds-wide' || '', inputs.refiner_trial == 'compare' && ',hard edges=preds-hardedge,wide gated=preds-widegate' || '', inputs.refiner_trial == 'average of 3' && ',averaged x3=preds-ens3' || '', inputs.refiner_trial == 'epochs' && ',15 epochs=preds-ep15,60 epochs=preds-ep60' || inputs.refiner_trial == 'no flips' && ',no flips=preds-noflip' || '', inputs.layers == 'compare' && ',middle layers=preds-multi' || '', inputs.layers == 'variants' && ',layer 8=preds-l8,layer 16=preds-l16,layers small=preds-lsmall' || '', inputs.refiner_trial == 'held out by photo' && ',held out county=preds-hold-county,held out 12 Mapbox=preds-hold-mapbox' || '')) || (inputs.decoder == 'fused + edge + trees' && 'edge refined=preds-edge,taught under trees=preds-trees,taught under trees with canopy input=preds-trees-canopy') || (inputs.decoder == 'fused + edge + trees + returns' && 'edge refined=preds-edge,taught under trees=preds-trees,taught under trees with canopy input=preds-trees-canopy,taught under trees + returns=preds-trees-returns') || '' }}
          # The canopy joins the hand-marked unseen ground for the seen column.
          CANOPY_DIR: ${{ inputs.canopy != 'off' && 'canopy' || '' }}
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          # The lidar's height, for stage 3's woods rule only (H34).
          LIDAR_DIR: ${{ inputs.canopy != 'off' && 'lidar' || '' }}
          # H47: the drawn row's held-out masks, for the step below.
          PRED_OUT: ${{ inputs.canopy != 'off' && 'preds-out' || '' }}
        run: node tools/train-detector.js

      # H47's fair half: the per-crown woods test again, with the detector's
      # visible lawn in place of the tracer's (tools/segments_pred.py). It
      # measures, it changes nothing, so it never fails the run.
      - name: One segment per crown, judged by the detector's lawn edge
        if: ${{ inputs.release == 'off' && inputs.canopy != 'off' }}
        continue-on-error: true
        working-directory: tools
        env:
          LIDAR: ../lidar
          PRED: ../preds-out
        run: python3 segments_pred.py

      # THE RELEASE: THE PLAN's decoder and edge refiner, trained once on
      # every lot, exactly as the fold that scored it was trained (same
      # features, seed, fused channels and canopy setting) -- then handed to
      # the live server on Modal's volume. tools/modal_serve.py reads
      # /models/alpha/model.pt when a container starts, so the next cold
      # start serves it; no redeploy of the model server is needed.
      - name: Train the release model on every lot
        if: ${{ inputs.release != 'off' && inputs.gpu != 'modal' }}
        env:
          FEATURES: feats
          FEATURES_WHOLE: ${{ inputs.windows == 'both' && 'feats-whole' || '' }}
          FRAMES: frames
          CANOPY: canopy
          CANOPY_MODE: ${{ inputs.canopy == 'everywhere' && 'all' || 'lawn' }}
          SEED: ${{ inputs.seed }}
          FUSE: '1'
          FUSE_LIDAR: lidar
          FUSE_NAIP: naip
          # THE PLAN as H78 adopted it: taught under trees, canopy as input.
          FUSE_CANOPY: '1'
          UNDER_TREES: '1'
          REFINE: '1'
          REFINE_REACH: ${{ (inputs.edge_reach == 'wide' || inputs.refiner_trial == 'wide gated') && 'wide' || '' }}
          REFINE_EDGES: ${{ (inputs.refiner_trial == 'hard edges' || inputs.refiner_trial == 'wide gated') && '1' || '' }}
          REFINE_GATE: ${{ inputs.refiner_trial == 'wide gated' && '1' || '' }}
          # H83: a release of three decoders, averaged (refiner_trial: average of 3).
          ENSEMBLE: ${{ inputs.refiner_trial == 'average of 3' && '3' || '' }}
          EPOCHS: ${{ inputs.release_epochs }}
          OUT: preds-release
          RELEASE_OUT: release
        run: python3 tools/train_decoder.py

      - name: Hand the release to the live server
        if: ${{ inputs.release != 'off' && inputs.gpu != 'modal' }}
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: bash tools/ship-release.sh

      - name: Keep the release beside the run
        if: ${{ inputs.release != 'off' && inputs.gpu != 'modal' }}
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/

      - name: Keep the per-lot results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot-results
          path: lot-results.json
          if-no-files-found: ignore

      - name: If that failed
        if: failure()
        run: |
          echo "Nothing was spent finding this out."
          echo
          echo "The usual reasons, in order:"
          echo "  * the runner could not reach the weights (huggingface.co)"
          echo "  * a larger model ran out of memory at that size -- try 448,"
          echo "    or a smaller model, before concluding anything"
          echo "  * Scale-MAE only: scale.json missing from the frames. It is"
          echo "    written by the dump step, so the dump step failed first."
          echo
          echo "Scale-MAE refuses to run scale-blind on purpose. A model told"
          echo "the wrong ground size does not error, it just reads a garden"
          echo "as a landscape -- so a missing number stops the run instead."
