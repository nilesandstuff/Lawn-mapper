name: P. Parcel probe

# IS THE COUNTY'S PARCEL SERVER ANSWERING (tools/parcel-probe.mjs; core session, 2026-11-09): the site's lookup gives
# up after 6 s and answers "no parcel" on any failure; this times every county endpoint for the administrators' maps.
# Prints timings and counts only (the repository and its logs are public). Free.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/parcel-probe.mjs | tee probe.txt
      - name: The answer
        if: always()
        run: |
          echo "--------------------------------------------------------------"
          cat probe.txt 2>/dev/null || echo "no probe: see the step above"
