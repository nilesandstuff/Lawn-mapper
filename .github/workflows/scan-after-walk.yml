name: S4. After a walk

# EACH WALK UPDATES ITS MAP BY ITSELF (core session, 2026-11-26). The owner, 2026-11-25: "Each walk should be an update
# to both the reference (when it's a good walk) and the fused map." Every hour: the walks of the last few days that
# have finished being sent, by their map (scan/tools/after-walk.mjs plan). For a map with a walk not yet taken up, the
# plants (plants.py, then plants-pool.mjs) and the ground's colours (surfaces.py) of ALL its walks of late are made
# again as one and kept with the map; the start page puts the plants into the map's record when the map next opens,
# and the fused model is made again from them there. Nothing runs when no walk is new.
#
# By hand: `walks` = "walk,walk,..." (newest first) does those walks now and marks them.
# Free CPU. Prints walk ids, counts and sizes only: no map ids, no places, no pictures.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      walks:
        description: 'Walks of ONE map, newest first, comma separated; empty to look for new walks'
        default: ''
      adopt:
        description: 'A walk that names no map takes another walk''s: "<walk>:<walk whose map it takes>"; empty for none'
        default: ''

permissions:
  contents: read

concurrency:
  group: scan-after-walk
  cancel-in-progress: false

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: A walk that names no map takes another walk's
        if: ${{ inputs.adopt != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADOPT: ${{ inputs.adopt }}
        run: |
          if [[ "$ADOPT" =~ ^[0-9]+:[0-9]+$ ]]; then node scan/tools/after-walk.mjs adopt "${ADOPT%%:*}" "${ADOPT##*:}" | tee adopt.txt; else echo "adopt: not <walk>:<walk>"; exit 1; fi
      - name: Which maps have a new walk
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walks }}
        run: |
          if [[ "$WALKS" =~ ^[0-9,]+$ ]]; then echo "$WALKS" > after-plan.txt; echo "AFTER A WALK: asked by hand for walks ${WALKS//,/, }."; else node scan/tools/after-walk.mjs plan after-plan.txt; fi
          echo "DUE=$(grep -c . after-plan.txt || true)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        if: ${{ env.DUE != '0' }}
        with:
          python-version: '3.11'
      - name: The walks' plants and ground, made again as one
        if: ${{ env.DUE != '0' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPS_READ_TOKEN: ${{ secrets.MAPS_READ_TOKEN }}
          SITE: https://${{ vars.CUSTOM_DOMAIN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -o pipefail
          pip install --quiet numpy scipy pillow
          # the picture models (the large labeller for a walk that has none yet, and the small one for the ground), on the CPU
          TORCH=0
          if pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu > /dev/null 2>&1 && pip install --quiet "transformers>=4.45,<5" > /dev/null 2>&1; then TORCH=1; fi
          : > after.txt
          n=0
          while IFS= read -r LINE; do
            [ -z "$LINE" ] && continue
            n=$((n + 1)); FIRST="${LINE%%,*}"; DIRS=""
            echo "MAP $n: walks ${LINE//,/, }" | tee -a after.txt
            for W in ${LINE//,/ }; do
              D="m$n-$W"
              node scan/tools/twin-r2.mjs parts "$W" "$D" 'cloud-*' 'labels-*' view-kind.bin view-rgb.bin view.json start.json owner-trunks.json live.json meta.json 'track-*' 'keys-*' 'key-*.sem' 'key-*.rdepth' 'key-*.sdepth' 'key-*.jpg' segments-masks.npz planes.json yard-labels.npz | tail -1 | tee -a after.txt
              # THE LARGE LABELLER ON EVERY NEW WALK (2026-11-26): Mask2Former on the free CPU (classes_cpu.py, 2-3 s a picture),
              # once a walk; its classes are kept with the walk, so a walk already classed is not classed again. Until now this
              # ran only by hand (scan-deploy task classes), and a walk without it fell back to the small labeller off the shelf.
              if [ "$TORCH" = 1 ] && [ ! -f "$D/segments-masks.npz" ] && ls "$D"/key-*.jpg > /dev/null 2>&1; then
                if timeout 50m python scan/tools/classes_cpu.py "$D" 800 2>&1 | grep -v -i "key-[0-9]" | tail -2 | tee -a after.txt && [ -f "$D/segments-masks.npz" ]; then
                  node scan/tools/twin-r2.mjs put "$W" "$D/segments-masks.npz" | tail -1 | tee -a after.txt || true
                else echo "  $W: the large labeller did not finish; the small one reads its ground" | tee -a after.txt; rm -f "$D/segments-masks.npz"; fi
              fi
              # the walk on its map by its own agreeing corners; a walk they do not vouch for gives no plants and no ground
              node scan/tools/walk-fit.mjs "$D" | tee -a after.txt || true
              # and through the map's reference, a stretch at a time, when the walk's corners agree (twin-onref.mjs): every walk
              # so placed is in the one frame of the shape the walks built, not each in its own corners' fit
              node scan/tools/twin-onref.mjs "$D" | tee -a after.txt || true
              if [ -f "$D/onref.json" ]; then node scan/tools/twin-r2.mjs put "$W" "$D/onref.json" > /dev/null || true; fi
              # the pictures' own tree cells (their depth to 12 m, the smoothed depth in the raw one's holes) beside the walk's
              # points for plants.py, then taken away again before the ground is read (cast_plants.py)
              python scan/tools/cast_plants.py "$D" | tee -a after.txt || true
              python scan/tools/plants.py "$D" "$D/plants.json" 2>&1 | grep -E "ON THE MAP|Nothing kept|neither" | cut -c1-400 | tee -a after.txt || true
              python scan/tools/cast_plants.py "$D" --undo || true
              DIRS="$DIRS $D"
            done
            # the owner's erasures on the map, left out of what is kept
            node scan/tools/after-walk.mjs edits "m$n-$FIRST" "m$n-edits.json" | tee -a after.txt || echo '{"v":1,"erased":[]}' > "m$n-edits.json"
            # the plants of every walk as one, kept with the map (the one before is a backup)
            node scan/tools/plants-pool.mjs "m$n-$FIRST" $DIRS --edits "m$n-edits.json" | tee -a after.txt
            node scan/tools/plants-keep.mjs "$FIRST" "m$n-$FIRST" | tee -a after.txt || true
            # the ground's colours of every walk as one, kept with the map
            # (the traced lawn is not read here: the comparison with it is the surfaces task's, by hand)
            # THE SECOND LABELLER (ground_labels.py: SegFormer-B0, small enough for a phone) on the walks' pictures, for the ground
            ADE=""
            if [ "$TORCH" = 1 ] && python scan/tools/ground_labels.py $DIRS | tee -a after.txt; then ADE="--ade"; else echo "  The second labeller: could not be run; the colour alone." | tee -a after.txt; fi
            # THE YARD'S THINGS BY NAME (2026-11-27; the owner: "it needs vision labels to determine what is deck. And we'll
            # need more labels for objects around yards"): CLIPSeg told a deck, a hot tub, a fence, a pool... in words, once a
            # walk (yard-labels.npz kept with it); surfaces.py prints what they say on each lidar shape (a study for now)
            if [ "$TORCH" = 1 ] && timeout 40m python scan/tools/yard_labels.py $DIRS 2>&1 | grep "YARD'S THINGS" | cut -c1-600 | tee -a after.txt; then
              for D in $DIRS; do if [ -f "$D/yard-labels.npz" ]; then node scan/tools/twin-r2.mjs put "${D#m$n-}" "$D/yard-labels.npz" > /dev/null || true; fi; done
            fi
            # turf, paving and porous ground, one kind a square: the ground's own colour tells turf from brown, brown near a
            # plant is fallen leaves and not called, and a plant standing on a square takes it from the ground (surfaces.py)
            # THE LIDAR'S SHAPES for the walks to check (2026-11-27; the owner: "checks on the lidar... 'lidar says there's a
            # building here. Yup there is, but the shape is a bit off'"): the shade map's lidar model on the walks' squares
            LIDAR=""
            node scan/tools/lidar-built.mjs "m$n-$FIRST" "m$n-lidar.json" | tee -a after.txt || true
            if [ -f "m$n-lidar.json" ]; then LIDAR="--lidar m$n-lidar.json"; fi
            python scan/tools/surfaces.py $DIRS --colour --reach 12 --smooth $ADE $LIDAR --plants "m$n-$FIRST/plants-map.json" --edits "m$n-edits.json" --keep "m$n-$FIRST/surfaces-map.json" | grep -E "THE GROUND AS|WALK . AGAINST|THE PHONE'S OWN LABELS|OWN COLOUR|PLANTS ON THE SAME|owner's erasures|SECOND LABELLER|THE COLOUR, WALK|OWNER'S ERASURES|Kept for|BUILT|built things|ARCORE|SPECKS|THE FILL|GAPS FILLED|LIDAR'S SHAPES|SHAPES MADE|YARD LABELS|AWAY FROM EVERY|WALLS AGAINST" | cut -c1-1500 | tee -a after.txt || true
            # (S3 run 5, 2026-11-26: cast to 12 m with the smoothed depth in the raw one's holes, the two walks both called
            # 3,937 sq ft and agreed on 94.8% of it; as before, 1,128 sq ft and 93.5%. So kept that way. docs/SCAN-PLAN.md 74)
            node scan/tools/surfaces-keep.mjs "$FIRST" "m$n-$FIRST" | tee -a after.txt || true
            # each walk names the walks of its map, for the 3D view of them all together
            node -e "require('fs').writeFileSync('mapwalks.json', JSON.stringify({ v: 1, walks: process.argv[1].split(',') }))" "$LINE"
            for W in ${LINE//,/ }; do node scan/tools/twin-r2.mjs put "$W" mapwalks.json > /dev/null || true; done
            node scan/tools/after-walk.mjs done "$LINE" "m$n-$FIRST" | tee -a after.txt
            rm -rf m$n-*
          done < after-plan.txt
      - name: The answer
        if: ${{ always() }}
        run: |
          echo "--------------------------------------------------------------"
          if [ -s adopt.txt ]; then cat adopt.txt; fi
          if [ -s after.txt ]; then cut -c1-600 after.txt; else echo "No walk is new: nothing was made again."; fi
