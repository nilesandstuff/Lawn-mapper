name: 1. Preflight checks

# Everything that needs a real internet connection to verify, run somewhere
# that has one. Safe to run as often as you like: it reads, never writes, and
# never deploys or spends anything.
on:
  workflow_dispatch:

jobs:
  preflight:
    name: Check before deploying
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Maths tests (area, lawn tracing, CI config)
        run: npm test

      - name: Does the AI model still exist?
        env:
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_TOKEN }}
        run: node tools/check-replicate.js

      # The county servers are small public assets that go down, move, and get
      # republished without notice, and this step used to swallow every failure
      # on that reasoning. It swallowed a real one: Kent answered no parcel at
      # any of its three test points and the run went green, so the broken
      # config deployed and Grand Rapids lost its property lines for hours.
      #
      # The probe now tells the two apart. A county with no service configured
      # is a documented state and stays silent; a county that HAS one and
      # answers nothing anywhere has stopped working, and that fails here.
      - name: Are the county property-line servers reachable?
        run: npm run probe:counties

      # Only meaningful once someone has added the key, and a key that has just
      # been created in the Cloud console fails in four different ways that look
      # identical inside the app. Google names the one that applies; this puts
      # its sentence on screen and, where the sentence is a known one, the
      # click that fixes it.
      #
      # continue-on-error because Google is optional: a missing or misconfigured
      # key must not stand between anyone and a working deploy. The step is not
      # gated on the secret existing, because the `secrets` context cannot be
      # read from an `if:` -- the tool says "not configured, skipping" instead.
      - name: Does the Google satellite key work?
        continue-on-error: true
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}
        run: node tools/check-google.js

      - name: What to do next
        if: success()
        run: |
          echo "Preflight passed."
          echo
          echo "Every configured county printed an acreage -- the check above"
          echo "now fails if one of them answers nothing, rather than saying so"
          echo "in a run that goes green anyway. Newaygo has no public parcel"
          echo "server and is expected to be absent; those addresses fall back"
          echo "to drawing by hand, which measures just as accurately."
          echo
          echo "Next: run the '2. Deploy' workflow."
