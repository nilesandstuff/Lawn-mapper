name: 39. Does a county photo stretch against Mapbox

# Each locked lot's frame photo registered to Mapbox's photo of the same box,
# patch by patch (public/lib/register.js), and the field of offsets reported
# across the lot: does it change from one side to the other, is one photo
# wider than the other (owner, 2026-10-19: traces "line up on one side of the
# property but they'd be off on the other side, or the whole property would
# just be slightly larger/smaller between different photo sources, or both").
# Lots traced on Mapbox are the control. Nothing changes on the site.
#
# FREE: GitHub's own CPU runner; Mapbox is asked once per lot.
on:
  workflow_dispatch:
    inputs:
      lawns:
        description: 'Which lawns'
        required: false
        default: 'locked'
        type: choice
        options: [locked, all]

jobs:
  check:
    name: Each frame's photo against Mapbox's
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/train-detector.js

      - name: Register each frame's photo to Mapbox's
        env:
          FRAMES: frames
          OUT: photo-distortion
        run: node tools/photo-distortion.js

      - name: Keep the measurements and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photo-distortion
          path: photo-distortion/*
          if-no-files-found: ignore
