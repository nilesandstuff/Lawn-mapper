name: 19. Find the tree canopy

# Where the tree canopy is, on every approved lawn, drawn over the map somebody
# traced by hand.
#
# WHAT IT IS FOR. Stage 2 of the four-stage plan in docs/DETECTOR-FINDINGS.md:
# the detector finds grass it can SEE, this finds canopy, and the stage after
# decides where lawn continues underneath.
#
# IT USED TO REPORT CROWNS AND NO LONGER DOES. The model is semantic -- tree or
# no tree, per pixel -- so the crowns came out of a watershed with a gap
# parameter somebody chose here, and every count it produced was partly a fact
# about that number. It was published as a result anyway. What it reports now
# is canopy, plus its contiguous patches, which are not trees. See H18 and H19.
#
# WHY IT RUNS HERE RATHER THAN IN THE WORKER. A V8 isolate cannot host a
# PyTorch model, and workflow 18 established that nothing on Replicate does
# per-tree segmentation, so calling one per address would mean publishing a
# cog and paying per prediction for ever. The tracing queue is known in advance
# -- lawns sit at 'approved' before anybody opens them -- so the work can be
# done here, where the time is free, and the answer stored.
#
# FREE. Python and the weights are downloads. No predictions are bought.
#
# THE ANSWER IS THE PICTURES, at /predictions.html -- this run appears in the
# picker at the top, named for the minute it ran and the model it used, and the
# button beside it flips between the canopy outlines and the model's own
# per-pixel answer. Two numbers at the end of the log say how much canopy
# landed on ground somebody traced as lawn AND how much was on the property at
# all; neither is readable without the other. A third says how many lawns had
# to be UPSAMPLED to reach the model's 10 cm, which is the open question about
# this step.
on:
  workflow_dispatch:
    inputs:
      model:
        # b0 is the quick one and b5 the good one. This is a one-off judgement
        # over thirty-one lawns and CPU time in CI costs nothing, so the
        # default is the one that gives the idea its fairest hearing: a weak
        # model producing a ragged canopy would read as the idea failing.
        description: 'Which tree model'
        type: choice
        default: restor/tcd-segformer-mit-b5
        options:
          - restor/tcd-segformer-mit-b5
          - restor/tcd-segformer-mit-b2
          - restor/tcd-segformer-mit-b0
      min_clump:
        # Only affects the patch list that gets drawn. The canopy raster is
        # written whole, speckle included, because stage 3 works on the raster.
        description: 'Smallest canopy patch to outline, in square metres'
        required: false
        default: '4'
      about:
        # Kept with the pictures for ever. The settings above say what was
        # different; only this says what the difference was meant to prove.
        description: 'What is this run testing? (kept with the pictures)'
        required: false
        default: ''

jobs:
  canopy:
    name: Segment the canopy, then draw it
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-trees.txt

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Install the model loader
        run: pip install -r tools/requirements-trees.txt

      # The same frames the detector is trained on, written by the same code,
      # so canopy drawn here lands on exactly the pixels a feature would.
      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          # "native" MEANS WHATEVER R2 HOLDS, AND A NUMBER HERE IS A TRAP.
          #
          # This was 1024 while the stored photographs were 1280, giving away a
          # fifth of the linear resolution for nothing. Raising it to 1280
          # fixed that -- and then workflow 21 re-banked the big lots at 10 cm
          # a pixel, up to 3192 px, and the fixed 1280 threw the entire gain
          # away again: a 319 m lot came straight back down to 24.9 cm a pixel,
          # which is exactly the state H20 describes.
          #
          # The same bug twice, because a CONSTANT was standing where a
          # reference to the source belonged. It follows the photograph now.
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
        run: node tools/train-detector.js

      - name: Find the canopy
        env:
          IMAGES: frames
          OUT: canopy
          MODEL: ${{ inputs.model }}
          MIN_CLUMP_M2: ${{ inputs.min_clump }}
        run: python3 tools/tree-canopy.py

      # KEPT EVEN IF THE DRAWING FAILS, because the segmentation is seventeen
      # minutes and the drawing is eight seconds. The first time the second
      # step broke it threw away the first step's work, which is a bad trade to
      # make twice.
      #
      # AS ONE TARBALL, because a lawn's id is its coordinates and its method --
      # "-77.6,38.7:sam3:find" -- and upload-artifact rejects a colon in a file
      # name outright. Uploading the directory took the whole run down with it
      # on the attempt after the one it was written to protect. A tar keeps the
      # names it was given.
      - name: Pack the canopy up
        if: always()
        continue-on-error: true
        run: tar -czf canopy.tar.gz canopy/ || true

      - name: Keep the canopy whatever happens next
        if: always()
        # AND NEVER FAIL THE RUN FOR IT. This step exists to save somebody
        # else's work; it has no business ending the job.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: canopy
          path: canopy.tar.gz
          if-no-files-found: warn

      - name: Draw it over the traced lawns
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          CANOPY: canopy
          MODEL: ${{ inputs.model }}
          MIN_CLUMP_M2: ${{ inputs.min_clump }}
          RUN_ABOUT: ${{ inputs.about }}
        run: node tools/tree-canopy.js

      - name: If that failed
        if: failure()
        run: |
          echo "Nothing was spent finding this out."
          echo
          echo "The usual reasons, in order:"
          echo "  * the runner could not reach the weights (huggingface.co)"
          echo "  * scale.json missing from the frames, which means the dump"
          echo "    step failed first -- the canopy refuses to be found at an"
          echo "    unknown ground size rather than be found at the wrong one"
          echo "  * mit-b5 ran out of memory; try b2 or b0 before concluding"
          echo "    anything about the idea"
