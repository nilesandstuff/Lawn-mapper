name: 29. What the tree labels say

# THE TREE LABELS, READ (owner, 2026-10-05). Reads every map labelled on
# /trees.html (trees/labels/ in R2) against its photo and answers the two
# questions the labels exist for (findings S22): can a crown's colour and
# texture tell a BARE tree from one IN LEAF (option #1), and which features
# tell an EVERGREEN from a broadleaf in leaf (option #4). Every score is held
# out by map. Free: nothing but downloads and arithmetic. Re-run it as more
# maps are labelled.
on:
  workflow_dispatch:
    inputs:
      min_crown_m2:
        description: 'Smallest painted crown to count, in square metres'
        required: false
        default: '2'
      lidar:
        # FIRST RETURNS AGAINST LATER ONES (owner, 2026-10-05): the 3DEP point
        # cloud under each crown, by return number (tools/tree_lidar.py), to
        # tell an evergreen (pulses stop in it) from a broadleaf. Adds the
        # frame dump and the point downloads, ~20-30 minutes.
        description: 'Also read the lidar under each crown'
        type: choice
        default: 'on'
        options: ['on', 'off']

jobs:
  read:
    name: Read the tree labels
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save
      - uses: actions/setup-python@v5
        if: inputs.lidar == 'on'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-lidar.txt
      - name: Install the lidar reader
        if: inputs.lidar == 'on'
        run: pip install -r tools/requirements-lidar.txt numpy
      - name: Check the reader
        run: |
          node tools/tree-labels.test.js
          if [ "${{ inputs.lidar }}" = on ]; then (cd tools && python3 tree_lidar_test.py); fi

      # The banked photos' frames and their boxes (scale.json), the same ones
      # workflow 28 made the tree maps on, so the lidar lands on the crowns.
      - name: Fetch the lawns and write the frames out
        if: inputs.lidar == 'on'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: all
        run: node tools/train-detector.js
      - name: Match the frames to the 3DEP projects
        if: inputs.lidar == 'on'
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js
      - name: Read the lidar by return
        if: inputs.lidar == 'on'
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          OUT: tree-lidar
        run: python3 tools/tree_lidar.py
      - name: Read the labels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          MIN_CROWN_M2: ${{ inputs.min_crown_m2 }}
          OUT: tree-labels.json
          LIDAR: ${{ inputs.lidar == 'on' && 'tree-lidar' || '' }}
        run: node tools/tree-labels.js
      - name: Keep every crown's numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-labels
          path: tree-labels.json
          if-no-files-found: ignore
