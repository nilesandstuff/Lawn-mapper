name: 29. What the tree labels say

# THE TREE LABELS, READ (owner, 2026-10-05). Reads every map labelled on
# /trees.html (trees/labels/ in R2) against its photo and answers the two
# questions the labels exist for (findings S22): can a crown's colour and
# texture tell a BARE tree from one IN LEAF (option #1), and which features
# tell an EVERGREEN from a broadleaf in leaf (option #4). Every score is held
# out by map. Free: nothing but downloads and arithmetic. Re-run it as more
# maps are labelled.
on:
  workflow_dispatch:
    inputs:
      min_crown_m2:
        description: 'Smallest painted crown to count, in square metres'
        required: false
        default: '2'

jobs:
  read:
    name: Read the tree labels
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save
      - name: Check the reader
        run: node tools/tree-labels.test.js
      - name: Read the labels
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          MIN_CROWN_M2: ${{ inputs.min_crown_m2 }}
          OUT: tree-labels.json
        run: node tools/tree-labels.js
      - name: Keep every crown's numbers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tree-labels
          path: tree-labels.json
          if-no-files-found: ignore
