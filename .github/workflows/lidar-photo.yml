name: 38. Does the lidar sit on the photo

# The lidar's ground matched to each locked lot's photo with the shade map's
# matcher (public/shade/align.js): one shift for the frame, then each quarter
# alone, so a stretched or skewed photo shows as quarters that disagree
# (owner, 2026-10-19: traces "line up on one side of the property but they'd
# be off on the other"; "lidar has been at least somewhat misaligned this
# whole time"). Overture's footprints are drawn as published and moved by
# the same shift. Nothing is trained and nothing changes on the site.
#
# FREE: GitHub's own CPU runner. Public EPT clouds only, read in Node.
on:
  workflow_dispatch:
    inputs:
      lawns:
        description: 'Which lawns'
        required: false
        default: 'locked'
        type: choice
        options: [locked, all]

jobs:
  check:
    name: The lidar's ground against each photo
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/train-detector.js

      - name: Match the frames to the 3DEP projects
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js

      - name: Plan the newest flight over each frame
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          MODE: newest
        run: node tools/lidar-newest.js

      - name: Match the lidar's ground to each photo
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          OUT: lidar-photo
        run: node tools/lidar-photo.js

      - name: Keep the measurements and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidar-photo
          path: lidar-photo/*
          if-no-files-found: ignore
