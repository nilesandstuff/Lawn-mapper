name: 38. Does the lidar sit on the photo

# The lidar's ground matched to each locked lot's photo with the shade map's
# matcher (public/shade/align.js): one shift for the frame, then each quarter
# alone, so a stretched or skewed photo shows as quarters that disagree
# (owner, 2026-10-19: traces "line up on one side of the property but they'd
# be off on the other"; "lidar has been at least somewhat misaligned this
# whole time"). Overture's footprints are drawn as published and moved by
# the same shift. Nothing is trained and nothing changes on the site.
#
# FREE: GitHub's own CPU runner. Public EPT clouds only, read in Node.
on:
  workflow_dispatch:
    inputs:
      lawns:
        description: 'Which lawns'
        required: false
        default: 'locked'
        type: choice
        options: [locked, all]

jobs:
  check:
    name: The lidar's ground against each photo
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write   # the pictures go to a branch a phone can open
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install the image decoders
        run: npm install pngjs jpeg-js --no-save

      - name: Fetch the lawns and write the frames out
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          DUMP_FRAMES: frames
          DUMP_SIZE: native
          NO_BACKBONE: 'true'
          LAWN_SET: ${{ inputs.lawns }}
        run: node tools/train-detector.js

      - name: Match the frames to the 3DEP projects
        env:
          FRAMES: frames
          OUT: lidar-plan.json
        run: node tools/lidar-plan.js

      - name: Plan the newest flight over each frame
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          MODE: newest
        run: node tools/lidar-newest.js

      - name: Match the lidar's ground to each photo
        env:
          FRAMES: frames
          PLAN: lidar-plan.json
          OUT: lidar-photo
          PICTURES: '30'
        run: node tools/lidar-photo.js

      # An artifact is a zip nobody opens on a phone; a branch of PNGs opens in
      # the GitHub app. Force-pushed, one branch per run, so history never grows.
      - name: Publish the pictures where a phone can see them
        if: always()
        run: |
          set -e
          b="pictures/lidar-photo-${{ github.run_number }}"
          d=$(mktemp -d)
          cp -r lidar-photo/pictures "$d/" 2>/dev/null || { echo "no pictures"; exit 0; }
          cp lidar-photo/*.json "$d/" 2>/dev/null || true
          git -C "$d" init -q -b "$b"
          git -C "$d" -c user.name=actions -c user.email=actions@users.noreply.github.com add -A
          git -C "$d" -c user.name=actions -c user.email=actions@users.noreply.github.com commit -qm "Pictures from run ${{ github.run_id }}"
          git -C "$d" push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "HEAD:refs/heads/$b"
          echo "PICTURES: https://github.com/${{ github.repository }}/tree/$b/pictures"

      - name: Keep the measurements and the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lidar-photo
          path: lidar-photo/*
          if-no-files-found: ignore
