name: 8. Check the free imagery sources

# Asks Esri and USGS what they actually serve for one of our frames, and
# whether the extent they return is the extent we asked for. Read-only and
# free: public services, some metadata and two small images.
on:
  workflow_dispatch:

jobs:
  imagery:
    name: Probe Esri and USGS imagery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: node tools/probe-imagery.js
