name: 8. Check the free imagery sources

# Two questions about aerial photographs, both free (public servers and the
# Mapbox static tier the app already uses), both on GitHub's runner.
#
#   check one frame          (the original) asks Esri and USGS what they serve
#                            for one of our frames, and whether the extent they
#                            return is the extent we asked for.
#
#   compare on our lawns     (owner, 2026-10-01) for every approved lot,
#                            fetches the same frame from Mapbox, NAIP, every
#                            USGS imagery service and the newest imagery on the
#                            lot's own county GIS server, and compares each
#                            with Mapbox: detail, offset, native resolution,
#                            year, a rough season hint. Also counts the maps
#                            drawn on each source, for the Google question.
#                            The answer is the end of the log; per-lot results
#                            are the imagery-probe artifact.
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'Which question'
        type: choice
        options:
          - check one frame
          - compare on our lawns
        default: check one frame
      how_many:
        description: 'compare: how many approved lots (newest first)'
        required: false
        default: '60'

jobs:
  imagery:
    name: Probe the imagery sources
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Check one frame
        if: inputs.what != 'compare on our lawns'
        run: node tools/probe-imagery.js

      - name: Install what the comparison needs
        if: inputs.what == 'compare on our lawns'
        run: |
          npm ci
          npm install pngjs jpeg-js --no-save

      - name: Compare the sources, lot by lot
        if: inputs.what == 'compare on our lawns'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          HOW_MANY: ${{ inputs.how_many }}
        run: node tools/compare-imagery.js

      - name: Keep the per-lot results
        if: always() && inputs.what == 'compare on our lawns'
        uses: actions/upload-artifact@v4
        with:
          name: imagery-probe
          path: imagery-probe.json
          if-no-files-found: ignore
