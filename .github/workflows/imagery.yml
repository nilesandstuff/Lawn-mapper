name: 8. Check the free imagery sources

# Two questions about aerial photographs, both free (public servers and the
# Mapbox static tier the app already uses), both on GitHub's runner.
#
#   check one frame          (the original) asks Esri and USGS what they serve
#                            for one of our frames, and whether the extent they
#                            return is the extent we asked for.
#
#   compare on our lawns     (owner, 2026-10-01) for every approved lot,
#                            fetches the same frame from Mapbox, NAIP, every
#                            USGS imagery service and the newest imagery on the
#                            lot's own county GIS server, and compares each
#                            with Mapbox: detail, offset, native resolution,
#                            year, a rough season hint. Also counts the maps
#                            drawn on each source, for the Google question.
#                            The answer is the end of the log; per-lot results
#                            are the imagery-probe artifact.
#
#   find county imagery      (owner, 2026-10-01) the county photo CATALOGUE:
#                            which services publish a photo over each county,
#                            by place and by name, looked at and measured, for
#                            the editor to offer (county mode: catalogue, names,
#                            season, lidar). The pair banking that once lived
#                            here -- a county photo lined up and banked beside
#                            each map's Mapbox one -- was retired 2026-10-09:
#                            one map, one photo. tools/county-imagery.js
on:
  workflow_dispatch:
    inputs:
      what:
        description: 'Which question'
        type: choice
        options:
          - check one frame
          - compare on our lawns
          - find county imagery
        default: check one frame
      how_many:
        description: 'compare: how many approved lots (newest first)'
        required: false
        default: '60'
      county_mode:
        description: 'county: catalogue (services for any address; county_limit = how many counties), names (every county in states with statewide parcels, searched by name), season (what each catalogued service says about leaf-off and flight dates), or lidar (which counties with a county photo also have 3DEP lidar, when and in what season). The pair banking (find, realign, rebank) was retired 2026-10-09: one map, one photo.'
        type: choice
        options:
          - catalogue
          - names
          - season
          - lidar
        default: catalogue
      county_only:
        description: 'county catalogue: just these county keys now, comma-separated (e.g. id-blaine)'
        type: string
        default: ''
      county_limit:
        description: 'county: how many corpus maps at most (newest first)'
        required: false
        default: '500'
      county_force:
        description: 'county: look again at maps already looked at'
        type: boolean
        default: false
      county_dry_run:
        description: 'county: fetch and report, write nothing'
        type: boolean
        default: false

jobs:
  imagery:
    name: Probe the imagery sources
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Check one frame
        if: inputs.what == 'check one frame' || inputs.what == ''
        run: node tools/probe-imagery.js

      - name: Install what the comparison needs
        if: inputs.what == 'compare on our lawns'
        run: |
          npm ci
          npm install pngjs jpeg-js --no-save

      - name: Compare the sources, lot by lot
        if: inputs.what == 'compare on our lawns'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
          HOW_MANY: ${{ inputs.how_many }}
        run: node tools/compare-imagery.js

      - name: Install what the county pass needs
        if: inputs.what == 'find county imagery'
        run: |
          npm ci
          npm install pngjs jpeg-js proj4 --no-save

      - name: The county photo catalogue
        if: inputs.what == 'find county imagery'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CORPUS_BUCKET: lawn-mapper-corpus
          MODE: ${{ inputs.county_mode }}
          ONLY_KEY: ${{ inputs.county_only }}
          LIMIT: ${{ inputs.county_limit }}
          FORCE: ${{ inputs.county_force }}
          DRY_RUN: ${{ inputs.county_dry_run }}
        run: node tools/county-imagery.js

      - name: Keep the county results
        if: always() && inputs.what == 'find county imagery'
        uses: actions/upload-artifact@v4
        with:
          name: county-imagery
          path: |
            county-imagery.json
            county-lidar.json
          if-no-files-found: ignore

      - name: Keep the per-lot results
        if: always() && inputs.what == 'compare on our lawns'
        uses: actions/upload-artifact@v4
        with:
          name: imagery-probe
          path: imagery-probe.json
          if-no-files-found: ignore
