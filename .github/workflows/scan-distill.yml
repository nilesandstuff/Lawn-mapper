name: S5. The phone's ground labeller, taught

# THE SMALL GROUND LABELLER, TAUGHT BY THE LARGE ONE (core session, 2026-11-26; scan/tools/distill_modal.py says why).
# The walks given must have the large labeller's classes (workflow S, task classes). Their pictures and those classes go
# to Modal's GPU, where SegFormer-B0 is taught to give them; measured on a walk it was not taught on; written out as ONNX
# and kept in the twin bucket under models/. MODAL IS PAID: from the core session's $15 for the AR work (the owner,
# 2026-11-26: "That $15 modal usage is yours to spend how you choose"), its running total in docs/SCAN-PLAN.md.
# The log carries counts, shares and seconds only: no pictures, no places.
on:
  workflow_dispatch:
    inputs:
      walks:
        description: 'Walks with the large labeller classes, comma separated (the last is held out to measure)'
        required: true
      epochs:
        description: 'Passes over the pictures'
        default: '14'

permissions:
  contents: read

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: The pictures and the large labeller's classes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WALKS: ${{ inputs.walks }}
        run: |
          set -o pipefail
          pip install --quiet modal numpy scipy pillow "transformers>=4.45,<5"
          : > distill.txt; DIRS=""
          for W in $(echo "$WALKS" | tr ',' ' '); do
            [[ "$W" =~ ^[0-9]{13}$ ]] || { echo "not a walk id"; exit 1; }
            node scan/tools/twin-r2.mjs parts "$W" "w-$W" 'cloud-*' 'labels-*' 'keys-*' 'key-*.jpg' segments-masks.npz | tail -1 | tee -a distill.txt
            DIRS="$DIRS w-$W"
          done
          python scan/tools/distill_prep.py data.npz $DIRS | tee -a distill.txt
      - name: Taught on Modal's GPU
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          EPOCHS: ${{ inputs.epochs }}
        run: |
          set -o pipefail
          [[ "$EPOCHS" =~ ^[0-9]{1,3}$ ]] || EPOCHS=14
          modal run scan/tools/distill_modal.py --data data.npz --out out --epochs "$EPOCHS" 2>&1 | grep -v -i 'key-[0-9]' | tail -40 | tee -a distill.txt
      - name: Kept for the phone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          node scan/tools/model-put.mjs out/ground-labeller.onnx ground-labeller-v1.onnx | tee -a distill.txt
          if [ -f out/ground-labeller-8bit.onnx ]; then node scan/tools/model-put.mjs out/ground-labeller-8bit.onnx ground-labeller-v1-8bit.onnx | tee -a distill.txt; fi
          node scan/tools/model-put.mjs out/numbers.json ground-labeller-v1.json | tee -a distill.txt
      - name: The answer
        if: always()
        run: |
          echo "--------------------------------------------------------------"
          cat distill.txt 2>/dev/null | cut -c1-1500 || echo "nothing: see the steps above"
