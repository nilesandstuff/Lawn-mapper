name: 35. Shade map -- are the light readings arriving

# The owner's phone (Sensor Logger) posts light, GPS and orientation to
# /api/shade/readings as he works. This says whether they are getting
# through: the latest recordings, how many readings each holds, and how long
# ago the last one came in. Counts and times only -- no locations (these are
# tracks over customers' lawns).
#
# FREE. One read-only query. Features session's tool (tools/shade-readings.js).
# With `from` and `to` (local times today, e.g. 12:38 and 12:42), also every
# second in that window: lux, the phone's tilt and the sun's angle off its
# face -- for the tilt tests. The sun is placed from fixes not printed.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Window start (HH:MM local, optional)'
        required: false
        default: ''
      to:
        description: 'Window end (HH:MM local, optional)'
        required: false
        default: ''
      levels:
        description: 'Also today, half an hour at a time: the sun level facing the phone, sun/shade counts (yes/no)'
        required: false
        default: 'no'
      lidar:
        description: 'Also the lidar under today''s tracks: when flown, and any newer flight not used (yes/no)'
        required: false
        default: 'no'
      check:
        description: 'Also score a day''s readings against the model, visit by visit, and where the model is sure (yes/no)'
        required: false
        default: 'no'
      day:
        description: 'The day for the check (YYYY-MM-DD, blank = today)'
        required: false
        default: ''
      photos:
        description: 'Also score that day''s stops against the county photos and Mapbox: trees gone or grown since the lidar (yes/no; slow, about 3 minutes a 120 m square)'
        required: false
        default: 'no'
      stops:
        description: 'For the photos: at most this many stops (blank = all)'
        required: false
        default: ''
      fill:
        description: 'For the check: a leaf fill to try, as JSON (blank = as shipped), e.g. {"closeR":0,"topR":0}'
        required: false
        default: ''
      foot:
        description: 'For the check: the day was recorded on foot, the phone held about 3.5 ft up and tilted toward the sun (yes/no): tilt allowed, fixes to 15 m, no truck'
        required: false
        default: 'no'

jobs:
  readings:
    name: Read the latest recordings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          LEVELS: ${{ inputs.levels }}
          LIDAR: ${{ inputs.lidar }}
        run: node tools/shade-readings.js
      - name: Score the day against the model
        if: ${{ inputs.check == 'yes' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAY: ${{ inputs.day }}
          SHADE_FILL: ${{ inputs.fill }}
          SHADE_FOOT: ${{ inputs.foot == 'yes' && '1' || '' }}
          SHADE_TILT: ${{ inputs.foot == 'yes' && '90' || '' }}
          SHADE_ACC: ${{ inputs.foot == 'yes' && '15' || '' }}
          PHONE_M: ${{ inputs.foot == 'yes' && '1.07' || '' }}
        run: node tools/shade-field-check.js
      - name: The stops' lidar against newer photos
        if: ${{ inputs.photos == 'yes' }}
        timeout-minutes: 330
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAY: ${{ inputs.day }}
          MAX_STOPS: ${{ inputs.stops }}
          # The live site refuses GitHub's runners (403), so the photos come
          # straight from Mapbox and the county's image server.
          DIRECT_PHOTOS: '1'
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          MAPBOX_SERVER_TOKEN: ${{ secrets.MAPBOX_SERVER_TOKEN }}
        run: node tools/shade-field-photos.js
