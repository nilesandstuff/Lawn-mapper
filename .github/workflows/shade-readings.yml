name: 35. Shade map -- are the light readings arriving

# The owner's phone (Sensor Logger) posts light, GPS and orientation to
# /api/shade/readings as he works. This says whether they are getting
# through: the latest recordings, how many readings each holds, and how long
# ago the last one came in. Counts and times only -- no locations (these are
# tracks over customers' lawns).
#
# FREE. One read-only query. Features session's tool (tools/shade-readings.js).
# With `from` and `to` (local times today, e.g. 12:38 and 12:42), also every
# second in that window: lux, the phone's tilt and the sun's angle off its
# face -- for the tilt tests. The sun is placed from fixes not printed.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Window start (HH:MM local, optional)'
        required: false
        default: ''
      to:
        description: 'Window end (HH:MM local, optional)'
        required: false
        default: ''
      levels:
        description: 'Also today, half an hour at a time: the sun level facing the phone, sun/shade counts (yes/no)'
        required: false
        default: 'no'
      lidar:
        description: 'Also the lidar under today''s tracks: when flown, and any newer flight not used (yes/no)'
        required: false
        default: 'no'

jobs:
  readings:
    name: Read the latest recordings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Read them
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          LEVELS: ${{ inputs.levels }}
          LIDAR: ${{ inputs.lidar }}
        run: node tools/shade-readings.js
