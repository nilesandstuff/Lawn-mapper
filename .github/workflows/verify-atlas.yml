name: 10. Verify atlas counties

# Proves the imported parcel endpoints before the app claims any of them, and
# rewrites worker/src/counties-atlas.js with whatever passed.
#
# Free to run: it issues read-only GETs against public county map servers, at a
# deliberately gentle rate. No AI, no Replicate, nothing to spend.
#
# Takes a while -- roughly three requests per county across 160 of them.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'One county key (mi-kent) or a state prefix (mi) for a spot check. Blank = all, and only a full run writes the file.'
        required: false
        default: ''
      commit:
        description: 'Commit the regenerated file back to this branch'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  verify:
    name: Query every candidate county
    runs-on: ubuntu-latest
    # A spot check is quick; the full sweep is 160 counties at three requests
    # each with a pause between, and the default 360 would cut it off partway
    # through and commit a half-empty file.
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Verify
        env:
          ONLY: ${{ inputs.only }}
        run: node tools/verify-atlas.js

      # KEEP THE RESULT EVEN IF THE PUSH FAILS. The sweep is twenty-odd minutes
      # of real queries against a hundred and sixty public county servers, and
      # it has now been thrown away twice by git problems that have nothing to
      # do with the counties. An artifact costs nothing and means the worst
      # case is downloading a file rather than re-running the sweep.
      #
      # `always()` on purpose: the run this exists for is the one that failed.
      - name: Keep the generated file whatever happens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: counties-atlas
          path: worker/src/counties-atlas.js
          if-no-files-found: warn

      # Only on a full run: verify-atlas.js writes nothing when ONLY is set,
      # so committing then would push an unchanged file and a confusing commit.
      - name: Commit the result
        if: inputs.commit == 'true' && inputs.only == ''
        run: |
          if git diff --quiet -- worker/src/counties-atlas.js; then
            echo "No change to counties-atlas.js."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # THE BRANCH MOVES WHILE THIS RUNS, and the previous answer to that
          # was a rebase, which was wrong twice over.
          #
          # Wrong on the merge: a rebase asks git to reconcile two versions of
          # this file, and git has no basis for doing that. The file is
          # GENERATED -- the sweep that just ran is the only authority on what
          # belongs in it, and anything else on the branch is either an older
          # sweep or a hand edit that the header asks nobody to make. There is
          # nothing to reconcile; the fresh one wins outright.
          #
          # Wrong on the retry: a conflicted rebase stays conflicted. Attempts
          # two and three could not even begin -- "Pulling is not possible
          # because you have unmerged files" -- so a loop that looked like
          # three chances was one chance and two echoes.
          #
          # So: copy the result somewhere git cannot reach, reset hard onto
          # whatever the branch is NOW, put the file back, commit that. No
          # merge happens, so no merge can fail, and each retry re-reads the
          # branch rather than retrying a broken state.
          cp worker/src/counties-atlas.js "$RUNNER_TEMP/counties-atlas.js"

          for attempt in 1 2 3; do
            # `if !` rather than a bare call: this step runs under `bash -e`,
            # where a plain failing command ends the script -- so a fetch that
            # lost the network would take the two remaining attempts with it.
            if ! git fetch origin "$GITHUB_REF_NAME"; then
              echo "Attempt $attempt: could not reach origin. Retrying."
              sleep 5
              continue
            fi
            # FETCH_HEAD, not origin/<branch>: it is what the fetch just wrote,
            # with no dependence on remote-tracking refs being updated.
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/counties-atlas.js" worker/src/counties-atlas.js

            # Somebody else may have landed this exact content already, or the
            # branch may have moved to a commit that already carries it. Either
            # way there is nothing to push and that is a success, not a no-op
            # to report as failure.
            if git diff --quiet -- worker/src/counties-atlas.js; then
              echo "The branch already carries this exact file."
              exit 0
            fi

            git add worker/src/counties-atlas.js
            git commit -m "Regenerate the verified atlas counties

          Written by tools/verify-atlas.js: every county here answered a point
          query inside one of its own parcels with a parcel-sized polygon.

          Co-Authored-By: Claude Opus 5 <noreply@anthropic.com>"
            git push && exit 0

            echo "Push $attempt failed; the branch moved again. Retrying."
            sleep 5
          done
          echo "::error::Could not push the regenerated atlas after three tries."
          echo "::error::The file is on this run as the 'counties-atlas' artifact."
          exit 1
