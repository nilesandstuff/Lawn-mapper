<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Walk Twin</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #f6f8f7; --fg: #17201c; --dim: #5b6b63; --card: #ffffff; --line: #d7dfdb; --accent: #1b7f4b; --warn: #b4561a; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101614; --fg: #e6ece9; --dim: #9aa9a2; --card: #18201d; --line: #2c3833; --accent: #4cc38a; --warn: #f0a060; } }
  :root[data-theme="dark"] { --bg: #101614; --fg: #e6ece9; --dim: #9aa9a2; --card: #18201d; --line: #2c3833; --accent: #4cc38a; --warn: #f0a060; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 16px 16px 40px; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .dim { color: var(--dim); } .warn { color: var(--warn); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 12px 0; }
  a { color: var(--accent); }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 12px; background: var(--accent); color: #fff; cursor: pointer; }
  button.plain { background: transparent; color: var(--fg); border: 1px solid var(--line); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
  label { display: inline-flex; gap: 6px; align-items: center; font-size: .95rem; }
  #wrap { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--line); touch-action: none; background: #2a332f; }
  #map { display: block; width: 100%; height: auto; }
  #pic { width: 100%; border-radius: 8px; display: block; }
  input[type=range] { width: 100%; }
  .key { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  ul { padding-left: 20px; } li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <p><a href="/">&larr; Yard AR</a></p>
  <h1>Walk twin</h1>
  <p class="dim" id="status">Loading…</p>
  <div id="list"></div>
  <section id="view" hidden>
    <div class="tools">
      <label><input type="checkbox" id="show-photo" checked> Photo</label>
      <label><input type="checkbox" id="show-lidar" checked> Lidar</label>
      <label><input type="checkbox" id="show-ground"> Phone's ground</label>
      <label><input type="checkbox" id="show-stand" checked> Phone's walls etc.</label>
      <label><input type="checkbox" id="show-high" checked> Phone's high points</label>
      <label><input type="checkbox" id="show-track" checked> Track</label>
    </div>
    <div class="tools">
      <label>Placed by <select id="fit"><option value="both">lidar fixes, else references</option><option value="refs">references only</option><option value="fixes">lidar fixes only</option></select></label>
      <button type="button" class="plain" id="zoom-in">+</button><button type="button" class="plain" id="zoom-out">&minus;</button><button type="button" class="plain" id="zoom-fit">Fit</button>
    </div>
    <div id="wrap"><canvas id="map" width="1280" height="1280"></canvas></div>
    <p class="dim" style="font-size:.85rem"><span class="key" style="background:#3b82f6"></span>lidar walls, fences, trunks <span class="key" style="background:#f97316"></span>lidar roofs <span class="key" style="background:#ef4444"></span>phone: standing <span class="key" style="background:#facc15"></span>phone: high <span class="key" style="background:#cbd5e1"></span>phone: ground <span class="key" style="background:#22d3ee"></span>track</p>
    <div class="card" id="numbers"></div>
    <div class="card" id="pics" hidden>
      <strong>Pictures</strong> <span class="dim" id="pic-when"></span>
      <input type="range" id="pic-at" min="0" max="0" value="0" aria-label="Which picture">
      <img id="pic" alt="What the camera saw">
    </div>
    <div class="tools"><button type="button" class="plain" id="delete">Delete this twin</button></div>
  </section>
</main>
<script type="module" src="/twin-view.js"></script>
</body>
</html>
